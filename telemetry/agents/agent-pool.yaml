notes:
  - "v0.7.0 (2026-09-01): canonical identity key migrated from name to agent_name; all other roster fields and order preserved."
  - "v0.6.0 (2026-07-21): re-synced entries from upstream domainspec-lean-formalization v0.6.0 — 8 name-identity fixes (Crossley->Michael, Glorioso->Paolo, Cancedda->Nicola, Mansfield->Shane, Pohl->Ira, Conant->Roger C., Roff->Emily, Puca->Caterina), new `management` field value (32 entries moved off economics; 15 economists stay), Tetlock ai-ml->psychology, Solomonoff dropped one tag, and 5 unverifiable/fabricated entries removed (Merlin, Pavlov, Gu, Bhattacharya, Yu): 419->414. Header kept in the subagents-strategy framing; entries carried verbatim from upstream."
  - "v0.5.0 (2026-07-20): re-ported from upstream v0.5.0 into cyberalchemy-orchestrator/telemetry/agents/ (alongside the dispatch ledger) as the allowed-names pool the subagents-strategy constitution's `agent_name` field draws from. Header re-framed to subagents-strategy; entries carried verbatim. `cited`/`tags` and canonical-vocabulary paths point at the source repo and are kept for provenance, not as local links."
  - role_fit is a default suggestion; the dispatch may override per-agent.
  - "v0.5.0 (2026-07-20): SCHEMA CHANGE. `where_cited` (provenance paths) replaced by `cited` (bool) + `tags` (topical expertise for dispatch matching). All 419 entries carry >=3 kebab-case tags except 7 roster-flagged stubs. The 721-tag canonical vocabulary lives in research/pool-tagging/canonical-vocabulary.md (regenerated from usage); merge synonyms into it, do not coin free tags. Built via dispatches 2026-07-20-pool-tagging-math-pilot (math, full tagger+reviewer+robot-talk loop) and 2026-07-20-pool-tagging-rollout (other 10 fields, tagger-per-field + one cross-field reviewer)."
  - "(pre-v0.5.0) Where a person appears in many files, only top-3 were listed in where_cited."
  - 'Two known issues to revisit: "Newt, Isaac" corrected to "Newton, Isaac"; duplicate Bekenstein entries deduped; "KCBS" (acronym, not person) removed.'
  - "v0.2.0: role_fit promoted to ordered list (primary, secondary, tertiary) — many scientists wear multiple hats."
  - "v0.4.0 (2026-07-20): added a large batch grouped under the '=== v0.4.0 additions ===' banner below. Two provenance kinds: CITED (where_cited holds a real in-repo path, surfaced by the cited-but-unpooled sweep) and PROPOSED-FOUNDATIONAL (where_cited: [], gap-fillers for software-development/business/statistics/ai-ml not yet cited — same modality as the v0.3.0 curated additions). Dedupe criterion changed from surname to FULL NAME: this recovers surname-homonyms previously blocked — Penrose, Edith (vs Roger); Booch, Grady (vs Ryan Grady); Bell, C. Gordon (vs John S. Bell); Johnson, Ralph (vs Mark Johnson); Yanovski, Lior (vs Noson Yanofsky, distinct spelling). Generators must therefore disambiguate agent_name by full name, not surname."
