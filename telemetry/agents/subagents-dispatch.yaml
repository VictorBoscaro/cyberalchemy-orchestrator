    dispatch_type: "research"
    goal: "Verify first-hand whether octopus-runtime, Eve, and PydanticAI can each survive the Front-3 runtime's two hard invariants (no second source of truth; freeze-before-the-channel) at the layer each serves, so the external-tools discovery rests on primary evidence rather than second-hand web reads."
    context: "docs/discovery/external-tools/README.md parks a build-vs-adopt scouting done in conversation from a single small-model web read per tool; every characterization is second-hand and marked with the magnifying-glass caveat. Each tool serves a different layer (octopus=effect-governance, Eve=runtime-host+adapters, PydanticAI=schemas+judgment) and must survive I1 (a tool's durable store/audit must be subordinate-able to an external event journal, never a competing canonical authority) and I2 (an agent must run one-shot on a frozen snapshot with no shared conversation history), plus the EG-1 single-writer gate. Outputs feed docs/discovery/external-tools/."
    max_loops: 1
    final_approver: "parent"
    anti_bias_global: "external runtimes fit our two invariants (confirm-fit / adopt) vs they do not (falsify-fit / build) — single-authority + freeze-before-channel"
    working_folder: "research/external-tools-verification/"
    groups: [{"group_id":"verifiers","n":2,"anti_bias":"methodology / verification-disposition (confirm-fit vs falsify-fit) over the shared source corpus of all three tools","agents":[{"agent_name":null,"role":"explorer","model":"claude-opus-4-8","token_budget":2200,"angle":"fit-confirmer: reads all three tools' real sources first-hand and builds the strongest honest case that each CAN satisfy its invariant","initial_prompt":"Read-only, first-hand verification. Do NOT trust any second-hand summary. For EACH of the three tools, open and read its actual source and official docs (GitHub repo + official site, via WebFetch/WebSearch) and find the STRONGEST evidence that it CAN satisfy the invariant it must. Return, per check, a verdict RESOLVES | PARTIAL | FAILS with exact evidence (repo file path, doc section, URL, and a short quote). Your disposition is confirm-fit: build the strongest HONEST case that each tool fits (never fabricate; a check with no evidence is FAILS).\n\nTwo invariants everything is measured against: (I1) NO SECOND SOURCE OF TRUTH - a tool's own durable store/audit must be subordinate-able to an EXTERNAL event journal, never a competing canonical authority. (I2) FREEZE-BEFORE-CHANNEL - an agent must be runnable one-shot on a frozen input snapshot with NO shared conversation history.\n\nCHECKS:\noctopus-runtime (github.com/octoryn/octopus-runtime): (a) is the structural autonomy property - a connector's side-effectful `execute` unreachable except on the Autonomous path or after Draft approval - actually enforced in code (show the guard), not merely documented? (b) can octopus-evidence + its durable backend run as a SUBORDINATE effect-audit plane under I1? (c) can governTool() wrap an arbitrary async function (our ledger appender) behind a human Draft-approval gate? (d) real & usable: license, Node>=22, the zero-dependency claim (check package.json), maturity (commits/tests/releases).\nEve (eve.dev + its Workflow SDK): (a) can the Workflow SDK be SUBORDINATED to an external event journal under I1, rather than being the durable source of truth? (b) can an Eve agent run one-shot on a frozen snapshot with NO shared conversation history (I2)? (c) can it drive claude-code-cli / codex-cli as subprocess adapters against a start/events/result/cancel/status contract? (d) real & usable: license, TS, maturity, is the Workflow SDK open-source.\nPydanticAI (ai.pydantic.dev): (a) does output_type cover a sealed judgment record {values:[{tag,confidence}], rationale} bound to a versioned schema + digest? (b) is pydantic-graph state in-memory (thus subordinable under I1)? (c) is its distinctive value (typed evals via pydantic-evals) refoldable into zod if the runtime is TS?\n\nWrite your findings to research/external-tools-verification/fit-confirmer.md as a per-tool table (tool | check | verdict | evidence with URL/quote). Budget ~2200 tokens. Freeze your verdicts independently; do not hedge toward a falsifier."},{"agent_name":null,"role":"skeptic","model":"claude-opus-4-8","token_budget":2200,"angle":"fit-falsifier: reads the SAME sources adversarially and builds the strongest case that each CANNOT satisfy its invariant, assuming each tool wrong until its source proves otherwise","initial_prompt":"Read-only, first-hand ADVERSARIAL verification. Assume each tool is WRONG until its own source proves otherwise. For EACH of the three tools, open and read its actual source and official docs (GitHub repo + official site, via WebFetch/WebSearch) and find the STRONGEST evidence that it CANNOT satisfy the invariant it must. Return, per check, a verdict RESOLVES | PARTIAL | FAILS with exact evidence (repo file path, doc section, URL, short quote). Your disposition is falsify-fit: hunt the failure.\n\nSame two invariants: (I1) NO SECOND SOURCE OF TRUTH - the tool's own durable store/audit must be subordinate-able to an external event journal, never a competing canonical authority. (I2) FREEZE-BEFORE-CHANNEL - an agent must run one-shot on a frozen snapshot with NO shared conversation history.\n\nSAME CHECKS as the confirmer, hunted for the hole:\noctopus-runtime: (a) is the execute guard actually bypassable, or only claimed structural? (b) does octopus-evidence / its durable backend INSIST on being a canonical authority (violating I1)? (c) does governTool() actually admit wrapping our appender, or does it impose its own store? (d) maturity red flags: no tests, no releases, single author, dependency claims false.\nEve: (a) does the Workflow SDK INSIST on being the durable source of truth (violating I1), i.e. is it non-subordinable? (b) is shared conversation history MANDATORY / not suppressible (violating I2)? (c) does it actually fail to drive claude-code-cli/codex-cli against the 5-op contract? (d) license/maturity red flags.\nPydanticAI: (a) does output_type fall short of a sealed versioned judgment record? (b) does pydantic-graph claim durable authority? (c) is the Python split unavoidable and costly beside a TS/JS runtime (appender, agent-pool-mcp)?\n\nWrite your findings to research/external-tools-verification/fit-falsifier.md as a per-tool table (tool | check | verdict | evidence with URL/quote). Budget ~2200 tokens. Freeze independently; do not soften toward the confirmer."}]},{"group_id":"adopt-vs-build","n":2,"anti_bias":"methodology (adopt-by-configuration vs build-forced-by-the-invariants)","agents":[{"agent_name":null,"role":"explorer","model":"claude-opus-4-8","token_budget":1800,"angle":"constructor/adopt: the smallest adoption per layer that satisfies the two invariants + EG-1 gate; names what NOT to build","initial_prompt":"You receive the two frozen verification notes: read research/external-tools-verification/fit-confirmer.md AND fit-falsifier.md first. For EACH of the three layers of the Front-3 runtime - effect-governance (octopus-runtime), runtime-host+adapters (Eve), schemas+judgment (PydanticAI or zod) - argue the SMALLEST adoption that satisfies the two invariants (I1 no second source of truth; I2 freeze-before-channel) plus the EG-1 single-writer gate. Name explicitly what you would NOT build. claim<=proof: every recommendation cites the verification note it rests on; where a check came back FAILS in the notes, concede it rather than adopting around it. Freeze your position independently - do not hedge toward the build case. Write to research/external-tools-verification/adopt-case.md. Budget ~1800 tokens."},{"agent_name":null,"role":"skeptic","model":"claude-opus-4-8","token_budget":1800,"angle":"collapser/build: the two invariants force custom code; attacks each adopt claim and names the falsifier per layer","initial_prompt":"You receive the two frozen verification notes: read research/external-tools-verification/fit-confirmer.md AND fit-falsifier.md first. Argue that the two invariants FORCE custom code. For each layer (effect-governance, runtime-host+adapters, schemas+judgment), attack the adopt case: show where subordinating Eve's Workflow SDK or octopus-evidence to the journal fails or costs more than building; where de-featuring an agent to preserve the freeze (I2) is impossible or fragile; where a tool's convenience is exactly the anti-pattern the design forbids. Name a concrete FALSIFIER per layer (what evidence would prove building is unnecessary). claim<=proof; cite the notes. Freeze independently - do not soften toward the adopt case. Write to research/external-tools-verification/build-case.md. Budget ~1800 tokens."}]}]
