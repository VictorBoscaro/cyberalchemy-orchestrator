<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Relationships Without a Fixed Hierarchy</title>
  <desc id="desc">A representative network of objectives, tasks, decisions, conditions, evidence, and artifacts connected by directed typed relationships, including one uncertain contribution and one known missing relationship.</desc>

  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#1d1915" stroke-width="1.25" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#bd6a50" stroke-width="1.25" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 48px; font-weight: 700; fill: #1d1915; }
      .placement { font-family: Arial, sans-serif; font-size: 18px; letter-spacing: 0; fill: #766f66; }
      .node-label { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; font-weight: 700; fill: #1d1915; }
      .relation { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; font-style: italic; fill: #766f66; }
      .note { font-family: Arial, sans-serif; font-size: 18px; letter-spacing: 0; fill: #766f66; }
      .qualifier { font-family: Arial, sans-serif; font-size: 17px; letter-spacing: 0; fill: #9f3f28; }
      .edge { fill: none; stroke: #1d1915; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-dark); }
      .uncertain { fill: none; stroke: #bd6a50; stroke-width: 2.2; stroke-dasharray: 9 9; stroke-linecap: round; marker-end: url(#arrow-rust); }
      .node { fill: #f4eadb; stroke: #1d1915; stroke-width: 2.4; }
      .node-accent { fill: #f4eadb; stroke: #9f3f28; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f4eadb"/>

  <g id="heading">
    <line x1="112" y1="78" x2="178" y2="78" stroke="#9f3f28" stroke-width="8" stroke-linecap="round"/>
    <text x="112" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#1d1915">Relationships Without a Fixed Hierarchy</text>
    <text x="114" y="181" font-family="Arial, sans-serif" font-size="18" fill="#766f66">SECTION 4  /  A SYSTEM FOR WORK</text>
    <line x1="112" y1="210" x2="1488" y2="210" stroke="#c9b9a4" stroke-width="1.5"/>
  </g>

  <g id="relations">
    <!-- Task X contributes to Objective A. -->
    <path d="M 720 468 C 626 377, 480 321, 321 309" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
    <polyline points="336,302 321,309 335,316" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="448" y="350" width="155" height="34" fill="#f4eadb"/>
    <text x="458" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#766f66">contributes to</text>

    <!-- The second contribution is recorded but uncertain or disputed. -->
    <path d="M 755 466 C 866 361, 1038 304, 1225 309" fill="none" stroke="#bd6a50" stroke-width="2.2" stroke-dasharray="9 9" stroke-linecap="round" marker-end="url(#arrow-rust)"/>
    <polyline points="1210,301 1225,309 1210,316" fill="none" stroke="#bd6a50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="885" y="338" width="155" height="34" fill="#f4eadb"/>
    <text x="894" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#9f3f28">contributes to</text>
    <rect x="902" y="374" width="172" height="27" fill="#f4eadb"/>
    <text x="909" y="393" font-family="Arial, sans-serif" font-size="17" fill="#9f3f28">uncertain or disputed</text>

    <!-- Task X depends on Task Y. -->
    <path d="M 770 500 C 899 497, 1033 518, 1162 552" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
    <polyline points="1149,542 1162,552 1146,556" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="920" y="492" width="121" height="34" fill="#f4eadb"/>
    <text x="928" y="516" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#766f66">depends on</text>

    <!-- Decision shapes Task X. -->
    <path d="M 441 654 C 529 611, 621 551, 716 488" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
    <polyline points="699,489 716,488 708,503" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="478" y="574" width="225" height="34" fill="#f4eadb"/>
    <text x="487" y="598" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#766f66">shapes / gives meaning to</text>

    <!-- Condition gives meaning to Task X. -->
    <path d="M 381 815 C 456 742, 580 625, 728 517" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
    <polyline points="711,522 728,517 723,534" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="430" y="714" width="165" height="34" fill="#f4eadb"/>
    <text x="438" y="738" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#766f66">gives meaning to</text>

    <!-- Evidence supports a decision without implying decisive proof. -->
    <path d="M 235 534 C 294 564, 345 604, 397 646" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
    <polyline points="390,630 397,646 380,642" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="246" y="571" width="126" height="34" fill="#f4eadb"/>
    <text x="255" y="595" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#766f66">evidence for</text>

    <!-- Task X accumulates an artifact. -->
    <path d="M 759 522 C 827 612, 900 699, 969 786" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dark)"/>
    <polyline points="965,769 969,786 953,780" fill="none" stroke="#1d1915" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="831" y="656" width="122" height="34" fill="#f4eadb"/>
    <text x="840" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#766f66">accumulates</text>
  </g>

  <g id="nodes" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1d1915">
    <g transform="translate(292 307)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="0" y="-35" text-anchor="middle">Objective A</text>
    </g>
    <g transform="translate(1254 310)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="0" y="-35" text-anchor="middle">Objective B</text>
    </g>
    <g transform="translate(739 495)">
      <circle r="24" fill="#f4eadb" stroke="#9f3f28" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#9f3f28"/>
      <text x="-10" y="-53" text-anchor="middle" fill="#9f3f28">Task X</text>
    </g>
    <g transform="translate(1190 560)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="35" y="8">Task Y</text>
    </g>
    <g transform="translate(421 663)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="-34" y="9" text-anchor="end">Decision</text>
    </g>
    <g transform="translate(365 831)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="-34" y="9" text-anchor="end">Condition</text>
    </g>
    <g transform="translate(219 526)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="0" y="-35" text-anchor="middle">Evidence</text>
    </g>
    <g transform="translate(982 802)">
      <circle r="18" fill="#f4eadb" stroke="#1d1915" stroke-width="2.4"/>
      <text x="35" y="8">Artifact</text>
    </g>
  </g>

  <g id="missing-relationship" transform="translate(1328 795)">
    <path d="M -19 -11 A 22 22 0 0 1 17 -14" fill="none" stroke="#bd6a50" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 22 -3 A 22 22 0 0 1 3 22" fill="none" stroke="#bd6a50" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M -9 20 A 22 22 0 0 1 -22 4" fill="none" stroke="#bd6a50" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="5" y2="5" stroke="#bd6a50" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-3" x2="-3" y2="5" stroke="#bd6a50" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9f3f28">known relationship missing</text>
  </g>

  <g id="notes">
    <line x1="112" y1="905" x2="1488" y2="905" stroke="#c9b9a4" stroke-width="1.5"/>
    <text x="112" y="944" font-family="Arial, sans-serif" font-size="18" fill="#766f66">Each recorded relation can be inspected from either endpoint.</text>
    <text x="1488" y="944" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#766f66">Representative, not complete.</text>
  </g>
</svg>
