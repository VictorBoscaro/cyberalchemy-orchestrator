<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">One Objective, Changing Structure</title>
  <desc id="desc">A qualified three-state view of a situated objective, its evolving composition, and bounded work with unevenly recoverable context.</desc>

  <defs>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#bd6a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f4eadb"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="84" y="58" font-size="18" fill="#766f66">SECTIONS 1-3  /  FROM PERCEPTION TO DISTRIBUTED CONTEXT</text>
    <text x="84" y="120" font-size="44" font-weight="700" fill="#1d1915">One Objective, Changing Structure</text>
    <line x1="84" y1="151" x2="1516" y2="151" stroke="#9f3f28" stroke-width="1.5"/>

    <!-- State headings -->
    <text x="110" y="215" font-size="25" font-weight="700" fill="#9f3f28">Situated objective</text>
    <text x="623" y="215" font-size="25" font-weight="700" fill="#9f3f28">Evolving composition</text>
    <text x="1090" y="215" font-size="25" font-weight="700" fill="#9f3f28">Bounded work</text>

    <!-- A quiet, continuous guide connects the same objective across states. -->
    <path d="M 418 492 C 500 492, 538 492, 590 492 M 1018 492 C 1050 492, 1062 492, 1080 492"
          fill="none" stroke="#c9b9a4" stroke-width="1.6"/>
    <circle cx="505" cy="492" r="5" fill="#f4eadb" stroke="#766f66" stroke-width="1.5"/>
    <circle cx="1050" cy="492" r="5" fill="#f4eadb" stroke="#766f66" stroke-width="1.5"/>

    <!-- Situated objective -->
    <text x="110" y="274" font-size="17" fill="#766f66">experience, knowledge, biological constitution</text>
    <text x="110" y="300" font-size="17" fill="#766f66">social position, cultural context</text>
    <path d="M 110 319 H 410" stroke="#c9b9a4" stroke-width="1.4"/>

    <circle cx="147" cy="438" r="34" fill="none" stroke="#1d1915" stroke-width="2"/>
    <circle cx="147" cy="438" r="5" fill="#f4eadb" stroke="#9f3f28" stroke-width="1.6"/>
    <text x="147" y="500" text-anchor="middle" font-size="18" fill="#1d1915">situated</text>
    <text x="147" y="524" text-anchor="middle" font-size="18" fill="#1d1915">perception</text>

    <path d="M 182 438 C 216 386, 254 376, 286 402" fill="none" stroke="#766f66" stroke-width="1.8"/>
    <circle cx="237" cy="401" r="4.5" fill="#f4eadb" stroke="#766f66" stroke-width="1.4"/>
    <text x="230" y="342" text-anchor="middle" font-size="16" fill="#766f66">influences what becomes visible;</text>
    <text x="230" y="366" text-anchor="middle" font-size="16" font-style="italic" fill="#bd6a50">does not determine</text>

    <ellipse cx="355" cy="438" rx="92" ry="78" fill="none" stroke="#9f3f28" stroke-width="2.2"/>
    <circle cx="355" cy="438" r="7" fill="#f4eadb" stroke="#9f3f28" stroke-width="2"/>
    <text x="355" y="423" text-anchor="middle" font-size="18" fill="#1d1915">intention +</text>
    <text x="355" y="452" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1915">objective</text>
    <text x="355" y="580" text-anchor="middle" font-size="17" font-style="italic" fill="#766f66">often first appears as</text>
    <text x="355" y="606" text-anchor="middle" font-size="17" fill="#1d1915">a still-undifferentiated whole</text>

    <!-- Qualified transition -->
    <text x="514" y="412" text-anchor="middle" font-size="15" font-style="italic" fill="#766f66">as time, effort, and</text>
    <text x="514" y="434" text-anchor="middle" font-size="15" font-style="italic" fill="#766f66">bounded attention</text>
    <text x="514" y="456" text-anchor="middle" font-size="15" font-style="italic" fill="#766f66">are applied</text>

    <!-- Evolving objective: lateral composition, not hierarchy -->
    <ellipse cx="800" cy="492" rx="218" ry="184" fill="none" stroke="#9f3f28" stroke-width="2.2"/>
    <text x="800" y="290" text-anchor="middle" font-size="16" font-style="italic" fill="#766f66">the objective acquires distinctions</text>

    <g fill="none" stroke="#766f66" stroke-width="1.4">
      <path d="M 680 412 C 728 408, 754 422, 790 458"/>
      <path d="M 790 458 C 830 420, 868 405, 916 418"/>
      <path d="M 680 412 C 660 470, 668 526, 704 568"/>
      <path d="M 704 568 C 754 548, 806 548, 852 574"/>
      <path d="M 852 574 C 894 550, 924 515, 922 466"/>
      <path d="M 704 568 C 718 510, 748 478, 790 458"/>
      <path d="M 790 458 C 822 500, 838 534, 852 574"/>
      <path d="M 680 412 C 760 384, 850 388, 916 418" stroke="#c9b9a4"/>
    </g>

    <g fill="#f4eadb" stroke="#1d1915" stroke-width="1.8">
      <circle cx="680" cy="412" r="10"/>
      <circle cx="790" cy="458" r="10"/>
      <circle cx="916" cy="418" r="10"/>
      <circle cx="704" cy="568" r="10"/>
      <circle cx="852" cy="574" r="10"/>
      <circle cx="922" cy="466" r="10"/>
    </g>
    <g font-size="17" fill="#1d1915">
      <text x="660" y="385" text-anchor="middle">outcomes</text>
      <text x="790" y="438" text-anchor="middle">questions</text>
      <text x="934" y="392" text-anchor="middle">constraints</text>
      <text x="674" y="604" text-anchor="middle">possible routes</text>
      <text x="866" y="610" text-anchor="middle">composing objectives</text>
      <text x="954" y="472">tasks</text>
    </g>

    <path d="M 636 628 C 574 564, 563 409, 658 335 C 756 258, 927 286, 994 394"
          fill="none" stroke="#bd6a50" stroke-width="1.7" stroke-dasharray="7 7" marker-end="url(#open-arrow)"/>
    <text x="800" y="704" text-anchor="middle" font-size="16" font-style="italic" fill="#bd6a50">new parts emerge; meanings and dependencies</text>
    <text x="800" y="728" text-anchor="middle" font-size="16" font-style="italic" fill="#bd6a50">change as work proceeds</text>

    <!-- Bounded work and partial connections -->
    <text x="1090" y="264" font-size="16" fill="#766f66">each carries only partial purpose, assumptions,</text>
    <text x="1090" y="287" font-size="16" fill="#766f66">and prior decisions</text>

    <g fill="#f4eadb" stroke="#1d1915" stroke-width="1.6">
      <rect x="1090" y="326" width="240" height="96" rx="6"/>
      <rect x="1060" y="456" width="240" height="96" rx="6"/>
      <rect x="1100" y="586" width="240" height="96" rx="6"/>
    </g>
    <g fill="#1d1915">
      <text x="1110" y="353" font-size="18" font-weight="700">local objective</text>
      <text x="1110" y="381" font-size="15" fill="#766f66">decisions  /  artifacts</text>
      <text x="1110" y="403" font-size="15" fill="#766f66">success criteria</text>

      <text x="1080" y="483" font-size="18" font-weight="700">local task</text>
      <text x="1080" y="511" font-size="15" fill="#766f66">decisions  /  artifacts</text>
      <text x="1080" y="533" font-size="15" fill="#766f66">success criteria</text>

      <text x="1120" y="613" font-size="18" font-weight="700">local objective or task</text>
      <text x="1120" y="641" font-size="15" fill="#766f66">decisions  /  artifacts</text>
      <text x="1120" y="663" font-size="15" fill="#766f66">success criteria</text>
    </g>

    <ellipse cx="1451" cy="492" rx="91" ry="78" fill="none" stroke="#9f3f28" stroke-width="2.2"/>
    <circle cx="1451" cy="492" r="7" fill="#f4eadb" stroke="#9f3f28" stroke-width="2"/>
    <text x="1451" y="482" text-anchor="middle" font-size="17" fill="#1d1915">broader</text>
    <text x="1451" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#1d1915">objective</text>

    <path d="M 1330 374 C 1364 388, 1383 420, 1398 445" fill="none" stroke="#766f66" stroke-width="1.7"/>
    <path d="M 1300 504 C 1332 504, 1347 499, 1360 496" fill="none" stroke="#bd6a50" stroke-width="1.7" stroke-dasharray="8 6"/>
    <path d="M 1340 628 C 1360 610, 1368 588, 1378 570 M 1390 550 C 1396 538, 1400 530, 1406 523" fill="none" stroke="#bd6a50" stroke-width="1.7" stroke-dasharray="5 7"/>
    <circle cx="1360" cy="496" r="4.5" fill="#f4eadb" stroke="#bd6a50" stroke-width="1.4"/>

    <text x="1294" y="720" text-anchor="middle" font-size="16" font-style="italic" fill="#bd6a50">connections back to the broader objective</text>
    <text x="1294" y="744" text-anchor="middle" font-size="16" font-style="italic" fill="#bd6a50">may weaken or become harder to recover</text>

    <!-- Closing tension -->
    <line x1="1085" y1="801" x2="1508" y2="801" stroke="#c9b9a4" stroke-width="1.4"/>
    <text x="1296" y="842" text-anchor="middle" font-size="20" fill="#1d1915">focused work becomes possible</text>
    <text x="1296" y="877" text-anchor="middle" font-size="19" font-style="italic" fill="#9f3f28">/</text>
    <text x="1296" y="912" text-anchor="middle" font-size="20" fill="#1d1915">context of the whole becomes distributed</text>

  </g>
</svg>


