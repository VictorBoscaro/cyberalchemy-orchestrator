<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f5eadb"/>

  <text x="120" y="76" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="18">SECTION 4 / TRACEABILITY</text>
  <text x="120" y="142" fill="#201d1a" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">Recoverable Paths of Inquiry</text>
  <line x1="120" y1="178" x2="1480" y2="178" stroke="#a53b28" stroke-width="2"/>

  <!-- Follow an objective into work pursued on its behalf and toward a possible result. -->
  <path d="M 286 340 C 450 264 620 300 737 423" fill="none" stroke="#a53b28" stroke-width="2.8"/>
  <path d="M 717 418 L 737 423 L 728 403" fill="none" stroke="#a53b28" stroke-width="2.8"/>
  <path d="M 861 424 C 1008 307 1175 283 1313 337" fill="none" stroke="#a53b28" stroke-width="2.8"/>
  <path d="M 1294 323 L 1313 337 L 1290 344" fill="none" stroke="#a53b28" stroke-width="2.8"/>
  <text x="515" y="262" fill="#8c3021" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">FOLLOW CONTRIBUTING WORK</text>

  <!-- Return from the task to the context that gives it meaning. -->
  <path d="M 738 505 C 578 585 411 532 286 372" fill="none" stroke="#282522" stroke-width="2.3"/>
  <path d="M 289 393 L 286 372 L 307 378" fill="none" stroke="#282522" stroke-width="2.3"/>
  <path d="M 769 531 C 748 625 708 700 670 756" fill="none" stroke="#282522" stroke-width="2.3"/>
  <path d="M 675 733 L 670 756 L 689 748" fill="none" stroke="#282522" stroke-width="2.3"/>
  <path d="M 829 531 C 864 626 913 700 952 756" fill="none" stroke="#282522" stroke-width="2.3"/>
  <path d="M 933 747 L 952 756 L 947 733" fill="none" stroke="#282522" stroke-width="2.3"/>
  <rect x="568" y="591" width="468" height="42" fill="#f5eadb"/>
  <text x="802" y="619" text-anchor="middle" fill="#5f5952" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700">RETURN TO WHAT GIVES THE TASK MEANING</text>

  <!-- The same task may serve more than one objective. -->
  <path d="M 327 684 C 477 650 616 577 740 505" fill="none" stroke="#8d867d" stroke-width="2"/>
  <path d="M 719 512 L 740 505 L 730 524" fill="none" stroke="#8d867d" stroke-width="2"/>

  <!-- The dependency remains visible even though its exact relation is unresolved. -->
  <path d="M 861 500 C 973 528 1044 567 1114 613" fill="none" stroke="#8d867d" stroke-width="2"/>
  <path d="M 1182 643 C 1233 667 1272 677 1306 683" fill="none" stroke="#8d867d" stroke-width="2"/>
  <path d="M 1289 669 L 1306 683 L 1284 689" fill="none" stroke="#8d867d" stroke-width="2"/>
  <line x1="1133" y1="611" x2="1147" y2="632" stroke="#a53b28" stroke-width="2"/>
  <line x1="1153" y1="624" x2="1167" y2="645" stroke="#a53b28" stroke-width="2"/>
  <text x="1050" y="583" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">uncertain, disputed, or missing</text>

  <!-- The question qualifies the evidence link rather than asserting a required record. -->
  <path d="M 397 827 C 481 801 556 785 632 780" fill="none" stroke="#8d867d" stroke-width="2" stroke-dasharray="4 8"/>
  <text x="430" y="868" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">What evidence informed this?</text>

  <!-- Open nodes keep the figure relational rather than categorical. -->
  <circle cx="260" cy="355" r="27" fill="#f5eadb" stroke="#a53b28" stroke-width="2.8"/>
  <text x="260" y="412" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">Objective</text>

  <circle cx="300" cy="690" r="25" fill="#f5eadb" stroke="#8d867d" stroke-width="2.2"/>
  <text x="300" y="744" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">A second objective</text>
  <text x="300" y="775" text-anchor="middle" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">another purpose this task may serve</text>

  <circle cx="800" cy="470" r="68" fill="#f5eadb" stroke="#a53b28" stroke-width="3"/>
  <circle cx="800" cy="470" r="58" fill="none" stroke="#c99482" stroke-width="1.3"/>
  <text x="800" y="479" text-anchor="middle" fill="#201d1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Task</text>
  <text x="800" y="511" text-anchor="middle" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">bounded work</text>

  <circle cx="1340" cy="348" r="27" fill="#f5eadb" stroke="#a53b28" stroke-width="2.8"/>
  <text x="1340" y="405" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700">Artifact</text>
  <text x="1340" y="436" text-anchor="middle" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">a possible result</text>

  <circle cx="655" cy="782" r="25" fill="#f5eadb" stroke="#282522" stroke-width="2.2"/>
  <text x="655" y="838" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Decision</text>

  <circle cx="965" cy="782" r="25" fill="#f5eadb" stroke="#282522" stroke-width="2.2"/>
  <text x="965" y="838" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">Condition</text>

  <circle cx="370" cy="835" r="24" fill="#f5eadb" stroke="#8d867d" stroke-width="2.1"/>
  <text x="370" y="889" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">Evidence</text>

  <circle cx="1335" cy="690" r="25" fill="#f5eadb" stroke="#8d867d" stroke-width="2.2"/>
  <text x="1335" y="746" text-anchor="middle" fill="#282522" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700">Dependent work</text>
  <text x="1335" y="777" text-anchor="middle" fill="#777068" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">work elsewhere</text>

  <line x1="120" y1="924" x2="1480" y2="924" stroke="#b9ada0" stroke-width="1"/>
  <text x="120" y="961" fill="#5f5952" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">An example of recoverable inquiry paths, not a canonical model of work.</text>
</svg>
