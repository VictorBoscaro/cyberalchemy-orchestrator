  <path d="M496 75L504 71L503 79Z" fill="#b43f27"/>
  <text x="663" y="239" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6">FEEDBACK</text>
  <text x="663" y="251" text-anchor="middle" fill="#665249" font-family="Arial, sans-serif" font-size="9">may inform an affected context</text>
</svg>
