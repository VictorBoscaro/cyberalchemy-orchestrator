<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="objective-decomposition-title objective-decomposition-desc">
  <title id="objective-decomposition-title">Objective decomposition</title>
  <desc id="objective-decomposition-desc">A high-level view of how a global objective is decomposed into local objectives and carried into concrete work.</desc>
  <defs>
    <marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b43f27"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="758" height="328" rx="4" fill="#f7eddf" stroke="#ddcbb8" stroke-width="0.8"/>

  <text x="34" y="27" fill="#261d18" font-family="Georgia, serif" font-size="16" font-weight="700">Objective decomposition</text>
  <text x="34" y="45" fill="#665249" font-family="Arial, sans-serif" font-size="10.5">A high-level view of how a global objective is decomposed into local objectives and carried into concrete work.</text>

  <text x="18" y="72" fill="#8f6e5e" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.75">BROADER CONTEXT</text>
  <path d="M36 80V309" fill="none" stroke="#cdb9a5" stroke-width="0.9"/>
  <text x="18" y="322" fill="#8f6e5e" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.75">LOCAL WORK AND EFFECTS</text>

  <rect x="280" y="59" width="200" height="31" rx="15.5" fill="#f3dfcf" stroke="#9b321f" stroke-width="1.15"/>
  <text x="380" y="72" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="9.3" font-weight="700" letter-spacing="0.75">COMPOSED AND REVISABLE</text>
  <text x="380" y="84" text-anchor="middle" fill="#261d18" font-family="Georgia, serif" font-size="12" font-weight="700">global objective</text>

  <path d="M380 90V101M150 101H610M150 101V111M380 101V111M610 101V111" fill="none" stroke="#a88773" stroke-width="1"/>

  <rect x="82" y="111" width="136" height="31" rx="7" fill="#fffaf2" stroke="#b69b84" stroke-width="1"/>
  <text x="150" y="130" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.45">LOCAL OBJECTIVE A</text>

  <rect x="312" y="111" width="136" height="31" rx="7" fill="#241d19" stroke="#241d19" stroke-width="1.1"/>
  <text x="380" y="124" text-anchor="middle" fill="#fff8ed" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.45">LOCAL OBJECTIVE B</text>
  <text x="380" y="136" text-anchor="middle" fill="#eadfd5" font-family="Arial, sans-serif" font-size="9.2">selected branch</text>

  <rect x="542" y="111" width="136" height="31" rx="7" fill="#fffaf2" stroke="#b69b84" stroke-width="1"/>
  <text x="610" y="130" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.45">LOCAL OBJECTIVE C</text>

  <path d="M380 142V153" fill="none" stroke="#9b6e5b" stroke-width="1.05"/>
  <rect x="296" y="153" width="168" height="31" rx="7" fill="#f3dfcf" stroke="#9b321f" stroke-width="1.15"/>
  <text x="380" y="166" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">POSSIBLE ROUTE</text>
  <text x="380" y="178" text-anchor="middle" fill="#665249" font-family="Arial, sans-serif" font-size="9.2">a direction toward the objective</text>

  <path d="M380 184V195" fill="none" stroke="#9b6e5b" stroke-width="1.05"/>
  <rect x="260" y="195" width="240" height="31" rx="7" fill="#fffaf2" stroke="#b69b84" stroke-width="1"/>
  <text x="380" y="208" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">DETAILED WORK</text>
  <text x="380" y="220" text-anchor="middle" fill="#665249" font-family="Arial, sans-serif" font-size="9.2">steps and concrete work</text>

  <path d="M380 226V237H304V248" fill="none" stroke="#9b6e5b" stroke-width="1.05"/>
  <rect x="244" y="248" width="120" height="36" rx="7" fill="#fffaf2" stroke="#33251f" stroke-width="1.35"/>
  <text x="304" y="263" text-anchor="middle" fill="#261d18" font-family="Arial, sans-serif" font-size="11.2" font-weight="700" letter-spacing="0.5">TASK</text>
  <text x="304" y="276" text-anchor="middle" fill="#665249" font-family="Arial, sans-serif" font-size="9.2">the bounded work</text>

  <path d="M364 266H404" fill="none" stroke="#9b6e5b" stroke-width="1.05"/>
  <rect x="404" y="248" width="144" height="36" rx="7" fill="#f3dfcf" stroke="#9b321f" stroke-width="1.15"/>
  <text x="476" y="263" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.35">OUTPUT OR EFFECT</text>
  <text x="476" y="276" text-anchor="middle" fill="#665249" font-family="Arial, sans-serif" font-size="9.2">what changed or appeared</text>

  <rect x="57" y="286" width="177" height="27" rx="7" fill="#fffaf2" stroke="#b69b84" stroke-width="1"/>
  <text x="145.5" y="298" text-anchor="middle" fill="#8a4a38" font-family="Arial, sans-serif" font-size="9.2" font-weight="700" letter-spacing="0.5">OTHER RELATED CONTEXTS</text>
  <text x="145.5" y="309" text-anchor="middle" fill="#665249" font-family="Arial, sans-serif" font-size="8.2">may use the result later</text>

