<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 1000"
     width="1600"
     height="1000"
     role="img"
     aria-labelledby="objective-flow-title objective-flow-desc">
  <title id="objective-flow-title">From global objective to evidence</title>
  <desc id="objective-flow-desc">A global objective differentiates into local objectives. One local objective suggests a possible route that leads directly to detailed work. Detailed work is carried out as a task, which produces an output or observed effect that is assessed as evidence.</desc>

  <rect width="1600" height="1000" fill="#f5ead9"/>

  <text x="100" y="67" fill="#786d66" font-family="Georgia, serif" font-size="22">OBJECTIVE DECOMPOSITION</text>
  <text x="100" y="130" fill="#211b17" font-family="Georgia, serif" font-size="51" font-weight="700">From Global Objective to Evidence</text>
  <path d="M100 164H1500" fill="none" stroke="#a63c25" stroke-width="2.5"/>

  <text x="50" y="204" fill="#a63c25" font-family="Arial, sans-serif" font-size="17" font-weight="700" opacity="0.55">BROADER CONTEXT</text>
  <path d="M70 220V910" fill="none" stroke="#8d796c" stroke-width="2.25" opacity="0.45"/>
  <text x="50" y="930" fill="#a63c25" font-family="Arial, sans-serif" font-size="17" font-weight="700" opacity="0.55">LOCAL WORK AND EVIDENCE</text>

  <rect x="600" y="205" width="400" height="82" rx="41" fill="#f2dccb" stroke="#a63c25" stroke-width="2.5"/>
  <text x="800" y="257" text-anchor="middle" fill="#211b17" font-family="Georgia, serif" font-size="27" font-weight="700">GLOBAL OBJECTIVE</text>

