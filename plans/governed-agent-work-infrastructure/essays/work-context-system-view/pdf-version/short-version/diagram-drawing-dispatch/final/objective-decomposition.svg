  <rect x="110" y="347" width="300" height="92" rx="8" fill="#fbf3e7" stroke="#8d796c" stroke-width="2"/>
  <text x="260" y="383" text-anchor="middle" fill="#211b17" font-family="Georgia, serif" font-size="24" font-weight="700">LOCAL OBJECTIVE A</text>
  <text x="260" y="414" text-anchor="middle" fill="#786d66" font-family="Arial, sans-serif" font-size="18">one part of the whole</text>

  <rect x="650" y="347" width="300" height="92" rx="8" fill="#28201b" stroke="#28201b" stroke-width="2.5"/>
  <text x="800" y="383" text-anchor="middle" fill="#fff8ed" font-family="Georgia, serif" font-size="24" font-weight="700">LOCAL OBJECTIVE B</text>
  <text x="800" y="414" text-anchor="middle" fill="#eadfd5" font-family="Arial, sans-serif" font-size="18">the part being developed</text>

  <rect x="1190" y="347" width="300" height="92" rx="8" fill="#fbf3e7" stroke="#8d796c" stroke-width="2"/>
  <text x="1340" y="383" text-anchor="middle" fill="#211b17" font-family="Georgia, serif" font-size="24" font-weight="700">LOCAL OBJECTIVE C</text>
  <text x="1340" y="414" text-anchor="middle" fill="#786d66" font-family="Arial, sans-serif" font-size="18">another part of the whole</text>

  <path d="M800 439V478" fill="none" stroke="#a63c25" stroke-width="2.5"/>
  <rect x="630" y="478" width="340" height="72" rx="8" fill="#f2dccb" stroke="#a63c25" stroke-width="2.5"/>
  <text x="800" y="508" text-anchor="middle" fill="#211b17" font-family="Georgia, serif" font-size="24" font-weight="700">POSSIBLE ROUTE</text>
  <text x="800" y="534" text-anchor="middle" fill="#786d66" font-family="Arial, sans-serif" font-size="18">a direction toward the local objective</text>

  <path d="M800 550V640H230V700" fill="none" stroke="#8d796c" stroke-width="2.25"/>

  <rect x="100" y="700" width="260" height="100" rx="8" fill="#fbf3e7" stroke="#8d796c" stroke-width="2"/>
