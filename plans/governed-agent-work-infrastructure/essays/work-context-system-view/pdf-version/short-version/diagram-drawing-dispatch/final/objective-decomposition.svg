  <text x="230" y="773" text-anchor="middle" fill="#786d66" font-family="Arial, sans-serif" font-size="18">steps and concrete work</text>

  <text x="415" y="681" text-anchor="middle" fill="#a63c25" font-family="Arial, sans-serif" font-size="18" font-weight="700">ATTEMPTED BY</text>
  <path d="M360 750H470" fill="none" stroke="#8d796c" stroke-width="2.25"/>
  <rect x="470" y="700" width="220" height="100" rx="8" fill="#28201b" stroke="#28201b" stroke-width="2.5"/>
  <text x="580" y="741" text-anchor="middle" fill="#fff8ed" font-family="Georgia, serif" font-size="25" font-weight="700">TASK</text>
  <text x="580" y="773" text-anchor="middle" fill="#eadfd5" font-family="Arial, sans-serif" font-size="18">a concrete act</text>

  <text x="755" y="681" text-anchor="middle" fill="#a63c25" font-family="Arial, sans-serif" font-size="18" font-weight="700">PRODUCES OR OBSERVES</text>
  <path d="M690 750H820" fill="none" stroke="#8d796c" stroke-width="2.25"/>
  <rect x="820" y="700" width="300" height="100" rx="8" fill="#fbf3e7" stroke="#8d796c" stroke-width="2"/>
  <text x="970" y="741" text-anchor="middle" fill="#211b17" font-family="Georgia, serif" font-size="24" font-weight="700">OUTPUT OR EFFECT</text>
  <text x="970" y="773" text-anchor="middle" fill="#786d66" font-family="Arial, sans-serif" font-size="18">what changed or appeared</text>

  <text x="1210" y="681" text-anchor="middle" fill="#a63c25" font-family="Arial, sans-serif" font-size="18" font-weight="700">ASSESSED AS</text>
  <path d="M1120 750H1300" fill="none" stroke="#8d796c" stroke-width="2.25"/>
  <rect x="1300" y="700" width="200" height="100" rx="8" fill="#f2dccb" stroke="#a63c25" stroke-width="2.5"/>
  <text x="1400" y="741" text-anchor="middle" fill="#211b17" font-family="Georgia, serif" font-size="24" font-weight="700">EVIDENCE</text>
  <text x="1400" y="773" text-anchor="middle" fill="#786d66" font-family="Arial, sans-serif" font-size="18">what the result supports</text>

