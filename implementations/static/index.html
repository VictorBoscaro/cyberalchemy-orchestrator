<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch control plane — choose a UI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 32px;
    background: #0b0d10; color: #e6e9ef;
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: #8b94a5; margin: 0 0 8px; }
  .stats { color: #6f7a8d; font-size: 13px; margin-bottom: 34px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  a.card {
    display: block; padding: 18px; border-radius: 10px; text-decoration: none;
    background: #14181e; border: 1px solid #232935; color: inherit;
    transition: border-color .15s, transform .15s, background .15s;
  }
  a.card:hover { border-color: #3d7dff; transform: translateY(-2px); background: #171c24; }
  .n { font-size: 11px; color: #6f7a8d; font-variant-numeric: tabular-nums; }
  .name { font-size: 16px; font-weight: 600; margin: 4px 0 5px; }
  .desc { font-size: 13px; color: #8b94a5; line-height: 1.45; }
  footer { margin-top: 40px; color: #5b6474; font-size: 12px; }
  code { background: #191e26; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Dispatch control plane</h1>
  <p class="sub">Phase 1 — the reader. Ten UI variants over the same API. Choose one.</p>
  <p class="stats" id="stats">loading…</p>

  <div class="grid" id="grid"></div>

  <footer>
    All consume <code>/api/snapshot</code> and <code>/api/stream</code>.
    Read-only — nothing here writes to the ledger.
  </footer>
</div>

<script>
const VARIANTS = [
  ["terminal",        "Terminal CRT",      "Green phosphor, monospaced, frames drawn with characters."],
  ["mission-control", "Mission Control",   "NASA-style telemetry: dense grid, gauges, everything tabular."],
  ["brutalist",       "Brutalist",         "Hard black and white, heavy borders, huge typography."],
  ["linear",          "Linear / Product",  "Modern, clean SaaS: light, dense and calm."],
  ["cyberpunk",       "Cyberpunk Neon",    "Dark with magenta and cyan, glow, chamfered corners."],
  ["blueprint",       "Technical Blueprint","Cyan on navy, grid paper, dimensions and annotations."],
  ["grimoire",        "Alchemical Grimoire","Parchment, serif, ornaments — the repo name taken seriously."],
  ["radar",           "Radar / ATC",       "Air traffic control: sweep, dense lists, amber on green."],
  ["swiss",           "Editorial Swiss",   "Typographic grid, lots of white, red accent, rigid hierarchy."],
  ["aurora",          "Aurora / Glass",    "Frosted panels over a gradient, depth, soft."],
];

const grid = document.getElementById("grid");
VARIANTS.forEach(([slug, name, desc], i) => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = `/static/ui/${slug}/index.html`;
  a.innerHTML = `<div class="n">${String(i + 1).padStart(2, "0")}</div>
                 <div class="name"></div><div class="desc"></div>`;
  a.querySelector(".name").textContent = name;
  a.querySelector(".desc").textContent = desc;
  grid.appendChild(a);
});

fetch("/api/snapshot").then(r => r.json()).then(d => {
  const repos = d.repos.length;
  const disp = d.repos.reduce((t, r) => t + r.total_dispatches, 0);
  const open = d.repos.reduce((t, r) => t + r.open_dispatches, 0);
  const pend = d.repos.reduce((t, r) => t + r.pending.length, 0);
  document.getElementById("stats").textContent =
    `${repos} repos · ${disp} dispatches · ${open} open · ${pend} pending sheets`;
}).catch(e => { document.getElementById("stats").textContent = "API down: " + e; });
</script>
</body>
</html>
