    var gs = arr(sheet.groups);
    if (gs.length) tags.appendChild(pill(gs.length + (gs.length === 1 ? " group" : " groups"), "ghost"));
    if (sheet._example) tags.appendChild(pill("demo fixture", "warn"));
    if (p._error) tags.appendChild(pill("unreadable sheet", "danger"));
    left.appendChild(tags);

    left.appendChild(el("h3", "pending-goal", sheet.goal || (p._error ? "(sheet could not be read)" : "(no goal)")));
    left.appendChild(el("div", "pending-id", str(sheet.dispatch_id || p._file || "—") +
      (p._file && sheet.dispatch_id ? "  ·  " + p._file : "")));
    if (sheet.context) left.appendChild(el("p", "pending-ctx", sheet.context));
    top.appendChild(left);

    var right = el("div");
    var btn = el("button", "btn-dispatch");
    btn.setAttribute("data-testid", "dispatch-button");
    btn.type = "button";
    btn.disabled = true;
    btn.title = "confirm dispatches in Phase 2";
    btn.appendChild(icon(ICON.bolt, 13));
    btn.appendChild(document.createTextNode("Dispatch"));
    right.appendChild(btn);
    right.appendChild(el("div", "phase-note", "disabled — Phase 2"));
    top.appendChild(right);
    card.appendChild(top);

    if (p._error) {
      var eb = el("div", "banner err");
      eb.style.marginTop = "12px";
      eb.textContent = "Error reading the sheet: " + p._error + (p._path ? " — " + p._path : "");
      card.appendChild(eb);
      return card;
    }

    if (sheet.anti_bias_global) {
      var ax = el("div", "axis-hero");
      ax.style.margin = "12px 0 0";
      ax.appendChild(el("div", "lbl", "global tension axis"));
      ax.appendChild(el("div", "txt", sheet.anti_bias_global));
      card.appendChild(ax);
    }

    if (gs.length) {
      var gl = el("div");
      gl.style.marginTop = "10px";
      gl.style.display = "flex";
      gl.style.flexDirection = "column";
      gl.style.gap = "4px";
      gs.forEach(function (g) {
        g = obj(g);
        var line = el("div", "prose");
        line.style.fontSize = "12.5px";
        var b = el("b", null, (g.group_id || "group") + " · " + arr(g.agents).length + " ag" +
          (g.robot_talks ? " · robot talks" : ""));
        b.style.fontFamily = "var(--mono)";
        b.style.color = "var(--text)";
        line.appendChild(b);
        line.appendChild(document.createTextNode(g.anti_bias ? " — axis: " + g.anti_bias : " — no anti_bias declared"));
        gl.appendChild(line);
      });
      card.appendChild(gl);
    }

    var det = el("details");
    det.style.marginTop = "10px";
    var sm = el("summary", "back", "view the whole sheet");
    sm.style.cursor = "pointer";
    sm.style.listStyle = "none";
    det.appendChild(sm);
    var body = el("div");
    body.style.marginTop = "10px";
    arr(sheet.groups).forEach(function (g) { body.appendChild(groupBlock(obj(g))); });
    var conns = arr(sheet.connections);
    if (conns.length) {
      body.appendChild(el("div", "block-label", "Connections (" + conns.length + ")"));
      conns.forEach(function (c) { body.appendChild(connRow(obj(c))); });
    }
    if (p._path) {
      var pf = el("div", "rc-path");
      pf.style.marginTop = "8px";
      pf.textContent = p._path;
      body.appendChild(pf);
    }
    det.appendChild(body);
    card.appendChild(det);
    return card;
  }

  /* ===================== level 1 — repo ===================== */
  function viewRepo() {
    var wrap = el("div", "content");
    var name = S.route.repo;
    var slot = S.repos[name] || {};

    if (slot.err) {
      wrap.appendChild(el("div", "banner err", "Could not read the repository “" + name + "”: " + slot.err));
      wrap.appendChild(link("#/", "back", "← back to panel"));
      return wrap;
    }
    if (!slot.data) {
      wrap.appendChild(el("div", "skeleton", "Loading " + name + "…"));
      return wrap;
    }
    var R = slot.data;
    var sum = obj(R.summary);

    /* hero */
    var hero = el("section", "repo-hero");
    hero.setAttribute("data-testid", "repo-section");
    hero.setAttribute("data-repo", name);
    var ht = el("div");
    ht.style.display = "flex";
    ht.style.alignItems = "baseline";
    ht.style.gap = "10px";
    ht.style.flexWrap = "wrap";
    ht.appendChild(el("h2", null, name));
    if (R.error) ht.appendChild(pill("fatal read error", "danger"));
    if (!R.ledger_exists) ht.appendChild(pill("no ledger", "reserved"));
    if (sum.last_created) ht.appendChild(el("span", "pill plain", "last " + relTime(sum.last_created) + " ago"));
    hero.appendChild(ht);
    hero.appendChild(el("div", "path", R.path || ""));

    var stats = el("div", "stats");
    function stat(v, k, cls) {
      var s = el("div", "stat " + (cls || ""));
      s.appendChild(el("div", "v", String(v)));
      s.appendChild(el("div", "k", k));
      stats.appendChild(s);
    }
    stat(num(sum.total), "total in ledger");
    stat(num(sum.open), "open", "hot");
    stat(num(sum.closed), "closed");
    stat(num(sum.pending_count), "to confirm", "gate");
    stat(num(sum.live), "live");
    stat(num(sum.reserved), "reserved");
    if (num(sum.legacy)) stat(num(sum.legacy), "legacy");
    if (sum.first_day) stat(sum.first_day + " → " + (sum.last_day || "?"), "period");
    hero.appendChild(stats);
    // NOT a partition: `total == live + reserved + legacy` is not guaranteed —
    // a research row whose `groups` failed to parse counts in "live" AND in
    // "legacy" at the same time (ledger.py:590). They are independent slices.
    hero.appendChild(el("p", "plot-note",
      "live · reserved · legacy are independent slices — they can overlap and do not sum to the total."));

    if (R.error) {
      var de = el("details", "diag error");
      var se = el("summary", null, "Fatal read error");
      de.appendChild(se);
      var be = el("div", "diag-body");
      be.appendChild(el("div", null, String(R.error)));
      de.appendChild(be);
      hero.appendChild(de);
    }
    var warns = arr(R.warnings);
    if (warns.length) {
      var dw = el("details", "diag");
      dw.appendChild(el("summary", null, warns.length + " parsing warnings (non-fatal) — expand"));
      var bw = el("div", "diag-body");
      warns.forEach(function (w) { bw.appendChild(el("div", null, String(w))); });
      dw.appendChild(bw);
      hero.appendChild(dw);
    }
    wrap.appendChild(hero);

    /* pending of the repo */
    var pend = arr(R.pending);
    if (pend.length) {
      var pz = el("section", "pending-zone");
      var ph = el("div", "sec-head");
      ph.appendChild(el("h2", null, "To confirm in this repository"));
      ph.appendChild(el("span", "gate-tag", "human gate"));
      pz.appendChild(ph);
      var pl = el("div");
      pend.forEach(function (p) {
        var c = obj(p), cc = {};
        for (var k in c) cc[k] = c[k];
        if (!cc._repo) cc._repo = name;
        pl.appendChild(pendingCard(cc));
      });
      pz.appendChild(pl);
      wrap.appendChild(pz);
    }

    /* chart */
    wrap.appendChild(plotCard(obj(R.series), R));

    /* filtros + lista */
    var all = arr(R.dispatches);
    var f = S.filters;
    var q = f.q.trim().toLowerCase();
    var list = all.filter(function (d) {
      if (f.state === "open" && d._state !== "open") return false;
      if (f.state === "closed" && d._state !== "closed") return false;
      if (f.type !== "all" && (d.dispatch_type || NO_TYPE) !== f.type) return false;
      if (f.conn === "robot" && !d._robot_talks) return false;
      if (f.conn === "zigzag" && !hasEdge(d, "zigzag")) return false;
      if (f.conn === "feedback" && !hasEdge(d, "feedback")) return false;
      if (q) {
        var hay = (str(d.goal) + " " + str(d.dispatch_id)).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    var sec = el("section", "sec");
    var sh = el("div", "sec-head");
    sh.appendChild(el("h2", null, "History"));
    sh.appendChild(el("span", "hint", "the query filters the list; the chart above still describes the whole repository"));
    sec.appendChild(sh);

    var filters = el("div", "filters");
    filters.appendChild(seg([["all", "All"], ["open", "Open"], ["closed", "Closed"]], f.state,
      function (v) { f.state = v; S.limit = PAGE; render(); }));

    var typesPresent = {};
    all.forEach(function (d) { typesPresent[d.dispatch_type || NO_TYPE] = (typesPresent[d.dispatch_type || NO_TYPE] || 0) + 1; });
    var sel = el("select", "sel");
    var o0 = el("option", null, "All types");
    o0.value = "all";
    sel.appendChild(o0);
    Object.keys(typesPresent).sort().forEach(function (k) {
      var o = el("option", null, (k === NO_TYPE ? "no type" : k) + " (" + typesPresent[k] + ")");
      o.value = k;
      if (f.type === k) o.selected = true;
      sel.appendChild(o);
    });
    sel.value = f.type;
    sel.addEventListener("change", function () { f.type = sel.value; S.limit = PAGE; render(); });
    filters.appendChild(sel);

    // Topology filter: robot talks / zig-zag / feedback. Composes with the other
    // filters (state/type/search) over the already-loaded list.
    var nRobot = 0, nZig = 0, nFb = 0;
    all.forEach(function (d) {
      if (d._robot_talks) nRobot++;
      if (hasEdge(d, "zigzag")) nZig++;
      if (hasEdge(d, "feedback")) nFb++;
    });
    var csel = el("select", "sel");
    csel.title = "Filter by topology";
    [["all", "All topology"],
     ["robot", "with robot talks (" + nRobot + ")"],
     ["zigzag", "with zig-zag (" + nZig + ")"],
     ["feedback", "with feedback (" + nFb + ")"]].forEach(function (o) {
      var op = el("option", null, o[1]);
      op.value = o[0];
      if (f.conn === o[0]) op.selected = true;
      csel.appendChild(op);
    });
    csel.value = f.conn;
    csel.addEventListener("change", function () { f.conn = csel.value; S.limit = PAGE; render(); });
    filters.appendChild(csel);

    var inp = el("input", "search");
    inp.type = "search";
    inp.placeholder = "Search in goal or dispatch_id…";
    inp.value = f.q;
    inp.addEventListener("input", function () { f.q = inp.value; S.limit = PAGE; render({ focus: "search" }); });
    filters.appendChild(inp);
    filters.appendChild(el("span", "match", list.length + " of " + all.length + " rows"));
    sec.appendChild(filters);

    var body = el("div");
    body.setAttribute("data-testid", "dispatch-list");
    if (!list.length) {
      var e = el("div", "empty");
      e.appendChild(el("b", null, all.length ? "No dispatch matches the filters." : "No dispatch in this repository."));
      e.appendChild(document.createTextNode(all.length ? "There are " + all.length + " rows in this repository." :
        (R.ledger_exists ? "This repository's ledger is empty." : "This repository does not have a ledger yet.")));
      body.appendChild(e);
    } else {
      var rows = el("div", "rows");
      list.slice(0, S.limit).forEach(function (d) { rows.appendChild(dispatchCard(name, d, {})); });
      if (list.length > S.limit) {
        var more = el("button", "load-more", "Show more " + Math.min(PAGE, list.length - S.limit) +
          " (" + (list.length - S.limit) + " remaining)");
        more.type = "button";
        more.addEventListener("click", function () { S.limit += PAGE; render(); });
        rows.appendChild(more);
      }
      body.appendChild(rows);
    }
    sec.appendChild(body);

    if (num(R._snapshot_capped)) {
      sec.appendChild(el("p", "plot-note warn",
        "Basic mode: the API delivered only the " + R._snapshot_capped + " most recent dispatches of " +
        num(sum.total) + ". The chart and filters cover only that slice."));
    }
    wrap.appendChild(sec);
    return wrap;
  }

  /* ===================== chart ===================== */
  function plotCard(series, R) {
    var card = el("section", "plot-card");
    var days = arr(series.days);
    var types = arr(series.types);
    var ser = obj(series.series);
    var totals = obj(series.totals);

    var head = el("div", "plot-head");
    head.appendChild(el("h3", null, "Dispatches per day"));
    head.appendChild(el("span", "spacer"));
    if (days.length > 40) {
      head.appendChild(seg([["30", "30 d"], ["90", "90 d"], ["all", "all"]], effectiveSpan(days),
        function (v) { S.span = v; render(); }));
    }
    card.appendChild(head);

    var legend = el("div", "plot-legend");
    types.forEach(function (t) {
      var s = el("span", "t");
      var i = el("i");
      i.style.background = typeColor(t);
      s.appendChild(i);
      s.appendChild(el("span", null, t === NO_TYPE ? "no type" : t));
      s.appendChild(el("b", null, String(num(totals[t]))));
      legend.appendChild(s);
    });
    if (types.length) card.appendChild(legend);

    if (!days.length) {
      card.appendChild(el("div", "panel-empty",
        "No dated dispatch in this repository — there is no time series to draw."));
      if (num(series.undated)) {
        card.appendChild(el("p", "plot-note warn", num(series.undated) + " rows without a date and therefore outside the chart."));
      }
      return card;
    }

    var span = effectiveSpan(days);
    var start = 0;
    if (span === "30") start = Math.max(0, days.length - 30);
    else if (span === "90") start = Math.max(0, days.length - 90);
    var vDays = days.slice(start);

    var wrapSvg = el("div", "plot-wrap");
    wrapSvg.appendChild(plotSvg(vDays, types, ser, start));
    card.appendChild(wrapSvg);

    var noteBits = [];
    noteBits.push(vDays.length + (vDays.length === 1 ? " day" : " days") +
      " · " + vDays[0] + " → " + vDays[vDays.length - 1]);
    if (start > 0) noteBits.push("slice of " + days.length + " days total");
    // The axis buckets are calendar days in UTC (ledger.daily_series), not
    // in local time — the last bar is "today" in UTC.
    noteBits.push("days in UTC");
    card.appendChild(el("p", "plot-note", noteBits.join(" · ")));
    if (num(series.undated)) {
      card.appendChild(el("p", "plot-note warn",
        num(series.undated) + (num(series.undated) === 1 ? " row without a date" : " rows without a date") +
        " — they count in the totals, but do not appear in the chart."));
    }
    return card;
  }

  function effectiveSpan(days) {
    if (S.span !== "auto") {
      if (S.span === "30" && days.length <= 30) return "all";
      if (S.span === "90" && days.length <= 90) return "all";
      return S.span;
    }
    if (days.length <= 90) return "all";
    return "90";
  }

  function plotSvg(days, types, ser, offset) {
    var W = 1080, H = 214;
    var padL = 34, padR = 8, padT = 10, padB = 30;
    var pw = W - padL - padR, ph = H - padT - padB;
    var n = days.length;
    var slot = pw / n;
    var barW = Math.max(1, Math.min(44, slot - Math.min(4, slot * 0.22)));

    var maxDay = 0;
    var perDay = [];
    for (var i = 0; i < n; i++) {
      var dayTotal = 0, parts = [];
      for (var t = 0; t < types.length; t++) {
        var v = num(arr(ser[types[t]])[offset + i]);
        parts.push(v);
        dayTotal += v;
      }
      perDay.push({ total: dayTotal, parts: parts });
      if (dayTotal > maxDay) maxDay = dayTotal;
    }
    if (maxDay <= 0) maxDay = 1;

    var s = svgn("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "xMidYMid meet", role: "img" });
    s.setAttribute("aria-label", "dispatches per day, stacked by type");

    // grid
    var ticks = maxDay <= 4 ? maxDay : 4;
    for (var g = 0; g <= ticks; g++) {
      var val = Math.round(maxDay * g / ticks);
      var y = padT + ph - (val / maxDay) * ph;
      s.appendChild(svgn("line", { x1: padL, x2: W - padR, y1: y, y2: y, stroke: g === 0 ? "#dcdce3" : "#efeff3", "stroke-width": 1 }));
      var lab = svgn("text", { x: padL - 6, y: y + 3.5, "text-anchor": "end", "font-size": 9.5, fill: "#a1a1aa" });
      lab.textContent = String(val);
      s.appendChild(lab);
    }

    // bars
    var yScale = function (v) { return (v / maxDay) * ph; };
    for (var i2 = 0; i2 < n; i2++) {
      var x = padL + i2 * slot + (slot - barW) / 2;
      var acc = 0;
      for (var t2 = 0; t2 < types.length; t2++) {
        var v2 = perDay[i2].parts[t2];
        if (!v2) continue;
        var h = yScale(v2);
        acc += v2;
        var y2 = padT + ph - yScale(acc);
        s.appendChild(svgn("rect", {
          x: x.toFixed(2), y: y2.toFixed(2), width: barW.toFixed(2), height: Math.max(1, h).toFixed(2),
          fill: typeColor(types[t2]), rx: barW > 5 ? 1.5 : 0
        }));
      }
    }

    // hover targets
    for (var i3 = 0; i3 < n; i3++) {
      var hit = svgn("rect", {
        "class": "plot-hit", x: (padL + i3 * slot).toFixed(2), y: padT,
        width: Math.max(1, slot).toFixed(2), height: ph
      });
      var lines = [days[i3] + " — " + perDay[i3].total + (perDay[i3].total === 1 ? " dispatch" : " dispatches")];
      for (var t3 = 0; t3 < types.length; t3++) {
        if (perDay[i3].parts[t3]) lines.push("  " + (types[t3] === NO_TYPE ? "no type" : types[t3]) + ": " + perDay[i3].parts[t3]);
      }
      var ttl = svgn("title");
      ttl.textContent = lines.join("\n");
      hit.appendChild(ttl);
      s.appendChild(hit);
    }

    // x axis
    var lastX = -1e9;
    var minGap = 58;
    var lastYear = null;
    for (var i4 = 0; i4 < n; i4++) {
      var day = days[i4];
      var isFirst = i4 === 0;
      var isMonth = day.slice(8, 10) === "01";
      if (!isFirst && !isMonth && n > 40) continue;
      if (!isFirst && !isMonth && n <= 40) {
        var every = Math.max(1, Math.ceil(n / 10));
        if (i4 % every !== 0) continue;
      }
      var cx = padL + i4 * slot + slot / 2;
      if (cx - lastX < minGap) continue;
      lastX = cx;
      var mo = parseInt(day.slice(5, 7), 10);
      var yr = day.slice(0, 4);
      var text = (MONTHS[mo - 1] || day.slice(5, 7));
      if (n <= 40) text = day.slice(8, 10) + "/" + day.slice(5, 7);
      else if (yr !== lastYear) { text += " " + yr.slice(2); }
      lastYear = yr;
      s.appendChild(svgn("line", { x1: cx, x2: cx, y1: padT + ph, y2: padT + ph + 4, stroke: "#dcdce3", "stroke-width": 1 }));
      var tx = svgn("text", { x: cx, y: padT + ph + 15, "text-anchor": "middle", "font-size": 9.5, fill: "#a1a1aa" });
      tx.textContent = text;
      s.appendChild(tx);
    }
    return s;
  }

  /* ===================== level 2 — dispatch ===================== */
  function viewDispatch() {
    var wrap = el("div", "content");
    var repoName = S.route.repo, id = S.route.id;
    var slot = S.disp[repoName + "|" + id] || {};

    var strip = el("div");
    strip.setAttribute("data-testid", "repo-section");
    strip.setAttribute("data-repo", repoName);
    strip.style.marginBottom = "10px";
    strip.appendChild(link("#/repo/" + encodeURIComponent(repoName), "back", "← " + repoName));
    wrap.appendChild(strip);

    if (slot.err) {
      wrap.appendChild(el("div", "banner err",
        "Could not load dispatch “" + id + "” in " + repoName + ": " + slot.err));
      return wrap;
    }
    if (!slot.data) {
      wrap.appendChild(el("div", "skeleton", "Loading the dispatch…"));
      return wrap;
    }
    var d = slot.data;
    var groups = arr(d.groups);
    var conns = arr(d.connections);
    var state = d._state === "open" ? "open" : "closed";
    var close = d._close ? obj(d._close) : null;
    var live = isLive(d);

    /* hero */
    var hero = el("section", "d-hero");
    var tags = el("div", "tags");
    tags.appendChild(state === "open" ? pill("open", "open")
      : pill(EXIT_LABEL[close && close.exit_reason] || (close && close.exit_reason) || "closed",
             EXIT_TONE[close && close.exit_reason] || "closed"));
    if (d.dispatch_type) {
      var tp = pill(d.dispatch_type, "ghost");
      var sw = el("span", "swatch");
      sw.style.background = typeColor(d.dispatch_type);
      tp.insertBefore(sw, tp.firstChild);
      tags.appendChild(tp);
      tags.appendChild(pill(live ? "LIVE" : "RESERVED", live ? "ok" : "reserved"));
    } else {
      tags.appendChild(pill("no dispatch_type", "warn"));
    }
    if (d._legacy && !d._orphan_close) tags.appendChild(pill("legacy row", "warn"));
    if (d._orphan_close) tags.appendChild(pill("orphan close", "info"));
    tags.appendChild(pill(num(d._agent_count || countAgentsOf(d)) + " agents", "ghost"));
    if (groups.length) tags.appendChild(pill(groups.length + (groups.length === 1 ? " group" : " groups"), "ghost"));
    hero.appendChild(tags);

    hero.appendChild(el("div", "d-id", str(d.dispatch_id || id)));
    hero.appendChild(el("h2", "d-goal", d.goal || "(no goal)"));
    if (d.context) hero.appendChild(el("p", "d-ctx", d.context));

    var kv = el("dl", "kv");
    function pair(k, v) {
      if (v === undefined || v === null || v === "") return;
      var w = el("div");
      w.appendChild(el("dt", null, k));
      w.appendChild(el("dd", null, v));
      kv.appendChild(w);
    }
    pair("Created", d.created ? fmtDate(d.created) : null);
    if (close && close.closed) pair("Closed", fmtDate(close.closed));
    pair("Invoked by", d.invoked_by);
    pair("Working folder", d.working_folder);
    pair("Max loops", d.max_loops);
    pair("Final approver", d.final_approver);
    pair("Schema", d.schema_version);
    pair("Output mode", d.output_mode);
    pair("Parent dispatch", d.parent_dispatch_id);
    if (kv.childNodes.length) hero.appendChild(kv);
    wrap.appendChild(hero);

    if (!live && d.dispatch_type) {
      wrap.appendChild(el("div", "banner reserved",
        "RESERVED type (" + d.dispatch_type + "): only research, review and experiment are LIVE under v0.6.0. This dispatch does not execute."));
    }

    /* anti-bias */
    var ax = el("section", "axis-hero" + (d.anti_bias_global ? "" : " none"));
    ax.appendChild(el("div", "lbl", "global anti-bias — the axis on which the agents are opposed"));
    ax.appendChild(el("div", "txt", d.anti_bias_global ||
      "This row does not declare anti_bias_global. Without a registered global axis, tension only exists (if at all) within each group."));
    wrap.appendChild(ax);

    /* topology */
    wrap.appendChild(topologyCard(d, groups, conns));

    /* agents */
    if (groups.length) {
      var gsec = el("section", "sec");
      var gh = el("div", "sec-head");
      gh.appendChild(el("h2", null, "Agents and angles"));
      gh.appendChild(el("span", "hint", "each angle is the agent's position AGAINST its group's anti_bias"));
      gsec.appendChild(gh);
      groups.forEach(function (g) { gsec.appendChild(groupBlock(obj(g))); });
      wrap.appendChild(gsec);
    }

    /* closure */
    var csec = el("section", "sec");
    csec.appendChild(el("div", "block-label", "Closure"));
    if (close) {
      var tone = EXIT_TONE[close.exit_reason] || "closed";
      var cb = el("div", "close-box" + (tone === "danger" ? " bad" : ""));
      var hdr = el("div", "tags");
      hdr.appendChild(pill(EXIT_LABEL[close.exit_reason] || close.exit_reason || "no exit_reason", tone));
      if (close.closed) hdr.appendChild(pill("closed on " + fmtDate(close.closed), "ghost"));
      var sp = obj(close.agents_spawned);
      if (sp.total != null) hdr.appendChild(pill(sp.total + " agents spawned", "ghost"));
      if (sp.loops_used != null) hdr.appendChild(pill(sp.loops_used + " loops used", "ghost"));
      cb.appendChild(hdr);
      var tree = obj(sp.tree);
      var tk = Object.keys(tree);
      if (tk.length) {
        var tr = el("div", "tree");
        tk.forEach(function (k) {
          if (!tree[k]) return;
          var p2 = pill(k + " × " + tree[k], "");
          p2.style.color = ROLE_COLOR[k] || "var(--text-2)";
          tr.appendChild(p2);
        });
        if (tr.childNodes.length) cb.appendChild(tr);
      }
      var fbs = arr(close.feedback_prompts);
      if (fbs.length) {
        cb.appendChild(el("div", "block-label", "Closing feedback (" + fbs.length + ")"));
        fbs.forEach(function (f) { cb.appendChild(el("div", "fb", String(f))); });
      }
      csec.appendChild(cb);
    } else {
      var oc = el("div", "close-box");
      oc.appendChild(pill("still open — no close row in the ledger", "open"));
      csec.appendChild(oc);
    }
    wrap.appendChild(csec);
    return wrap;
  }

  /* ---------- topology ---------- */
  function topologyCard(d, groups, conns) {
    var card = el("section", "topo-card");
    var head = el("div", "topo-head");
    head.appendChild(el("h3", null, "How this dispatch works"));
    head.appendChild(el("span", "spacer"));
    head.appendChild(el("span", "count", groups.length + (groups.length === 1 ? " group" : " groups")));
    head.appendChild(el("span", "count", conns.length + (conns.length === 1 ? " connection" : " connections")));
    card.appendChild(head);

    if (d._orphan_close) {
      var b1 = el("div", "banner orphan");
      b1.style.margin = "14px";
      b1.textContent = "Orphan close row: a closure exists in the ledger, but the dispatch row was never written. " +
        "There is no registered topology — only the closing block is known.";
      card.appendChild(b1);
      return card;
    }
    if (!groups.length) {
      var b2 = el("div", "banner legacy");
      b2.style.margin = "14px";
      b2.textContent = d._legacy
        ? "Legacy row (before v0.5.2): no registered topology. This row has no groups block, so there are no groups, angles, or tension axis to draw."
        : "This row declares no group — there is no topology to draw.";
      card.appendChild(b2);
      return card;
    }

    // Legend: names the three edge types and the robot talks convention, so
    // the drawn trace is legible. Clicking an agent opens the initial prompt.
    var legend = el("div", "topo-legend");
    [["sequential", "sequential"], ["zigzag", "zig-zag"], ["feedback", "feedback"]].forEach(function (p) {
      var t = el("span", "t");
      t.appendChild(edgeLegendGlyph(p[0]));
      t.appendChild(el("span", null, p[1]));
      legend.appendChild(t);
    });
    var anyRobot = groups.some(function (g) { return obj(g).robot_talks; });
    if (anyRobot) {
      var rtL = el("span", "t");
      rtL.appendChild(el("span", "rt-line"));
      rtL.appendChild(el("span", null, "robot talks — agents talk to each other"));
      legend.appendChild(rtL);
    }
    var hint = el("span", "t");
    hint.style.color = "var(--text-3)";
    hint.appendChild(el("span", null, "click an agent to view the initial prompt"));
    legend.appendChild(hint);
    card.appendChild(legend);

    var order = orderGroups(groups, conns);
    var scroll = el("div", "topo-scroll");
    var lane = el("div", "topo-lane");
    order.forEach(function (g) { lane.appendChild(groupNode(g, d)); });
    scroll.appendChild(lane);
    card.appendChild(scroll);

    POST.push(function () { drawEdges(lane, order, conns); });

    var foot = el("div", "topo-foot");
    if (!conns.length) {
      foot.appendChild(el("p", "prose", "No connection declared — the groups have no edges between them."));
    } else {
      foot.appendChild(el("div", "block-label", "Declared connections"));
      conns.forEach(function (c) { foot.appendChild(connRow(obj(c))); });
    }
    card.appendChild(foot);
    return card;
  }

  function orderGroups(groups, conns) {
    var ids = groups.map(function (g) { return obj(g).group_id; });
    var indeg = {}, adj = {};
    ids.forEach(function (i) { indeg[i] = 0; adj[i] = []; });
    conns.forEach(function (c) {
      c = obj(c);
      if (String(c.type || "").toLowerCase() === "feedback") return; // return edge does not define order
      if (indeg[c.to] === undefined || adj[c.from] === undefined) return;
      adj[c.from].push(c.to);
      indeg[c.to]++;
    });
    var out = [], seen = {};
    var queue = ids.filter(function (i) { return indeg[i] === 0; });
    while (queue.length) {
      var cur = queue.shift();
      if (seen[cur]) continue;
      seen[cur] = 1;
      out.push(cur);
      adj[cur].forEach(function (nx) {
        indeg[nx]--;
        if (indeg[nx] <= 0 && !seen[nx]) queue.push(nx);
      });
    }
    ids.forEach(function (i) { if (!seen[i]) { seen[i] = 1; out.push(i); } });
    var byId = {};
    groups.forEach(function (g) { byId[obj(g).group_id] = g; });
    return out.map(function (i) { return obj(byId[i]); }).filter(function (g) { return g; });
  }

  function groupNode(g, d) {
    var agents = arr(g.agents);
    var n = el("div", "topo-group");
    n.setAttribute("data-gid", str(g.group_id));
    var h = el("div", "tg-head");
    h.appendChild(el("div", "tg-id", g.group_id || "(group without id)"));
    var tg = el("div", "tg-tags");
    tg.appendChild(pill("n = " + (g.n != null ? g.n : agents.length), "ghost"));
    if (g.layers != null) tg.appendChild(pill(g.layers + (g.layers === 1 ? " layer" : " layers"), "info"));
    if (g.robot_talks) tg.appendChild(pill("robot talks", "live"));
    h.appendChild(tg);
    n.appendChild(h);

    var bias = el("div", "tg-bias");
    if (g.anti_bias) {
      bias.appendChild(el("b", null, "axis · "));
      bias.appendChild(document.createTextNode(g.anti_bias));
    } else {
      bias.style.color = "var(--text-3)";
      bias.textContent = "no anti_bias declared";
    }
    n.appendChild(bias);

    var box = el("div", "tg-agents" + (g.robot_talks ? " rt" : ""));
    if (!agents.length) {
      box.appendChild(el("div", "sub", "group with no declared agents"));
    }
    agents.forEach(function (a, i) {
      a = obj(a);
      var row = el("div", "ta ta-click");
      var label = a.agent_name || ((a.role || "agent") + " #" + (i + 1));
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-label", "View the initial prompt of " + label);
      row.title = "View the initial prompt of " + label;
      var dot = el("span", "dot");
      dot.style.background = ROLE_COLOR[a.role] || "#a1a1aa";
      row.appendChild(dot);
      var body = el("div");
      body.style.minWidth = "0";
      var nm = el("div", "nm" + (a.agent_name ? "" : " anon"), label);
      body.appendChild(nm);
      var sub = [];
      if (a.role) sub.push(a.role);
      if (a.model) sub.push(a.model);
      if (a.token_budget != null) sub.push("~" + a.token_budget + " tok");
      body.appendChild(el("div", "sub", sub.join(" · ") || "no model declared"));
      row.appendChild(body);
      var activate = function () { openAgentModal(a, g, d, i, row); };
      row.addEventListener("click", activate);
      row.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar" || ev.key === "Space") {
          ev.preventDefault();
          activate();
        }
      });
      box.appendChild(row);
    });
    n.appendChild(box);
    if (g.robot_talks) {
      var rt = el("div", "tg-bias");
      rt.style.borderBottom = "0";
      rt.style.color = "var(--accent)";
      rt.style.fontSize = "11px";
      rt.textContent = "robot talks: the agents in this group talk to each other before delivering.";
      n.appendChild(rt);
    }
    return n;
  }

  var EDGE_COLOR = { sequential: "#1d4ed8", zigzag: "#a35b06", feedback: "#5b5bd6", other: "#71717a" };
  function edgeKind(t) {
    var s = String(t || "").toLowerCase();
    if (s.indexOf("feedback") !== -1) return "feedback";
    if (s.indexOf("zig") !== -1) return "zigzag";
    if (s.indexOf("sequential") !== -1 || s === "") return "sequential";
    return "other";
  }

  // true if the dispatch (slim row) has at least one edge of type `kind`.
  function hasEdge(d, kind) {
    return arr(obj(d)._connection_types).some(function (t) { return edgeKind(t) === kind; });
  }

  // Compact badges for the level 1 card. Returns null when there is nothing
  // to show (keeps the card clean). sequential is the default and does not become a badge.
  function topoBadges(d) {
    d = obj(d);
    var box = el("div", "cbadges");
    if (d._robot_talks) {
      var rb = el("span", "cbadge rt");
      rb.appendChild(el("span", "cbadge-sw"));
      rb.appendChild(el("span", null, "robot talks"));
      box.appendChild(rb);
    }
    arr(d._connection_types).forEach(function (t) {
      var kind = edgeKind(t);
      if (kind === "sequential") return;
      var b = el("span", "cbadge");
      var sw = el("span", "cbadge-sw");
      sw.style.background = EDGE_COLOR[kind] || EDGE_COLOR.other;
      b.appendChild(sw);
      b.appendChild(el("span", null, str(t)));
      box.appendChild(b);
    });
    return box.childNodes.length ? box : null;
  }

  // Miniature glyph of an edge, for the diagram legend — same shape
  // and color that connRow draws, so legend and stroke coincide.
  function edgeLegendGlyph(kind) {
    var s = svgn("svg", { width: 30, height: 12, viewBox: "0 0 30 12", fill: "none" });
    var color = EDGE_COLOR[kind] || EDGE_COLOR.other;
    var d;
    if (kind === "zigzag") d = "M1 6 L6 2 L11 10 L16 2 L21 10 L26 6";
    else d = "M1 6 H26";
    var extra = kind === "feedback" ? ' stroke-dasharray="4 3"' : (kind === "other" ? ' stroke-dasharray="2 3"' : '');
    s.innerHTML = '<path d="' + d + '" stroke="' + color + '" stroke-width="1.7" fill="none" stroke-linecap="round"' + extra + '/>' +
      '<path d="M24 3 L28 6 L24 9" stroke="' + color + '" stroke-width="1.7" fill="none" stroke-linecap="round"/>';
    return s;
  }

  function drawEdges(lane, order, conns) {
    if (!lane || !lane.isConnected) return;
    var old = lane.querySelector(".topo-edges");
    if (old) old.parentNode.removeChild(old);
    if (!conns.length) return;

    var laneRect = lane.getBoundingClientRect();
    var W = Math.max(lane.scrollWidth, Math.round(laneRect.width));
    var H = Math.max(lane.scrollHeight, Math.round(laneRect.height));
    if (!W || !H) return;

    var pos = {}, idx = {};
    var nodes = lane.querySelectorAll(".topo-group");
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      var gid = nodes[i].getAttribute("data-gid");
      pos[gid] = {
        x1: r.left - laneRect.left, x2: r.right - laneRect.left,
        y1: r.top - laneRect.top, y2: r.bottom - laneRect.top
      };
      pos[gid].cx = (pos[gid].x1 + pos[gid].x2) / 2;
      pos[gid].cy = (pos[gid].y1 + pos[gid].y2) / 2;
      idx[gid] = i;
    }

    var s = svgn("svg", { "class": "topo-edges", width: W, height: H, viewBox: "0 0 " + W + " " + H });
    var defs = svgn("defs");
    Object.keys(EDGE_COLOR).forEach(function (k) {
      var m = svgn("marker", {
        id: "arw-" + k, viewBox: "0 0 10 10", refX: 8.5, refY: 5,
        markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse"
      });
      m.appendChild(svgn("path", { d: "M0,1 L9,5 L0,9 z", fill: EDGE_COLOR[k] }));
      defs.appendChild(m);
    });
    s.appendChild(defs);

    var overCount = 0, underCount = 0;
    conns.forEach(function (c) {
      c = obj(c);
      var a = pos[c.from], b = pos[c.to];
      if (!a || !b) return;
      var kind = edgeKind(c.type);
      var color = EDGE_COLOR[kind];
      var ia = idx[c.from], ib = idx[c.to];
      var path, labX, labY;

      if (c.from === c.to) {
        var yy = a.y1 - 16;
        path = "M" + (a.cx - 26) + "," + a.y1 + " C" + (a.cx - 26) + "," + (yy - 26) +
               " " + (a.cx + 26) + "," + (yy - 26) + " " + (a.cx + 26) + "," + a.y1;
        labX = a.cx; labY = yy - 22;
      } else if (kind === "feedback" || ib < ia) {
        underCount++;
        var depth = Math.min(46, 16 + underCount * 13);
        var ybot = Math.max(a.y2, b.y2) + depth;
        path = "M" + a.cx + "," + a.y2 + " C" + a.cx + "," + ybot +
               " " + b.cx + "," + ybot + " " + b.cx + "," + b.y2;
        labX = (a.cx + b.cx) / 2; labY = ybot + 2;
      } else if (ib === ia + 1) {
        var y = (a.cy + b.cy) / 2;
        if (kind === "zigzag") {
          path = zigPath(a.x2 + 2, y, b.x1 - 8, y, 7);
        } else {
          path = "M" + (a.x2 + 2) + "," + y + " L" + (b.x1 - 8) + "," + y;
        }
        labX = (a.x2 + b.x1) / 2; labY = y - 8;
      } else {
        overCount++;
        var lift = Math.min(48, 16 + overCount * 13);
        var ytop = Math.min(a.y1, b.y1) - lift;
        path = "M" + a.cx + "," + a.y1 + " C" + a.cx + "," + ytop +
               " " + b.cx + "," + ytop + " " + b.cx + "," + b.y1;
        labX = (a.cx + b.cx) / 2; labY = ytop - 3;
      }

      var p = svgn("path", {
        d: path, fill: "none", stroke: color, "stroke-width": 1.8,
        "stroke-linecap": "round", "marker-end": "url(#arw-" + kind + ")"
      });
      if (kind === "feedback") p.setAttribute("stroke-dasharray", "6 4");
      if (kind === "other") p.setAttribute("stroke-dasharray", "2 3");
      var ttl = svgn("title");
      ttl.textContent = str(c.from) + " → " + str(c.to) + " · " + str(c.type || "no type") +
        (c.loop_cap != null ? " · loop_cap " + c.loop_cap : "");
      p.appendChild(ttl);
      s.appendChild(p);

      var label = str(c.type || "no type") + (c.loop_cap != null ? " ×" + c.loop_cap : "");
      var tx = svgn("text", {
        x: labX.toFixed(1), y: labY.toFixed(1), "text-anchor": "middle",
        "font-size": 9.5, fill: color, stroke: "#ffffff", "stroke-width": 3,
        "paint-order": "stroke", "font-weight": 600
      });
      tx.textContent = label;
      s.appendChild(tx);
    });

    lane.insertBefore(s, lane.firstChild);
  }

  function zigPath(x1, y, x2, y2, amp) {
    var dx = x2 - x1;
    if (dx <= 8) return "M" + x1 + "," + y + " L" + x2 + "," + y;
    var segs = Math.max(2, Math.min(8, Math.round(dx / 14)));
    var step = dx / segs;
    var d = "M" + x1 + "," + y;
    for (var i = 1; i <= segs; i++) {
      var yy = (i === segs) ? y : (y + (i % 2 ? -amp : amp));
      d += " L" + (x1 + step * i).toFixed(1) + "," + yy.toFixed(1);
    }
    return d;
  }

  /* ---------- modal: agent prompt ---------- */
  // Choice: a modal overlay (instead of scrolling to the <details> below) because the
  // user asked to "click the agent and SEE the prompt" — the reveal has to be
  // immediate and unambiguous. The modal lives in document.body (outside #root), so
  // a re-render via SSE does not erase it. Keyboard: focus goes to the close button on
  // open, Esc/backdrop/× close it, Tab is trapped in the modal and focus returns to the
  // origin node on close.
  function closeAgentModal() {
    var back = document.querySelector(".agent-modal-backdrop");
    if (!back) return;
    if (back._onkey) document.removeEventListener("keydown", back._onkey, true);
    var inv = back._invoker;
    if (back.parentNode) back.parentNode.removeChild(back);
    if (inv && inv.isConnected) { try { inv.focus(); } catch (e) {} }
  }

  function openAgentModal(a, g, d, index, invoker) {
    closeAgentModal();
    a = obj(a); g = obj(g); d = obj(d);

    var back = el("div", "agent-modal-backdrop");
    var modal = el("div", "agent-modal");
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    var label = a.agent_name || ((a.role || "agent") + " #" + (num(index) + 1));
    modal.setAttribute("aria-label", "Agent detail " + label);

    var head = el("div", "am-head");
    var hl = el("div", "am-head-l");
    var dot = el("span", "am-dot");
    dot.style.background = ROLE_COLOR[a.role] || "#a1a1aa";
    hl.appendChild(dot);
    hl.appendChild(el("div", "am-name" + (a.agent_name ? "" : " anon"), label));
    head.appendChild(hl);
    var close = el("button", "am-close");
    close.type = "button";
    close.setAttribute("aria-label", "Close agent detail");
    close.textContent = "×";
    close.addEventListener("click", closeAgentModal);
    head.appendChild(close);
    modal.appendChild(head);

    var meta = el("div", "am-meta");
    meta.appendChild(pill(str(g.group_id || "group"), "ghost"));
    var rp = pill(a.role || "no role", "");
    rp.style.color = ROLE_COLOR[a.role] || "var(--text-2)";
    meta.appendChild(rp);
    meta.appendChild(pill(a.model || "model?", "ghost"));
    meta.appendChild(pill(a.token_budget != null ? "~" + a.token_budget + " tok" : "no budget", "ghost"));
    if (g.robot_talks) meta.appendChild(pill("robot talks", "live"));
    modal.appendChild(meta);

    var body = el("div", "am-body");

    var tb = el("div", "am-tension");
    tb.appendChild(el("div", "am-lbl", "agent angle"));
    tb.appendChild(el("div", "am-angle", a.angle ||
      "no angle declared — does not take part in the group's tension axis"));
    tb.appendChild(el("div", "am-lbl", "group axis (anti_bias)"));
    tb.appendChild(el("div", "am-axis", g.anti_bias || "no anti_bias declared in this group"));
    if (d.anti_bias_global) {
      tb.appendChild(el("div", "am-lbl", "dispatch global anti-bias"));
      tb.appendChild(el("div", "am-axis", d.anti_bias_global));
    }
    body.appendChild(tb);

    body.appendChild(el("div", "am-lbl", "initial prompt" + (a._prompt_truncated ? " (truncated)" : "")));
    if (a.initial_prompt) {
      var pre = el("pre", "am-prompt");
      pre.textContent = a.initial_prompt;
      pre.setAttribute("tabindex", "0");
      body.appendChild(pre);
    } else {
      body.appendChild(el("div", "am-noprompt", "no initial_prompt recorded"));
    }
    modal.appendChild(body);
    back.appendChild(modal);

    back.addEventListener("mousedown", function (ev) { if (ev.target === back) closeAgentModal(); });

    var onkey = function (ev) {
      if (ev.key === "Escape") { ev.preventDefault(); closeAgentModal(); return; }
      if (ev.key === "Tab") {
        var f = modal.querySelectorAll("button, [tabindex]");
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onkey, true);
    back._onkey = onkey;
    back._invoker = invoker || null;

    document.body.appendChild(back);
    close.focus();
  }

  /* ---------- detailed groups ---------- */
  function groupBlock(g) {
    var wrap = el("div", "group");
    var head = el("div", "group-head");
    head.appendChild(el("span", "gid", g.group_id || "(group without id)"));
    var agents = arr(g.agents);
    head.appendChild(pill("n = " + (g.n != null ? g.n : agents.length), "ghost"));
    head.appendChild(pill(agents.length + (agents.length === 1 ? " agent" : " agents"), ""));
    if (g.layers != null) head.appendChild(pill(g.layers + (g.layers === 1 ? " layer" : " layers"), "info"));
    if (g.robot_talks) head.appendChild(pill("robot talks", "live"));
    wrap.appendChild(head);

    var bias = el("div", "group-bias");
    if (g.anti_bias) {
      bias.appendChild(el("b", null, "group anti-bias · "));
      bias.appendChild(document.createTextNode(g.anti_bias));
    } else {
      bias.style.color = "var(--text-3)";
      bias.textContent = "no anti_bias declared in this group";
    }
    wrap.appendChild(bias);

    agents.forEach(function (a, i) { wrap.appendChild(agentRow(obj(a), i)); });
    if (!agents.length) {
      var e = el("div", "agent");
      e.style.color = "var(--text-3)";
      e.textContent = "group with no declared agents";
      wrap.appendChild(e);
    }
    return wrap;
  }

  function agentRow(a, i) {
    var row = el("div", "agent");
    var av = el("div", "avatar", initials(a.agent_name));
    av.style.background = ROLE_COLOR[a.role] || "#71717a";
    if (!a.agent_name) { av.style.opacity = ".5"; }
    row.appendChild(av);

    var body = el("div");
    body.style.flex = "1";
    body.style.minWidth = "0";

    var who = el("div", "who");
    who.appendChild(el("span", "nm" + (a.agent_name ? "" : " anon"),
      a.agent_name || ((a.role || "agent") + " #" + ((i || 0) + 1) + " — no name")));
    var rp = pill(a.role || "no role", "");
    rp.style.color = ROLE_COLOR[a.role] || "var(--text-2)";
    who.appendChild(rp);
    who.appendChild(pill(a.model || "model?", "ghost"));
    who.appendChild(pill(a.token_budget != null ? "~" + a.token_budget + " tok" : "no budget", "ghost"));
    body.appendChild(who);

    if (a.angle) body.appendChild(el("div", "angle", a.angle));
    else body.appendChild(el("div", "no-angle", "no angle declared — does not take part in the group's tension axis"));

    if (a.initial_prompt) {
      var dt = el("details");
      dt.appendChild(el("summary", null, "initial prompt" + (a._prompt_truncated ? " (truncated)" : "")));
      dt.appendChild(el("pre", null, a.initial_prompt));
      body.appendChild(dt);
    } else {
      body.appendChild(el("div", "no-angle", "no initial_prompt recorded"));
    }
    row.appendChild(body);
    return row;
  }

  function connRow(c) {
    var kind = edgeKind(c.type);
    var row = el("div", "conn " + kind);
    row.appendChild(el("span", "node", c.from || "?"));
    var s = svgn("svg", { width: 46, height: 14, viewBox: "0 0 46 14", fill: "none" });
    var color = EDGE_COLOR[kind];
    var d;
    if (kind === "zigzag") d = "M1 7 L8 2 L15 12 L22 2 L29 12 L36 7";
    else if (kind === "feedback") d = "M40 3 C40 12 6 12 6 7";
    else d = "M1 7 H36";
    s.innerHTML = '<path d="' + d + '" stroke="' + color + '" stroke-width="1.6" fill="none" stroke-linecap="round"' +
      (kind === "feedback" ? ' stroke-dasharray="4 3"' : '') + '/>' +
      (kind === "feedback"
        ? '<path d="M2 3 L6 7 L10 3" stroke="' + color + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
        : '<path d="M36 3 L41 7 L36 11" stroke="' + color + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>');
    row.appendChild(s);
    row.appendChild(el("span", "node", c.to || "?"));
    row.appendChild(el("span", "ctype", c.type || "no type"));
    if (c.loop_cap != null) row.appendChild(pill("loop_cap " + c.loop_cap, "warn"));
    return row;
  }

  /* ===================== render ===================== */
  var POST = [];

  function render(opt) {
    opt = opt || {};
    POST = [];
    var root = document.getElementById("root");
    var scroll = window.scrollY;

    var app = el("div", "shell");
    app.id = "app";
    app.setAttribute("data-testid", "app");
    app.appendChild(buildSidebar());

    var main = el("main");
    main.appendChild(buildTopbar());
    var view;
    try {
      if (S.route.level === 1) view = viewRepo();
      else if (S.route.level === 2) view = viewDispatch();
      else view = viewPainel();
    } catch (e) {
      view = el("div", "content");
      view.appendChild(el("div", "banner err", "Failed to render this level: " + String(e && e.message || e)));
      view.appendChild(link("#/", "back", "← back to dashboard"));
    }
    main.appendChild(view);
    app.appendChild(main);

    root.innerHTML = "";
    root.appendChild(app);
    window.scrollTo(0, opt.top ? 0 : scroll);

    var jobs = POST;
    POST = [];
    jobs.forEach(function (fn) { try { fn(); } catch (e) { /* the diagram is decorative if it fails */ } });

    if (opt.focus === "search") {
      var i = root.querySelector(".search");
      if (i) { i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} }
    }
  }

  /* ===================== boot ===================== */
  function onRoute() {
    var prev = S.route;
    S.route = parseRoute();
    if (!prev || prev.level !== S.route.level || prev.repo !== S.route.repo) {
      S.filters = { state: "all", type: "all", q: "", conn: "all" };
      S.limit = PAGE;
      S.span = "auto";
    }
    S.notice = "";
    ensureData();
    render({ top: true });
  }

  window.addEventListener("hashchange", onRoute);
  window.addEventListener("resize", function () {
    if (S.route.level === 2) render();
  });

  S.route = parseRoute();
  render();
  ensureData();
  connectStream();
  // safety net in case SSE is not available
  setInterval(function () { if (!S.connected) reloadAll(); }, 5000);
})();
</script>
</body>
</html>
