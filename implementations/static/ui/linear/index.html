<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Control Plane</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --surface-alt: #f7f7f9;
    --border: #e8e8ed;
    --border-strong: #dcdce3;
    --text: #18181b;
    --text-2: #71717a;
    --text-3: #a1a1aa;
    --accent: #5b5bd6;
    --accent-soft: #eeeefc;
    --green: #17803d;
    --green-soft: #e9f6ee;
    --amber: #a35b06;
    --amber-soft: #fdf3e3;
    --red: #b42318;
    --red-soft: #fdeceb;
    --blue: #1d4ed8;
    --blue-soft: #eaeffd;
    --r: 8px;
    --shadow-1: 0 1px 2px rgba(24,24,27,.04);
    --shadow-2: 0 1px 3px rgba(24,24,27,.06), 0 6px 16px rgba(24,24,27,.05);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: #ddddfa; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 244px minmax(0,1fr); min-height: 100vh; }

  .sidebar {
    background: var(--surface-alt);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow: hidden;
  }
  .brand { display: flex; gap: 10px; align-items: center; padding: 16px 16px 10px; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: linear-gradient(150deg, #6f6ff0, #4a4ac4);
    display: grid; place-items: center; box-shadow: var(--shadow-1);
  }
  .brand-name { font-size: 13px; font-weight: 620; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--text-3); margin-top: -2px; }

  .side-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-3); padding: 0 8px; margin: 10px 0 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .repo-nav { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
  .repo-item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 5px 8px; border: 0; border-radius: 6px; background: transparent;
    cursor: pointer; color: var(--text-2); font-size: 12.5px; margin-bottom: 1px;
  }
  .repo-item:hover { background: #efeff2; color: var(--text); }
  .repo-item[aria-current="true"] { background: var(--accent-soft); color: #3f3fae; font-weight: 550; }
  .repo-item .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--text-3); }
  .repo-item .dot.on { background: var(--green); }
  .repo-item .dot.err { background: var(--red); }
  .repo-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count {
    font-size: 11px; font-variant-numeric: tabular-nums; color: var(--text-3);
    background: #ececf0; border-radius: 20px; padding: 0 6px; line-height: 16px; flex: none;
  }
  .count.open { background: var(--green-soft); color: var(--green); }
  .count.pend { background: var(--accent-soft); color: #4a4ac4; }
  .side-foot { border-top: 1px solid var(--border); padding: 10px 20px; font-size: 11px; color: var(--text-3); }

  /* ---------- live indicator ---------- */
  .live {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px;
    padding: 3px 9px 3px 7px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); white-space: nowrap;
  }
  .live .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; }
  .live[data-live="on"] { border-color: #cceada; background: var(--green-soft); color: var(--green); }
  .live[data-live="on"] .pulse { background: var(--green); animation: pulse 2.2s ease-in-out infinite; }
  .live[data-live="off"] { border-color: #f6d5d2; background: var(--red-soft); color: var(--red); }
  .live[data-live="off"] .pulse { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------- topbar ---------- */
  main { min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 30; background: rgba(251,251,253,.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    padding: 11px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .crumbs h1 { font-size: 14px; font-weight: 620; margin: 0; letter-spacing: -.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
  .crumbs a { font-size: 13px; color: var(--text-3); }
  .crumbs a:hover { color: var(--accent); }
  .crumbs .sep { color: var(--text-3); font-size: 12px; }
  .spacer { flex: 1; }
  .total {
    font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums;
    border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 3px 9px;
  }
  .total b { color: var(--text); font-weight: 600; }

  .segmented { display: inline-flex; background: #ececf0; border-radius: 7px; padding: 2px; gap: 2px; }
  .segmented button {
    border: 0; background: transparent; border-radius: 5px; padding: 3px 9px;
    font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 550; box-shadow: var(--shadow-1); }

  .content { padding: 22px 28px 72px; max-width: 1220px; }

  .sec-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
  .sec-head h2 { font-size: 13px; font-weight: 620; margin: 0; letter-spacing: -.005em; }
  .sec-head .hint { font-size: 12px; color: var(--text-3); }
  .sec { margin-bottom: 30px; }

  /* ---------- pending ---------- */
  .pending-zone {
    background: linear-gradient(180deg, #f4f4fe, rgba(244,244,254,0));
    border: 1px solid #e2e2f5; border-radius: 12px; padding: 16px; margin-bottom: 30px;
  }
  .pending-zone .sec-head h2 { color: #3f3fae; }
  .gate-tag {
    font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: #4a4ac4; background: #e4e4fb; border-radius: 5px; padding: 2px 6px;
  }
  .pending-card {
    background: var(--surface); border: 1px solid #dedef2; border-radius: var(--r);
    box-shadow: var(--shadow-2); padding: 15px 17px; margin-bottom: 12px;
  }
  .pending-card:last-child { margin-bottom: 0; }
  .pending-top { display: flex; align-items: flex-start; gap: 14px; }
  .pending-goal { font-size: 15.5px; font-weight: 580; letter-spacing: -.012em; margin: 7px 0 0; line-height: 1.4; }
  .pending-ctx { color: var(--text-2); margin: 6px 0 0; font-size: 13px; max-width: 80ch; }
  .pending-id { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); margin-top: 4px; }
  .btn-dispatch {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: #fff; border: 1px solid #4a4ac4; border-radius: 6px;
    padding: 6px 13px; font-size: 12.5px; font-weight: 550; cursor: pointer; box-shadow: var(--shadow-1);
  }
  .btn-dispatch:disabled { background: #c9c9ea; border-color: #c0c0e3; color: #f4f4ff; cursor: not-allowed; box-shadow: none; }
  .phase-note { font-size: 11px; color: var(--text-3); text-align: right; margin-top: 4px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .empty {
    border: 1px dashed var(--border-strong); border-radius: var(--r); background: var(--surface);
    padding: 20px; text-align: center; color: var(--text-2); font-size: 13px;
  }
  .empty b { display: block; color: var(--text); font-weight: 580; margin-bottom: 2px; }

  /* ---------- panel: today ---------- */
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(390px, 1fr)); gap: 18px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-1); overflow: hidden; }
  .panel-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px;
    background: var(--surface-alt); border-bottom: 1px solid var(--border);
  }
  .panel-head h3 { margin: 0; font-size: 12.5px; font-weight: 600; }
  .panel-body { padding: 0; }
  .panel-empty { padding: 16px 14px; color: var(--text-3); font-size: 12.5px; }

  /* ---------- dispatch rows ---------- */
  .rows { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-1); }
  .panel .rows { border: 0; border-radius: 0; box-shadow: none; }
  a.dispatch-card {
    display: flex; align-items: center; gap: 10px; padding: 8px 13px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  a.dispatch-card:last-child { border-bottom: 0; }
  a.dispatch-card:hover { background: #fafafc; }
  .state-icon { flex: none; }
  .dc-main { flex: 1; min-width: 0; }
  .dc-goal { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dc-meta {
    font-size: 11.5px; color: var(--text-3); display: flex; gap: 7px; margin-top: 1px;
    overflow: hidden; white-space: nowrap;
  }
  .dc-meta .mono { font-family: var(--mono); }
  .dc-tail { display: flex; align-items: center; gap: 6px; flex: none; }
  .dc-repo { font-size: 11px; color: var(--accent); font-weight: 550; }

  .pill {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 20px;
    padding: 1px 8px; font-size: 11px; font-weight: 550; white-space: nowrap;
    background: #f1f1f4; color: var(--text-2); border: 1px solid transparent;
  }
  .pill.open { background: var(--green-soft); color: var(--green); }
  .pill.closed { background: #f1f1f4; color: var(--text-2); }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.warn { background: var(--amber-soft); color: var(--amber); }
  .pill.danger { background: var(--red-soft); color: var(--red); }
  .pill.live { background: var(--accent-soft); color: #4a4ac4; }
  .pill.reserved { background: #f1f1f4; color: var(--text-2); border-color: var(--border-strong); border-style: dashed; }
  .pill.info { background: var(--blue-soft); color: var(--blue); }
  .pill.ghost { background: transparent; border-color: var(--border-strong); color: var(--text-2); }
  .pill.plain { background: transparent; border: 0; color: var(--text-3); font-weight: 450; padding: 1px 2px; }
  .pill .swatch { width: 7px; height: 7px; border-radius: 2px; flex: none; }

  /* ---------- repo grid (level 0) ---------- */
  .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }
  a.repo-card {
    display: block; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 12px 13px; box-shadow: var(--shadow-1);
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  a.repo-card:hover { border-color: #c9c9ec; box-shadow: var(--shadow-2); }
  .rc-top { display: flex; align-items: center; gap: 6px; }
  .rc-name { font-size: 12.5px; font-weight: 620; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-nums { display: flex; align-items: baseline; gap: 8px; margin: 7px 0 8px; flex-wrap: wrap; }
  .rc-total { font-size: 21px; font-weight: 620; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .rc-unit { font-size: 11.5px; color: var(--text-3); }
  .typebar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: #eeeef1; }
  .typebar > i { display: block; height: 100%; }
  .rc-types { display: flex; gap: 4px 9px; flex-wrap: wrap; margin-top: 7px; font-size: 11px; color: var(--text-2); }
  .rc-types .t { display: inline-flex; align-items: center; gap: 4px; }
  .rc-types .t i { width: 7px; height: 7px; border-radius: 2px; display: block; }
  .rc-types .t b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .rc-path { font-size: 10.5px; color: var(--text-3); font-family: var(--mono); margin-top: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- repo header (level 1) ---------- */
  .repo-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 15px 17px; box-shadow: var(--shadow-1); margin-bottom: 18px; }
  .repo-hero h2 { margin: 0; font-size: 17px; font-weight: 640; letter-spacing: -.018em; }
  .repo-hero .path { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); margin-top: 2px; word-break: break-all; }
  .stats { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 13px; }
  .stat .v { font-size: 19px; font-weight: 620; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
  .stat.hot .v { color: var(--green); }
  .stat.gate .v { color: var(--accent); }

  details.diag { margin-top: 10px; }
  details.diag > summary {
    cursor: pointer; list-style: none; font-size: 11.5px; display: inline-flex; align-items: center; gap: 6px;
    color: var(--amber); background: var(--amber-soft); border: 1px solid #f2e0c2; border-radius: 6px; padding: 2px 9px;
  }
  details.diag.error > summary { color: var(--red); background: var(--red-soft); border-color: #f6d5d2; }
  details.diag > summary::-webkit-details-marker { display: none; }
  details.diag .diag-body {
    margin-top: 6px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; max-height: 210px; overflow: auto;
    font-family: var(--mono); font-size: 11px; color: var(--text-2);
  }
  details.diag .diag-body div { padding: 1px 0; }

  /* ---------- plot ---------- */
  .plot-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 13px 15px 9px; box-shadow: var(--shadow-1); margin-bottom: 18px; }
  .plot-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .plot-head h3 { margin: 0; font-size: 12.5px; font-weight: 600; }
  .plot-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--text-2); }
  .plot-legend .t { display: inline-flex; align-items: center; gap: 4px; }
  .plot-legend .t i { width: 8px; height: 8px; border-radius: 2px; display: block; }
  .plot-legend .t b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .plot-wrap svg { display: block; width: 100%; height: auto; }
  .plot-hit { fill: transparent; }
  .plot-hit:hover { fill: rgba(91,91,214,.10); }
  .plot-note { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .plot-note.warn { color: var(--amber); }

  /* ---------- filters ---------- */
  .filters { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .search {
    padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); font-size: 12.5px; outline: none; min-width: 230px;
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select.sel {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); font-size: 12.5px; outline: none;
  }
  .match { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .load-more {
    display: block; width: 100%; text-align: center; padding: 8px; background: var(--surface);
    border: 0; border-top: 1px solid var(--border); color: var(--accent); font-size: 12.5px; cursor: pointer;
  }
  .load-more:hover { background: var(--surface-alt); }

  /* ---------- level 2 ---------- */
  .d-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow-1); margin-bottom: 16px; }
  .d-id { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .d-goal { font-size: 19px; font-weight: 600; letter-spacing: -.018em; margin: 8px 0 0; line-height: 1.35; max-width: 74ch; }
  .d-ctx { font-size: 13px; color: var(--text-2); margin: 8px 0 0; max-width: 82ch; }
  .kv { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 13px 0 0; }
  .kv > div { min-width: 120px; }
  .kv dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
  .kv dd { margin: 1px 0 0; font-size: 12.5px; word-break: break-word; }
  .block-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-3); margin: 0 0 8px;
  }
  .prose { font-size: 13px; color: var(--text-2); margin: 0 0 4px; max-width: 80ch; }

  .axis-hero {
    background: linear-gradient(180deg, #f4f4fe, #fff);
    border: 1px solid #dedef2; border-left: 3px solid var(--accent);
    border-radius: var(--r); padding: 12px 15px; margin-bottom: 14px;
  }
  .axis-hero .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #4a4ac4; }
  .axis-hero .txt { font-size: 14.5px; color: var(--text); margin-top: 3px; max-width: 78ch; line-height: 1.45; }
  .axis-hero.none { background: var(--surface-alt); border-left-color: var(--border-strong); border-color: var(--border); }
  .axis-hero.none .lbl { color: var(--text-3); }
  .axis-hero.none .txt { font-size: 13px; color: var(--text-3); }

  /* topology */
  .topo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-1); margin-bottom: 16px; overflow: hidden; }
  .topo-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--surface-alt); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .topo-head h3 { margin: 0; font-size: 12.5px; font-weight: 600; }
  .topo-scroll { overflow-x: auto; }
  .topo-lane { position: relative; display: flex; gap: 104px; padding: 60px 22px; align-items: flex-start; width: max-content; min-width: 100%; }
  .topo-edges { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
  .topo-group {
    position: relative; z-index: 2; width: 236px; flex: none;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: var(--shadow-1); overflow: hidden;
  }
  .tg-head { padding: 7px 10px; background: var(--surface-alt); border-bottom: 1px solid var(--border); }
  .tg-id { font-size: 12.5px; font-weight: 620; font-family: var(--mono); }
  .tg-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .tg-bias { padding: 6px 10px; font-size: 11.5px; color: var(--text-2); border-bottom: 1px dashed var(--border); line-height: 1.4; }
  .tg-bias b { color: var(--text); font-weight: 560; }
  .tg-agents { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .tg-agents.rt { position: relative; padding-left: 20px; }
  .tg-agents.rt::before {
    content: ""; position: absolute; left: 9px; top: 14px; bottom: 14px;
    border-left: 2px dashed var(--accent);
  }
  .tg-agents.rt .ta::before {
    content: ""; position: absolute; left: -15px; top: 9px; width: 12px; height: 0;
    border-top: 2px dashed var(--accent);
  }
  .ta { position: relative; display: flex; gap: 7px; align-items: flex-start; }
  .ta .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; margin-top: 5px; }
  .ta .nm { font-size: 12px; font-weight: 550; line-height: 1.3; word-break: break-word; }
  .ta .nm.anon { color: var(--text-3); font-weight: 450; font-style: italic; }
  .ta .sub { font-size: 10.5px; color: var(--text-3); font-family: var(--mono); }
  .topo-foot { padding: 8px 14px 10px; border-top: 1px solid var(--border); background: var(--surface-alt); }

  .conn { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; flex-wrap: wrap; }
  .conn .node { font-family: var(--mono); font-size: 11.5px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 5px; padding: 1px 7px; }
  .conn .ctype { font-size: 11px; font-weight: 600; letter-spacing: .01em; }
  .conn.sequential .ctype { color: var(--blue); }
  .conn.zigzag .ctype { color: var(--amber); }
  .conn.feedback .ctype { color: var(--accent); }

  /* detailed groups */
  .group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-1); }

<body>
<div id="root"><div class="boot">Loading state…</div></div>

<script>
(function () {
  "use strict";

  /* ===================== state ===================== */
  var PAGE = 25;
  // Mirrors server/main.py:OPEN_ALL_CAP — the cap of the "everything that is open" list.
  var OPEN_ALL_CAP = 200;

  var S = {
    route: { level: 0 },
    caps: null,            // {overview:bool, repo:bool} — discovered via /openapi.json
    overview: null,
    overviewErr: null,
    snapshot: null,        // only in degraded mode
    repos: {},             // name -> {data, err, loading}
    disp: {},              // "repo|id" -> {data, err, loading}
    connected: false,
    degraded: false,       // true when /api/overview does not exist
    filters: { state: "all", type: "all", q: "", conn: "all" },
    span: "auto",
    limit: PAGE,
    notice: ""
  };

  /* ===================== util ===================== */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function link(href, cls, text) {
    var a = el("a", cls, text);
    a.href = href;
    return a;
  }
  var NS = "http://www.w3.org/2000/svg";
  function svgn(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, String(attrs[k]));
    return n;
  }
  function icon(d, size, box) {
    var s = svgn("svg", { width: size || 14, height: size || 14, viewBox: box || "0 0 16 16", fill: "none" });
    s.innerHTML = d;
    return s;
  }
  var ICON = {
    open: '<circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/>',
    closed: '<circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M5.6 8.2l1.7 1.7 3.2-3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    alert: '<circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 5v3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11" r=".9" fill="currentColor"/>',
    bolt: '<path d="M9 2L4 9h3.2L7 14l5-7H8.8L9 2z" fill="currentColor"/>',
    chevL: '<path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
  };

  function arr(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return (v && typeof v === "object" && !Array.isArray(v)) ? v : {}; }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : 0; }
  function str(v) { return (v === null || v === undefined) ? "" : String(v); }

  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function relTime(iso) {
    if (!iso) return "";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 0) return "now";
    if (s < 60) return "now";
    if (s < 3600) return Math.floor(s / 60) + " min";
    if (s < 86400) return Math.floor(s / 3600) + " h";
    if (s < 2592000) return Math.floor(s / 86400) + " d";
    return Math.floor(s / 2592000) + " mo";
  }
  function dayOf(iso) {
    // The ledger's `created` is ISO-8601 Z: its first 10 chars ARE the UTC day.
    // Slicing the string is the cheapest and correct match with `ledger._iso_day`.
    var s = str(iso);
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : null;
  }
  // Mirrors `ledger.iso_date`: precedence created → _close.closed → prefix of the
  // dispatch_id → no date. All in UTC, so a row falls on the SAME bar
  // regardless of which path (rich or basic) served it.
  function isoDate(row) {
    row = obj(row);
    var day = dayOf(row.created);
    if (day) return day;
    day = dayOf(obj(row._close).closed);
    if (day) return day;
    return dayOf(row.dispatch_id);
  }
  // TODAY's day in UTC — the SAME reference as `server.main.today_utc`. Using the
  // LOCAL day here would make the UI's "today" diverge from the rows' `_day` by a few hours.
  function utcToday() {
    var d = new Date();
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
  }
  function initials(name) {
    if (!name) return "·";
    var clean = String(name).replace(/,/g, " ").trim().split(/\s+/);
    return (clean[0] ? clean[0][0] : "?").toUpperCase() + (clean[1] ? clean[1][0].toUpperCase() : "");
  }

  var ROLE_COLOR = {
    explorer: "#5b5bd6", skeptic: "#b42318", synthesizer: "#17803d",
    writer: "#a35b06", auditor: "#1d4ed8"
  };
  var TYPE_COLOR = {
    research: "#5b5bd6", review: "#1d4ed8", experiment: "#17803d",
    code: "#a35b06", plan: "#0e7490", suggestion: "#9333ea"
  };
  var NO_TYPE = "(no type)";
  function typeColor(t) {
    var k = t || NO_TYPE;
    if (k === NO_TYPE) return "#c4c4cc";
    if (TYPE_COLOR[k]) return TYPE_COLOR[k];
    var h = 0;
    for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
    return "hsl(" + (h % 360) + ", 42%, 46%)";
  }
  var LIVE_TYPES = { research: 1, review: 1, experiment: 1 };
  var EXIT_TONE = {
    resolved: "ok", success: "ok",
    loop_ceiling_reached: "warn", user_abort: "warn",
    error: "danger", dissent_irreconcilable: "danger"
  };
  var EXIT_LABEL = {
    resolved: "resolved", success: "resolved",
    loop_ceiling_reached: "loop ceiling", user_abort: "aborted",
    error: "error", dissent_irreconcilable: "irreconcilable dissent"
  };
  var MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

  function isLive(d) {
    if (d && typeof d._live === "boolean") return d._live;
    return !!(d && LIVE_TYPES[d.dispatch_type]);
  }
  function pill(text, cls) { return el("span", "pill " + (cls || ""), text); }

  /* ===================== route ===================== */
  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  function parseRoute() {
    var raw = String(location.hash || "").replace(/^#/, "");
    var parts = raw.split("/").filter(function (x) { return x !== ""; });
    if (parts[0] === "repo" && parts.length >= 2) {
      var name = safeDecode(parts[1]);
      if (parts.length >= 3) return { level: 2, repo: name, id: safeDecode(parts.slice(2).join("/")) };
      return { level: 1, repo: name };
    }
    return { level: 0 };
  }
  function go(hash) { location.hash = hash; }

  /* ===================== fetch ===================== */
  function apiBase() {
    // works when served by the reader itself; falls back to 127.0.0.1:8765 if opened from disk
    return location.protocol === "file:" ? "http://127.0.0.1:8765" : "";
  }
  function jget(path) {
    return fetch(apiBase() + path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) {
        var e = new Error("HTTP " + r.status);
        e.status = r.status;
        throw e;
      }
      return r.json();
    });
  }

  // Discovers which endpoints exist WITHOUT triggering a 404 (which pollutes the console).
  function probeCaps() {
    return jget("/openapi.json").then(function (spec) {
      var paths = Object.keys(obj(spec && spec.paths));
      var hasOverview = paths.indexOf("/api/overview") !== -1;
      var hasRepo = paths.some(function (p) { return p.indexOf("/api/repo/") === 0; });
      return { overview: hasOverview, repo: hasRepo };
    }).catch(function () {
      return { overview: false, repo: false };
    });
  }

  /* ===================== degradation: derive from /api/snapshot ===================== */
  function slimFrom(d, repoName) {
    var groups = arr(d.groups);
    var roles = {};
    var agentCount = 0;
    var robot = false;
    groups.forEach(function (g) {
      g = obj(g);
      if (g.robot_talks) robot = true;
      arr(g.agents).forEach(function (a) {
        a = obj(a);
        agentCount++;
        var r = a.role || "(no role)";
        roles[r] = (roles[r] || 0) + 1;
      });
    });
    var ctypes = [];
    arr(d.connections).forEach(function (c) {
      var t = obj(c).type || "no type";
      if (ctypes.indexOf(t) === -1) ctypes.push(t);
    });
    var close = d._close ? { closed: obj(d._close).closed, exit_reason: obj(d._close).exit_reason } : null;
    return {
      dispatch_id: d.dispatch_id, created: d.created, _day: isoDate(d),
      dispatch_type: d.dispatch_type, goal: d.goal,
      invoked_by: d.invoked_by, working_folder: d.working_folder,
      max_loops: d.max_loops, final_approver: d.final_approver,
      anti_bias_global: d.anti_bias_global,
      _state: d._state === "open" ? "open" : "closed",
      _live: typeof d._live === "boolean" ? d._live : !!LIVE_TYPES[d.dispatch_type],
      _legacy: !!d._legacy,
      _agent_count: d._agent_count != null ? d._agent_count : agentCount,
      _orphan_close: !!d._orphan_close,
      _group_count: groups.length,
      _robot_talks: robot,
      _roles: roles,
      _connection_types: ctypes,
      _close: close,
      _repo: repoName
    };
  }

  function summarizeRepo(r, slims, today) {
    var byType = {};
    var live = 0, reserved = 0, legacy = 0, tCreated = 0, tClosed = 0;
    var firstDay = null, lastDay = null;
    slims.forEach(function (d) {
      var k = d.dispatch_type || NO_TYPE;
      byType[k] = (byType[k] || 0) + 1;
      if (d._live) live++;
      // RESERVED mirrors the server: non-LIVE AND non-legacy type. Legacy rows are
      // left out of both sides — they predate the distinction (ledger.py:593).
      else if (!d._legacy) reserved++;
      if (d._legacy) legacy++;
      if (d._day === today) tCreated++;
      if (d._close && dayOf(d._close.closed) === today) tClosed++;
      if (d._day) {
        if (!firstDay || d._day < firstDay) firstDay = d._day;
        if (!lastDay || d._day > lastDay) lastDay = d._day;
      }
    });
    var total = num(r.total_dispatches);
    var open = num(r.open_dispatches);
    return {
      name: r.name, path: r.path, ledger_exists: !!r.ledger_exists, error: r.error || null,
      warning_count: arr(r.warnings).length,
      total: total, open: open, closed: Math.max(0, total - open), legacy: legacy,
      by_type: byType, live: live, reserved: reserved,
      pending_count: arr(r.pending).length,
      today: { created: tCreated, closed: tClosed },
      open_now: open,
      first_day: firstDay, last_day: lastDay,
      last_created: slims.length ? slims[0].created : null,
      _sample: slims.length < total ? slims.length : 0
    };
  }

  function overviewFromSnapshot(snap) {
    var today = utcToday();
    var repos = [];
    var pending = [], openAll = [], openToday = [], recent = [];
    var totals = { repos: 0, total: 0, open: 0, closed: 0, pending: 0, by_type: {}, today: { created: 0, closed: 0 } };

    arr(snap.repos).forEach(function (r) {
      r = obj(r);
      var slims = arr(r.dispatches).map(function (d) { return slimFrom(obj(d), r.name); });
      var sum = summarizeRepo(r, slims, today);
      repos.push(sum);
      totals.repos++;
      totals.total += sum.total;
      totals.open += sum.open;
      totals.closed += sum.closed;
      totals.pending += sum.pending_count;
      totals.today.created += sum.today.created;
      totals.today.closed += sum.today.closed;
      Object.keys(sum.by_type).forEach(function (k) { totals.by_type[k] = (totals.by_type[k] || 0) + sum.by_type[k]; });
      arr(r.pending).forEach(function (p) {
        var e = obj(p);
        var c = {};
        for (var k in e) c[k] = e[k];
        c._repo = r.name;
        pending.push(c);
      });
      slims.forEach(function (d) {
        recent.push(d);
        if (d._state === "open") {
          openAll.push(d);
          if (d._day === today) openToday.push(d);
        }
      });
    });

    var byCreated = function (a, b) { return String(b.created || "").localeCompare(String(a.created || "")); };
    openAll.sort(byCreated);
    openToday.sort(byCreated);
    recent.sort(byCreated);

    // Mirrors the server's `attention`: caps `open_all` at OPEN_ALL_CAP and, when
    // it exceeds that, sets `_capped` (bool) + `_open_all_total` (int) — the SAME
    // shape as the rich path, so the render reads a single shape regardless of path.
    var attention = { pending: pending, open_today: openToday, open_all: openAll.slice(0, OPEN_ALL_CAP) };
    if (openAll.length > OPEN_ALL_CAP) {
      attention._capped = true;
      attention._open_all_total = openAll.length;
    }
    return {
      repos: repos, totals: totals, today: today,
      attention: attention,
      config: obj(snap.config),
      _recent: recent.slice(0, 12),
      _degraded: true
    };
  }

  function repoFromSnapshot(snap, name) {
    var found = null;
    arr(snap.repos).forEach(function (r) { if (obj(r).name === name) found = obj(r); });
    if (!found) return null;
    var today = (S.overview && S.overview.today) || utcToday();
    var slims = arr(found.dispatches).map(function (d) { return slimFrom(obj(d), name); });
    var sum = summarizeRepo(found, slims, today);
    return {
      name: name, path: found.path, ledger_exists: !!found.ledger_exists, error: found.error || null,
      warnings: arr(found.warnings),
      summary: sum,
      series: buildSeries(slims),
      pending: arr(found.pending).map(function (p) {
        var e = obj(p), c = {};
        for (var k in e) c[k] = e[k];
        c._repo = name;
        return c;
      }),
      dispatches: slims,
      // Truncation of the snapshot WINDOW (only the N most recent came). It is ANOTHER
      // concept than the server's `attention._capped` — its own name so it does not
      // collide. The rich path (/api/repo) brings the whole history and never sets this.
      _snapshot_capped: slims.length < sum.total ? slims.length : 0
    };
  }

  function buildSeries(slims) {
    var types = [], byDay = {}, totals = {}, undated = 0;
    var min = null, max = null;
    slims.forEach(function (d) {
      var t = d.dispatch_type || NO_TYPE;
      if (types.indexOf(t) === -1) types.push(t);
      totals[t] = (totals[t] || 0) + 1;
      if (!d._day) { undated++; return; }
      if (!min || d._day < min) min = d._day;
      if (!max || d._day > max) max = d._day;
      if (!byDay[d._day]) byDay[d._day] = {};
      byDay[d._day][t] = (byDay[d._day][t] || 0) + 1;
    });
    types.sort();
    var days = [];
    if (min && max) {
      var t0 = Date.parse(min + "T00:00:00Z"), t1 = Date.parse(max + "T00:00:00Z");
      if (isFinite(t0) && isFinite(t1) && t1 >= t0) {
        var span = Math.min(Math.round((t1 - t0) / 86400000), 1200);
        for (var i = 0; i <= span; i++) days.push(new Date(t0 + i * 86400000).toISOString().slice(0, 10));
      }
    }
    var series = {}, maxDay = 0;
    types.forEach(function (t) { series[t] = []; });
    days.forEach(function (day) {
      var sum = 0;
      types.forEach(function (t) {
        var v = (byDay[day] && byDay[day][t]) || 0;
        series[t].push(v);
        sum += v;
      });
      if (sum > maxDay) maxDay = sum;
    });
    return { days: days, types: types, series: series, totals: totals, max_day: maxDay, undated: undated };
  }

  /* ===================== loading ===================== */
  function loadOverview(force) {
    if (S.overviewLoading) return;
    if (S.overview && !force) return;
    S.overviewLoading = true;
    var done = function () { S.overviewLoading = false; };

    if (S.caps && S.caps.overview) {
      jget("/api/overview").then(function (j) {
        S.overview = j; S.degraded = false; S.overviewErr = null; done(); render();
      }).catch(function (e) {
        S.caps.overview = false; done(); loadOverview(true);
      });
      return;
    }
    jget("/api/snapshot").then(function (j) {
      S.snapshot = j;
      S.overview = overviewFromSnapshot(j);
      S.degraded = true; S.overviewErr = null;
      done(); render();
    }).catch(function (e) {
      S.overviewErr = String(e && e.message || e);
      done(); render();
    });
  }

  function loadRepo(name, force) {
    if (!name) return;
    var slot = S.repos[name];
    if (slot && (slot.loading || (slot.data && !force))) return;
    S.repos[name] = { loading: true, data: slot && slot.data, err: null };

    var fail = function (e) {
      S.repos[name] = { loading: false, data: null, err: String(e && e.message || e) };
      render();
    };
    if (S.caps && S.caps.repo) {
      jget("/api/repo/" + encodeURIComponent(name)).then(function (j) {
        S.repos[name] = { loading: false, data: j, err: null };
        render();
      }).catch(function () {
        if (S.caps) S.caps.repo = false;
        S.repos[name] = null;
        loadRepo(name, true);
      });
      return;
    }
    var use = function (snap) {
      var d = repoFromSnapshot(snap, name);
      if (!d) { fail(new Error("unknown repository")); return; }
      S.repos[name] = { loading: false, data: d, err: null };
      render();
    };
    if (S.snapshot && !force) { use(S.snapshot); return; }
    jget("/api/snapshot").then(function (j) { S.snapshot = j; use(j); }).catch(fail);
  }

  function loadDispatch(repoName, id, force) {
    if (!repoName || !id) return;
    var key = repoName + "|" + id;
    var slot = S.disp[key];
    if (slot && (slot.loading || (slot.data && !force))) return;
    S.disp[key] = { loading: true, data: slot && slot.data, err: null };
    jget("/api/dispatch/" + encodeURIComponent(repoName) + "/" + encodeURIComponent(id))
      .then(function (j) {
        S.disp[key] = { loading: false, data: obj(j.dispatch || j), err: null };
        render();
      })
      .catch(function (e) {
        S.disp[key] = { loading: false, data: null, err: String(e && e.message || e) };
        render();
      });
  }

  // Only in the edge case where the panel has NO dispatch to show.
  function ensureRecentFallback() {
    if (S.degraded || S.snapshot || S.recentLoading) return;
    S.recentLoading = true;
    jget("/api/snapshot").then(function (j) {
      S.snapshot = j;
      S.recentLoading = false;
      render();
    }).catch(function () { S.recentLoading = false; });
  }
  function recentAcross() {
    if (S.overview && arr(S.overview._recent).length) return S.overview._recent;
    if (!S.snapshot) return [];
    var out = [];
    arr(S.snapshot.repos).forEach(function (r) {
      r = obj(r);
      arr(r.dispatches).forEach(function (d) { out.push(slimFrom(obj(d), r.name)); });
    });
    out.sort(function (a, b) { return String(b.created || "").localeCompare(String(a.created || "")); });
    return out.slice(0, 12);
  }

  function ensureData() {
    if (!S.caps) {
      probeCaps().then(function (c) { S.caps = c; ensureData(); });
      return;
    }
    loadOverview(false);
    var r = S.route;
    if (r.level >= 1) loadRepo(r.repo, false);
    if (r.level === 2) loadDispatch(r.repo, r.id, false);
  }

  function reloadAll() {
    if (!S.caps) return;
    loadOverview(true);
    var r = S.route;
    if (r.level >= 1) loadRepo(r.repo, true);
    if (r.level === 2) loadDispatch(r.repo, r.id, true);
  }

  /* ===================== SSE ===================== */
  function connectStream() {
    if (!window.EventSource) return;
    var es;
    try { es = new EventSource(apiBase() + "/api/stream"); } catch (e) { return; }
    es.addEventListener("open", function () { S.connected = true; paintLive(); });
    es.addEventListener("snapshot", function () {
      // Change signal: the payload is not used directly; we reload the current level.
      var first = !S.connected;
      S.connected = true;
      paintLive();
      if (!first) reloadAll(); else reloadAll();
    });
    es.addEventListener("error", function () { S.connected = false; paintLive(); });
  }
  function buildLive() {
    var n = el("div", "live");

    n.appendChild(el("span", null, S.connected ? "live · connected" : "no live connection"));
    return n;
  }
  function paintLive() {
    var old = document.querySelector('[data-testid="live-indicator"]');
    if (old && old.parentNode) old.parentNode.replaceChild(buildLive(), old);
  }
