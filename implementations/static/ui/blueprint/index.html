<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRANCHA 01 — CONTROL PLANE DE DISPATCH</title>
<style>
:root{
  --bg:#0d2137;
  --bg-deep:#091a2b;
  --cy:#7ecbff;
  --cy-dim:#4e8ec0;
  --cy-faint:rgba(126,203,255,.30);
  --ink:#ffffff;
  --paper-line:rgba(126,203,255,.08);
  --paper-line-5:rgba(126,203,255,.16);
  --alert:#ff9c6e;
  --alert-hot:#ff6b6b;
  --ok:#8fe3b0;
  --cell:22px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(to right,  var(--paper-line-5) 0 1px, transparent 1px calc(var(--cell) * 5)),
    repeating-linear-gradient(to bottom, var(--paper-line-5) 0 1px, transparent 1px calc(var(--cell) * 5)),
    repeating-linear-gradient(to right,  var(--paper-line) 0 1px, transparent 1px var(--cell)),
    repeating-linear-gradient(to bottom, var(--paper-line) 0 1px, transparent 1px var(--cell));
  background-attachment:fixed;
  color:var(--cy);
  font-family:ui-monospace,"DejaVu Sans Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--cy);}

/* ---------- primitivos de prancheta ---------- */
.lbl{
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--cy-dim);font-weight:400;
}
.note{font-style:italic;color:#a9dcff;font-family:Georgia,"Times New Roman",serif;font-size:12.5px;letter-spacing:.01em;}
.box{border:1px solid var(--cy-faint);background:rgba(9,26,43,.72);}
.rule{height:1px;background:var(--cy-faint);border:0;margin:0;}
.mono-lg{font-size:22px;color:var(--ink);letter-spacing:.04em;}

/* cota / dimension line */
.dim{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;}
.dim-arm{display:block;width:14px;height:1px;background:var(--cy-dim);}
.dim-arm.long{width:26px;}
.dim-tip{font-size:10px;color:var(--cy-dim);line-height:1;}
.dim-val{font-size:12px;color:var(--ink);letter-spacing:.06em;white-space:nowrap;}
.dim-cap{display:block;width:1px;height:9px;background:var(--cy-dim);}

/* ---------- layout ---------- */
#app{max-width:1400px;margin:0 auto;padding:calc(var(--cell)) calc(var(--cell)) 80px;}

/* ---------- cabeçalho / carimbo ---------- */
.sheet-head{
  display:grid;grid-template-columns:1fr auto;gap:var(--cell);
  border:1px solid var(--cy-faint);padding:0;margin-bottom:calc(var(--cell)*1.4);
  background:rgba(9,26,43,.66);
}
.head-left{padding:14px 18px;}
.head-title{font-size:26px;color:var(--ink);letter-spacing:.12em;margin:2px 0 2px;}
.head-sub{margin-top:8px;}
.head-metrics{display:flex;flex-wrap:wrap;gap:26px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--cy-faint);}
.metric{min-width:104px;}
.metric .v{font-size:20px;color:var(--ink);letter-spacing:.05em;}
.metric .v.warnv{color:var(--alert);}

/* carimbo de aprovação */
.stamp{border-left:1px solid var(--cy-faint);display:grid;grid-template-columns:repeat(2,minmax(88px,1fr));align-content:start;}
.stamp .f{border-bottom:1px solid var(--cy-faint);border-left:1px solid var(--cy-faint);padding:6px 9px;}
.stamp .f:nth-child(2n+1){border-left:0;}
.stamp .f.wide{grid-column:1 / -1;}
.stamp .f .v{color:var(--ink);font-size:12px;letter-spacing:.06em;}
.stamp-mark{
  grid-column:1 / -1;padding:8px 9px 10px;text-align:center;
  border:1px solid var(--cy-faint);margin:8px;
  transform:rotate(-3.5deg);
}
.stamp-mark .t{font-size:11px;letter-spacing:.3em;color:var(--cy);}
.stamp-mark .s{font-size:9px;letter-spacing:.16em;color:var(--cy-dim);}

/* live */
#live{display:inline-flex;align-items:center;gap:7px;}
.led{width:8px;height:8px;border:1px solid var(--cy);display:inline-block;transform:rotate(45deg);}
.led.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 7px var(--ok);}
.led.off{background:var(--alert-hot);border-color:var(--alert-hot);}
.led.wait{background:transparent;}
#live.is-on .t{color:var(--ok);}
#live.is-off .t{color:var(--alert-hot);}
#live .t{font-size:10.5px;letter-spacing:.14em;text-transform:none;}

/* ---------- seções ---------- */
.section{margin-bottom:calc(var(--cell)*1.6);}
.section-bar{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.section-bar .n{font-size:9.5px;letter-spacing:.2em;color:var(--cy-dim);border:1px solid var(--cy-faint);padding:1px 6px;}
.section-bar h2{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);margin:0;font-weight:400;}
.section-bar .fill{flex:1;height:1px;background:var(--cy-faint);}

/* ---------- PENDENTES (domina o topo) ---------- */
.pending-zone{
  border:1px solid var(--cy);
  box-shadow:0 0 0 1px rgba(126,203,255,.12), 0 0 34px rgba(126,203,255,.08) inset;
  background:rgba(13,45,74,.78);
  padding:0;
}
.pending-zone > .pz-head{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  border-bottom:1px solid var(--cy-faint);
  background:repeating-linear-gradient(135deg,rgba(126,203,255,.10) 0 8px,transparent 8px 16px);
}
.pz-head .title{font-size:14px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;}
#pending-list{padding:16px;display:grid;gap:16px;}
.pending-card{border:1px solid var(--cy);background:rgba(9,26,43,.86);}
.pc-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--cy-faint);}
.pc-id{font-size:16px;color:var(--ink);letter-spacing:.04em;}
.pc-body{padding:14px 16px;display:grid;gap:14px;}
.pc-grid{display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(300px,1fr);gap:18px;}
@media(max-width:940px){.pc-grid{grid-template-columns:1fr;}}
.pc-actions{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  padding:12px 16px;border-top:1px dashed var(--cy-faint);
}
button[data-testid="dispatch-button"]{
  font-family:inherit;font-size:12px;letter-spacing:.24em;text-transform:uppercase;
  padding:10px 26px;background:transparent;color:var(--cy);
  border:1px solid var(--cy);cursor:not-allowed;opacity:.55;position:relative;
}
button[data-testid="dispatch-button"]:disabled{border-style:dashed;}
.empty-pending{
  padding:26px 18px;text-align:center;border:1px dashed var(--cy-faint);
}
.empty-pending .big{font-size:15px;color:var(--ink);letter-spacing:.18em;text-transform:uppercase;}

/* ---------- controles ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin-bottom:14px;}
.controls label{display:inline-flex;align-items:center;gap:6px;}
select,input[type=search]{
  font-family:inherit;font-size:12px;background:var(--bg-deep);color:var(--ink);
  border:1px solid var(--cy-faint);padding:5px 8px;letter-spacing:.04em;
}
select:focus,input:focus{outline:1px solid var(--cy);}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.chk input{accent-color:var(--cy);}

/* ---------- repo ---------- */
.repo-section{margin-bottom:var(--cell);border:1px solid var(--cy-faint);background:rgba(9,26,43,.55);}
.repo-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:9px 14px;border-bottom:1px solid var(--cy-faint);cursor:pointer;}
.repo-head:hover{background:rgba(126,203,255,.05);}
.repo-name{font-size:14px;color:var(--ink);letter-spacing:.08em;}
.repo-head .caret{font-size:10px;color:var(--cy-dim);width:12px;}
.repo-flags{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dispatch-list{padding:12px 14px;display:grid;gap:10px;}
.repo-section.collapsed .dispatch-list,.repo-section.collapsed .repo-diag{display:none;}
.repo-diag{padding:0 14px 10px;}
details.warnbox{margin:0 14px 12px;border:1px solid rgba(255,156,110,.4);background:rgba(255,156,110,.05);}
details.warnbox > summary{padding:6px 10px;cursor:pointer;color:var(--alert);font-size:10px;letter-spacing:.2em;text-transform:uppercase;list-style:none;}
details.warnbox > summary::-webkit-details-marker{display:none;}
details.warnbox ol{margin:0;padding:4px 10px 10px 30px;max-height:230px;overflow:auto;font-size:11.5px;color:#e7c4ae;}
.repo-error{margin:0 14px 12px;border:1px solid var(--alert-hot);background:rgba(255,107,107,.1);padding:8px 10px;color:#ffc9c9;font-size:12px;}

/* ---------- dispatch card ---------- */
.dispatch-card{border:1px solid var(--cy-faint);background:rgba(13,33,55,.7);}
.dispatch-card[data-state="open"]{border-left:3px solid var(--ok);}
.dispatch-card[data-state="closed"]{border-left:3px solid var(--cy-dim);}
.dispatch-card.alerting{border-left-color:var(--alert-hot);}
.dc-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;cursor:pointer;}
.dc-head:hover{background:rgba(126,203,255,.05);}
.dc-head .caret{font-size:10px;color:var(--cy-dim);width:12px;flex:none;}
.dc-id{color:var(--ink);font-size:12.5px;letter-spacing:.03em;}
.dc-goal{flex:1 1 240px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cy-dim);font-style:italic;font-family:Georgia,serif;}
.dc-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.dc-body{border-top:1px dashed var(--cy-faint);padding:14px 12px;display:none;gap:16px;}
.dispatch-card.open-detail .dc-body{display:grid;}
/* itens de grid não podem estourar a prancha: min-width auto é o culpado */
.dc-body > *,.pc-body > *,.pc-grid > *,.groups > *,.agents > *,.fields > *,
.dispatch-list > *,#pending-list > *,.sheet-head > *,.dc-head > *,.repo-head > *{min-width:0;}
.dc-body,.pc-body,.group,.agent,.blocktext,.tension,.closebox{overflow-wrap:anywhere;}

/* ---------- tags ---------- */
.tag{
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--cy-faint);padding:1px 6px;color:var(--cy-dim);white-space:nowrap;
}
.tag.live{color:#0d2137;background:var(--cy);border-color:var(--cy);font-weight:700;}
.tag.reserved{color:var(--cy-dim);border-style:dashed;}
.tag.state-open{color:var(--ok);border-color:rgba(143,227,176,.55);}
.tag.state-closed{color:var(--cy-dim);}
.tag.exit-resolved,.tag.exit-success{color:var(--ok);border-color:rgba(143,227,176,.5);}
.tag.exit-loop_ceiling_reached,.tag.exit-user_abort{color:var(--alert);border-color:rgba(255,156,110,.6);}
.tag.exit-error,.tag.exit-dissent_irreconcilable{color:#fff;background:rgba(255,107,107,.22);border-color:var(--alert-hot);}
.tag.legacy{color:var(--alert);border-color:rgba(255,156,110,.6);border-style:dashed;}
.tag.orphan{color:var(--alert-hot);border-color:var(--alert-hot);}
.tag.trunc{color:var(--cy-dim);border-style:dotted;}
.tag.conn{border-color:var(--cy-faint);}
.tag.conn .gl{color:var(--cy);letter-spacing:0;margin-right:4px;}

/* ---------- campos ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px 18px;}
.field .v{color:var(--ink);font-size:12px;word-break:break-word;}
.field .v.dimv{color:var(--cy-dim);}
.blocktext{border-left:1px solid var(--cy-faint);padding-left:12px;}
.blocktext .body{color:#cfe9ff;font-size:12.5px;margin-top:3px;}

/* eixo de tensão */
.tension{border:1px solid var(--cy-faint);background:rgba(126,203,255,.045);padding:8px 11px;}
.tension .ax{color:#ffe1a8;font-style:italic;font-family:Georgia,serif;font-size:12.5px;}

/* grupos / agentes */
.groups{display:grid;gap:12px;}
.group{border:1px solid var(--cy-faint);}
.group-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:7px 11px;border-bottom:1px solid var(--cy-faint);background:rgba(126,203,255,.05);}
.group-id{color:var(--ink);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));}
.agent{padding:10px 11px;border-right:1px solid var(--cy-faint);border-top:1px solid rgba(126,203,255,.12);}
.agent:last-child{border-right:0;}
.agent-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.agent-name{color:var(--ink);font-size:12.5px;}
.agent-name.anon{color:var(--cy-dim);font-style:italic;}
.role{font-size:9px;letter-spacing:.16em;text-transform:uppercase;border:1px solid;padding:0 5px;}
.role.explorer{color:#8fd3ff;border-color:#8fd3ff;}
.role.skeptic{color:var(--alert);border-color:var(--alert);}
.role.synthesizer{color:#c8b6ff;border-color:#c8b6ff;}
.role.writer{color:var(--ok);border-color:var(--ok);}
.role.auditor{color:#ffe1a8;border-color:#ffe1a8;}
.role.other{color:var(--cy-dim);border-color:var(--cy-faint);}
.agent-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--cy-dim);}
.agent-angle{margin-top:6px;font-style:italic;font-family:Georgia,serif;font-size:12px;color:#ffe1a8;border-left:1px solid rgba(255,225,168,.4);padding-left:8px;}
.agent-angle.none{color:var(--cy-dim);border-color:var(--cy-faint);}
.agent-prompt{margin-top:7px;font-size:11.5px;color:#b9d9f2;max-height:0;overflow:hidden;transition:none;}
.agent details > summary{cursor:pointer;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--cy-dim);margin-top:7px;list-style:none;}
.agent details > summary::-webkit-details-marker{display:none;}
.agent details p{margin:5px 0 0;font-size:11.5px;color:#b9d9f2;white-space:pre-wrap;}

/* diagrama */
.diagram-wrap{border:1px solid var(--cy-faint);background:rgba(9,26,43,.55);padding:6px 4px 2px;overflow-x:auto;}
.diagram-wrap svg{display:block;}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:6px 10px;border-top:1px dashed var(--cy-faint);}
.legend .li{display:flex;align-items:center;gap:6px;}

/* fechamento */
.closebox{border:1px solid var(--cy-faint);padding:9px 11px;}
.feedbacks{margin:6px 0 0;padding-left:18px;font-size:11.5px;color:#cfe9ff;}
.feedbacks li{margin-bottom:4px;}
.tree{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--cy-dim);margin-top:4px;}
.footnote{text-align:center;padding-top:20px;color:var(--cy-dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase;}
.loading{padding:60px;text-align:center;letter-spacing:.3em;text-transform:uppercase;color:var(--cy-dim);}
.more-btn{font-family:inherit;background:transparent;border:1px dashed var(--cy-faint);color:var(--cy);padding:6px 14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
.more-btn:hover{border-color:var(--cy);}
</style>
</head>
<body>

<!-- defs SVG globais (marcadores de seta reutilizados por todos os diagramas) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7ecbff"></path>
  </marker>
  <marker id="ah-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ff9c6e"></path>
  </marker>
  <marker id="ah-zz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ffe1a8"></path>
  </marker>
</defs></svg>

<div id="app" data-testid="app">
  <div class="loading">carregando prancha&hellip;</div>
</div>

<script>
"use strict";
(function(){

/* ============ util ============ */
var LIVE_TYPES = {research:1, review:1, experiment:1};
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function has(v){ return v!==null && v!==undefined && v!==""; }
function num(v){ return (typeof v==="number" && isFinite(v)) ? v : 0; }
function arr(v){ return Array.isArray(v) ? v : []; }
function fmtDate(s){
  if(!has(s)) return "—";
  var d = new Date(s);
  if(isNaN(d.getTime())) return String(s);
  function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
/* cota: linha com setas nas pontas */
function dim(value, extra){
  return '<span class="dim">'+
    '<span class="dim-tip">&#8592;</span><span class="dim-arm'+(extra?" long":"")+'"></span>'+
    '<span class="dim-cap"></span><span class="dim-val">'+esc(value)+'</span><span class="dim-cap"></span>'+
    '<span class="dim-arm'+(extra?" long":"")+'"></span><span class="dim-tip">&#8594;</span></span>';
}
function field(label, value, dimmed){
  return '<div class="field"><div class="lbl">'+esc(label)+'</div><div class="v'+(dimmed?" dimv":"")+'">'+
    (has(value)? esc(value) : "&mdash;")+'</div></div>';
}
function block(label, value){
  if(!has(value)) return "";
  return '<div class="blocktext"><div class="lbl">'+esc(label)+'</div><div class="body">'+esc(value)+'</div></div>';
}
function roleClass(r){
  return ({explorer:1,skeptic:1,synthesizer:1,writer:1,auditor:1})[r] ? r : "other";
}

/* ============ estado ============ */
var SNAP = null;
var UI = {
  repo: "__all__",
  state: "__all__",
  liveOnly: false,
  q: "",
  openCards: {},      // dispatch key -> true
  collapsedRepos: {}, // repo name -> true
  shown: {}           // repo name -> quantidade renderizada
};
var PAGE = 12;
var sseState = "wait"; // wait|on|off

/* ============ diagrama SVG de connections ============ */
function buildDiagram(groups, connections, keyPrefix){
  connections = arr(connections);
  var nodes = [], seen = {};
  arr(groups).forEach(function(g){
    var id = has(g && g.group_id) ? g.group_id : "(sem id)";
    if(seen[id]) return;
    seen[id] = true;
    nodes.push({id:id, n: has(g.n)? g.n : arr(g.agents).length, agents: arr(g.agents).length, ext:false});
  });
  connections.forEach(function(c){
    [c && c.from, c && c.to].forEach(function(id){
      if(has(id) && !seen[id]){ seen[id]=true; nodes.push({id:id, n:null, agents:0, ext:true}); }
    });
  });
  if(!nodes.length) return '<div class="note" style="padding:8px 10px">Sem grupos declarados — nada a desenhar.</div>';

  var idx = {}; nodes.forEach(function(nd,i){ idx[nd.id]=i; });

  var NW = 132, NH = 46, GAP = 62, PADX = 26, TOPBAND = 46, BOTBAND = 62;
  var w = PADX*2 + nodes.length*NW + Math.max(0,nodes.length-1)*GAP;
  var h = TOPBAND + NH + BOTBAND;
  var nodeY = TOPBAND, midY = TOPBAND + NH/2;
  function nx(i){ return PADX + i*(NW+GAP); }

  var s = [];
  s.push('<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="diagrama de conexões entre grupos">');

  /* arestas primeiro (por baixo dos nós) */
  connections.forEach(function(c, ci){
    var fi = idx[c && c.from], ti = idx[c && c.to];
    if(fi===undefined || ti===undefined) return;
    var type = has(c.type) ? String(c.type) : "sequential";
    var cap = has(c.loop_cap) ? ("×"+c.loop_cap) : "";
    var x1, x2, path, stroke, marker, dash="", labelX, labelY;

    if(type === "feedback" || ti < fi){
      /* curva tracejada voltando por baixo */
      x1 = nx(fi)+NW/2; x2 = nx(ti)+NW/2;
      var yb = nodeY + NH, dip = yb + 34 + (ci%2)*10;
      path = "M"+x1+","+yb+" C"+x1+","+dip+" "+x2+","+dip+" "+x2+","+yb;
      stroke = "#ff9c6e"; marker="ah-fb"; dash=' stroke-dasharray="6 4"';
      labelX = (x1+x2)/2; labelY = dip + 13;
    } else if(type === "zig-zag"){
      x1 = nx(fi)+NW; x2 = nx(ti);
      var span = x2-x1, steps = Math.max(4, Math.round(span/13)), amp = 7, d = "M"+x1+","+midY;
      for(var k=1;k<=steps;k++){
        var xx = x1 + span*(k/steps);
        var yy = midY + ((k%2)?-amp:amp);
        if(k===steps) yy = midY;
        d += " L"+xx.toFixed(1)+","+yy.toFixed(1);
      }
      path = d; stroke="#ffe1a8"; marker="ah-zz";
      labelX = (x1+x2)/2; labelY = midY - 15;
    } else {
      /* sequential: reta cheia (arco raso se salta nós) */
      x1 = nx(fi)+NW; x2 = nx(ti);
      if(ti - fi > 1){
        var top = nodeY - 24 - (ci%2)*9;
        x1 = nx(fi)+NW/2; x2 = nx(ti)+NW/2;
        path = "M"+x1+","+nodeY+" C"+x1+","+top+" "+x2+","+top+" "+x2+","+nodeY;
        labelX=(x1+x2)/2; labelY=top-4;
      } else {
        path = "M"+x1+","+midY+" L"+x2+","+midY;
        labelX=(x1+x2)/2; labelY=midY-8;
      }
      stroke="#7ecbff"; marker="ah";
    }
    s.push('<path d="'+path+'" fill="none" stroke="'+stroke+'" stroke-width="1"'+dash+' marker-end="url(#'+marker+')"></path>');
    var lab = type.toUpperCase() + (cap? " "+cap : "");
    s.push('<text x="'+labelX.toFixed(1)+'" y="'+labelY.toFixed(1)+'" fill="'+stroke+'" font-size="8" letter-spacing="1.4" text-anchor="middle" font-family="ui-monospace,monospace">'+esc(lab)+'</text>');
  });

  /* nós */
  nodes.forEach(function(nd,i){
    var x = nx(i);
    s.push('<rect x="'+x+'" y="'+nodeY+'" width="'+NW+'" height="'+NH+'" fill="#091a2b" stroke="'+(nd.ext?"#ff9c6e":"#7ecbff")+'" stroke-width="1"'+(nd.ext?' stroke-dasharray="3 3"':'')+'></rect>');
    /* cantos de marcação técnica */
    s.push('<path d="M'+x+','+(nodeY+7)+' L'+x+','+nodeY+' L'+(x+7)+','+nodeY+'" fill="none" stroke="#7ecbff" stroke-width="1.6"></path>');
    s.push('<path d="M'+(x+NW)+','+(nodeY+NH-7)+' L'+(x+NW)+','+(nodeY+NH)+' L'+(x+NW-7)+','+(nodeY+NH)+'" fill="none" stroke="#7ecbff" stroke-width="1.6"></path>');
    var label = nd.id.length>17 ? nd.id.slice(0,16)+"…" : nd.id;
    s.push('<text x="'+(x+NW/2)+'" y="'+(nodeY+20)+'" fill="#ffffff" font-size="10.5" text-anchor="middle" font-family="ui-monospace,monospace">'+esc(label)+'</text>');
    var sub = nd.ext ? "EXTERNO" : (num(nd.agents)||num(nd.n))+" AG · n="+(has(nd.n)?nd.n:"?");
    s.push('<text x="'+(x+NW/2)+'" y="'+(nodeY+34)+'" fill="#4e8ec0" font-size="8" letter-spacing="1.2" text-anchor="middle" font-family="ui-monospace,monospace">'+esc(sub)+'</text>');
    /* cota vertical do índice */
    s.push('<text x="'+(x+NW/2)+'" y="'+(nodeY-8)+'" fill="#4e8ec0" font-size="7.5" letter-spacing="1.4" text-anchor="middle" font-family="ui-monospace,monospace">N'+(i+1)+'</text>');
  });
  s.push('</svg>');

  var legend = '<div class="legend">'+
    '<span class="li"><svg width="34" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#7ecbff" stroke-width="1" marker-end="url(#ah)"></line></svg><span class="lbl">sequential</span></span>'+
    '<span class="li"><svg width="34" height="14"><polyline points="0,7 5,2 10,12 15,2 20,12 25,4 30,7" fill="none" stroke="#ffe1a8" stroke-width="1"></polyline></svg><span class="lbl" style="color:#ffe1a8">zig-zag</span></span>'+
    '<span class="li"><svg width="34" height="14"><path d="M2,3 C2,14 28,14 28,3" fill="none" stroke="#ff9c6e" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah-fb)"></path></svg><span class="lbl" style="color:#ff9c6e">feedback</span></span>'+
    '</div>';

  return '<div class="diagram-wrap">'+s.join("")+legend+'</div>';
}

/* ============ chips de conexão (estado recolhido) ============ */
function connChips(connections){
  var c = arr(connections);
  if(!c.length) return "";
  var counts = {};
  c.forEach(function(x){
    var t = has(x && x.type)? x.type : "sequential";
    counts[t] = (counts[t]||0) + 1;
  });
  var gl = {"sequential":"&#8594;", "zig-zag":"&#8767;", "feedback":"&#8630;"};
  var out = [];
  Object.keys(counts).forEach(function(t){
    out.push('<span class="tag conn"><span class="gl">'+(gl[t]||"&#8901;")+'</span>'+esc(t)+' '+counts[t]+'</span>');
  });
  return out.join("");
}

/* ============ grupos e agentes ============ */
function renderGroups(groups){
  var gs = arr(groups);
  if(!gs.length) return '<div class="note" style="padding:6px 0">Nenhum grupo declarado nesta row.</div>';
  return '<div class="groups">' + gs.map(function(g){
    var agents = arr(g.agents);
    var head = '<div class="group-head">'+
      '<span class="group-id">'+esc(has(g.group_id)?g.group_id:"(sem group_id)")+'</span>'+
      '<span class="lbl">n</span>'+dim(has(g.n)? g.n : agents.length)+
      (g.robot_talks ? '<span class="tag">robot_talks</span>' : "")+
      (has(g.layers) ? '<span class="tag">layers '+esc(g.layers)+'</span>' : "")+
      '</div>';
    var anti = '<div class="tension" style="margin:9px 11px 0">'+
      '<div class="lbl">Anti-bias do grupo &mdash; eixo de tensão</div>'+
      '<div class="ax">'+(has(g.anti_bias)? esc(g.anti_bias) : '<span style="color:var(--cy-dim)">não declarado para este grupo</span>')+'</div></div>';
    var body = agents.length ? '<div class="agents">'+agents.map(renderAgent).join("")+'</div>'
                             : '<div class="note" style="padding:8px 11px">Grupo sem agentes listados.</div>';
    return '<div class="group">'+head+anti+body+'</div>';
  }).join("") + '</div>';
}
function renderAgent(a){
  a = a || {};
  var nameHtml = has(a.agent_name)
    ? '<span class="agent-name">'+esc(a.agent_name)+'</span>'
    : '<span class="agent-name anon">sem persona</span>';
  var role = has(a.role)? String(a.role) : "—";
  var meta = '<div class="agent-meta">'+
      '<span><span class="lbl">modelo</span> '+esc(has(a.model)?a.model:"—")+'</span>'+
      '<span><span class="lbl">tokens</span> '+(has(a.token_budget)? dim(a.token_budget) : "&mdash;")+'</span>'+
    '</div>';
  var angle = has(a.angle)
    ? '<div class="agent-angle">&laquo; '+esc(a.angle)+' &raquo;</div>'
    : '<div class="agent-angle none">sem angle declarado</div>';
  var prompt = has(a.initial_prompt)
    ? '<details><summary>&#9656; prompt inicial'+(a._prompt_truncated?" (truncado)":"")+'</summary><p>'+esc(a.initial_prompt)+(a._prompt_truncated?" …":"")+'</p></details>'
    : "";
  return '<div class="agent">'+
    '<div class="agent-top">'+nameHtml+'<span class="role '+roleClass(role)+'">'+esc(role)+'</span></div>'+
    meta+angle+prompt+'</div>';
}

/* ============ dispatch ============ */
function dispatchMatches(d){
  if(UI.state === "open" && d._state !== "open") return false;
  if(UI.state === "closed" && d._state === "open") return false;
  if(UI.liveOnly && !d._live) return false;
  if(UI.q){
    var hay = ((d.dispatch_id||"")+" "+(d.goal||"")+" "+(d.dispatch_type||"")+" "+(d.anti_bias_global||"")).toLowerCase();
    if(hay.indexOf(UI.q) === -1) return false;
  }
  return true;
}
function renderDispatch(d, repoName){
  d = d || {};
  var state = (d._state === "open") ? "open" : "closed";
  var id = has(d.dispatch_id)? d.dispatch_id : "(sem dispatch_id)";
  var key = repoName + "::" + id;
  var isOpenDetail = !!UI.openCards[key];
  var close = d._close || null;
  var exit = close && has(close.exit_reason) ? String(close.exit_reason) : null;
  var alerting = exit === "error" || exit === "dissent_irreconcilable";
  var live = !!d._live;

  var right = [];
  right.push('<span class="tag state-'+state+'">'+(state==="open"?"aberta":"fechada")+'</span>');
  if(exit) right.push('<span class="tag exit-'+esc(exit)+'">'+esc(exit)+'</span>');
  right.push('<span class="tag '+(live?"live":"reserved")+'">'+(live?"live":"reservado")+'</span>');
  right.push('<span class="tag">'+esc(has(d.dispatch_type)? d.dispatch_type : "tipo?")+'</span>');
  if(d._legacy) right.push('<span class="tag legacy">legacy · sem groups</span>');
  if(d._orphan_close) right.push('<span class="tag orphan">close órfã</span>');
  if(d._prompts_truncated) right.push('<span class="tag trunc">prompts truncados</span>');
  right.push('<span class="lbl">ag</span>'+dim(has(d._agent_count)? d._agent_count : 0));

  var head = '<div class="dc-head" data-toggle-card="'+esc(key)+'">'+
      '<span class="caret">'+(isOpenDetail?"&#9660;":"&#9654;")+'</span>'+
      '<span class="dc-id">'+esc(id)+'</span>'+
      '<span class="dc-goal">'+(has(d.goal)? esc(d.goal) : "sem objetivo registrado")+'</span>'+
      '<span class="dc-right">'+ right.join("") + connChips(d.connections) +'</span>'+
    '</div>';

  var body = "";
  if(isOpenDetail){
    var parts = [];
    if(d._orphan_close){
      parts.push('<div class="repo-error" style="margin:0">CLOSE ÓRFÃ &mdash; existe uma close row sem a dispatch row correspondente no ledger. Nada foi apagado; a origem é que nunca foi escrita.</div>');
    }
    if(d._legacy){
      parts.push('<div class="note" style="border-left:1px solid rgba(255,156,110,.5);padding-left:10px;color:#ffc9a8">Row LEGACY (pré-v0.5.2): não traz o bloco <em>groups</em>. O que se vê abaixo é tudo que o ledger guardou.</div>');
    }
    parts.push('<div class="fields box" style="padding:10px 12px">'+
      field("criada", fmtDate(d.created))+
      field("invocada por", d.invoked_by)+
      field("schema", d.schema_version)+
      field("max_loops", d.max_loops)+
      field("aprovador final", d.final_approver)+
      field("repo", repoName)+
      field("working_folder", d.working_folder, true)+
      (has(d.parent_dispatch_id)? field("dispatch pai", d.parent_dispatch_id) : "")+
    '</div>');
    parts.push(block("Objetivo", d.goal));
    parts.push(block("Contexto", d.context));
    parts.push('<div class="tension"><div class="lbl">Anti-bias global &mdash; eixo de tensão</div><div class="ax">'+
      (has(d.anti_bias_global)? esc(d.anti_bias_global) : '<span style="color:var(--cy-dim)">não declarado</span>')+'</div></div>');
    parts.push('<div><div class="lbl" style="margin-bottom:6px">Diagrama de conexões</div>'+buildDiagram(d.groups, d.connections, key)+'</div>');
    parts.push('<div><div class="lbl" style="margin-bottom:6px">Grupos &amp; agentes</div>'+renderGroups(d.groups)+'</div>');

    if(close){
      var tree = (close.agents_spawned && close.agents_spawned.tree) || {};
      var treeHtml = Object.keys(tree).map(function(k){
        return '<span><span class="lbl">'+esc(k)+'</span> '+esc(tree[k])+'</span>';
      }).join("");
      var fbs = arr(close.feedback_prompts);
      parts.push('<div class="closebox">'+
        '<div class="lbl" style="margin-bottom:6px">Fechamento</div>'+
        '<div class="fields">'+
          field("encerrada em", fmtDate(close.closed))+
          '<div class="field"><div class="lbl">exit_reason</div><div class="v"><span class="tag exit-'+esc(exit||"")+'">'+esc(exit||"—")+'</span></div></div>'+
          field("agentes gerados", close.agents_spawned ? close.agents_spawned.total : null)+
          field("loops usados", close.agents_spawned ? close.agents_spawned.loops_used : null)+
        '</div>'+
        (treeHtml? '<div class="tree">'+treeHtml+'</div>' : "")+
        (fbs.length? '<div class="lbl" style="margin-top:8px">Feedback prompts ('+fbs.length+')</div><ol class="feedbacks">'+
            fbs.map(function(f){ return "<li>"+esc(f)+"</li>"; }).join("")+'</ol>' : "")+
      '</div>');
    } else {
      parts.push('<div class="closebox" style="border-color:rgba(143,227,176,.5)"><span class="lbl">Estado</span> '+
        '<span style="color:var(--ok)">ABERTA</span> <span class="note">&mdash; sem close row no ledger; a dispatch está viva.</span></div>');
    }
    body = '<div class="dc-body">'+parts.filter(Boolean).join("")+'</div>';
  } else {
    body = '<div class="dc-body"></div>';
  }

  return '<article class="dispatch-card'+(isOpenDetail?" open-detail":"")+(alerting?" alerting":"")+
    '" data-testid="dispatch-card" data-dispatch-id="'+esc(id)+'" data-state="'+state+'">'+head+body+'</article>';
}

        '<div class="metric"><div class="lbl">Abertas</div><div class="v" style="color:var(--ok)">'+open+'</div></div>'+

        '<div class="metric"><div class="lbl">Enlace ao vivo</div>'+
          '<div id="live" data-testid="live-indicator" class="is-'+sseState+'">'+
            '<span class="led '+sseState+'"></span><span class="t">'+esc(liveTxt)+'</span></div>'+
          '<div class="lbl" style="margin-top:2px">poll '+esc(has(cfg.poll_seconds)?cfg.poll_seconds:"?")+'s &middot; limite '+esc(has(cfg.limit)?cfg.limit:"?")+'/repo</div>'+
        '</div>'+

      '<div class="f"><div class="lbl">Folha</div><div class="v">01 / 01</div></div>'+

      '<div class="f wide"><div class="lbl">Desenhado por</div><div class="v">'+esc(drawnBy(repos, pendings))+'</div></div>'+
      '<div class="f wide"><div class="lbl">Data</div><div class="v">'+esc(fmtDate(new Date().toISOString()))+'</div></div>'+

    '</div>'+
  '</header>');

  /* ---- 01 · PENDENTES ---- */

    if(has(r.error)) flags.push('<span class="tag orphan">erro de leitura</span>');
    if(arr(r.warnings).length) flags.push('<span class="tag legacy">'+arr(r.warnings).length+' avisos</span>');
    if(arr(r.pending).length) flags.push('<span class="tag live">'+arr(r.pending).length+' pendente(s)</span>');

    out.push('<section class="repo-section'+(collapsed?" collapsed":"")+'" data-testid="repo-section" data-repo="'+esc(r.name)+'">'+
      '<div class="repo-head" data-toggle-repo="'+esc(r.name)+'">'+
        '<span class="caret">'+(collapsed?"&#9654;":"&#9660;")+'</span>'+
        '<span class="repo-name">'+esc(r.name)+'</span>'+
        '<span class="lbl">total</span>'+dim(num(r.total_dispatches))+
        '<span class="lbl">abertas</span>'+dim(num(r.open_dispatches))+
        '<span class="lbl">na prancha</span>'+dim(matches.length+" / "+arr(r.dispatches).length)+
        '<span class="repo-flags">'+flags.join("")+'</span>'+
      '</div>'+
      (has(r.error)? '<div class="repo-error">ERRO FATAL DE LEITURA: '+esc(r.error)+'</div>' : "")+
      (arr(r.warnings).length
        ? '<details class="warnbox"><summary>&#9656; '+arr(r.warnings).length+' aviso(s) não-fatais &mdash; rows antigas ilegíveis</summary><ol>'+
          arr(r.warnings).map(function(w){ return "<li>"+esc(w)+"</li>"; }).join("")+'</ol></details>'
        : "")+
      '<div class="dispatch-list" data-testid="dispatch-list">'+
        (slice.length ? slice.map(function(d){ return renderDispatch(d, r.name); }).join("")
                      : '<div class="note" style="padding:8px 2px">Nenhuma dispatch corresponde aos filtros neste repo'+
                        (arr(r.dispatches).length? "" : " (o ledger não devolveu rows)")+'.</div>')+
        (matches.length > slice.length
          ? '<div style="text-align:center;padding-top:4px"><button class="more-btn" data-more="'+esc(r.name)+'">mostrar mais &mdash; '+(matches.length-slice.length)+' restantes</button></div>'
          : "")+
      '</div>'+
    '</section>');
  });
  out.push('</section>');

  out.push('<div class="footnote">Prancha 01 &middot; leitor somente-leitura &middot; nenhuma escrita no ledger &middot; API 127.0.0.1:8765</div>');

  app.innerHTML = out.join("");
  wire();
}

function schemaRev(repos){
  var best = null;
  repos.forEach(function(r){ arr(r.dispatches).forEach(function(d){
    if(has(d.schema_version) && (best===null || String(d.schema_version) > best)) best = String(d.schema_version);
  }); });
  return best || "—";
}
function drawnBy(repos, pendings){
  var who = null;
  if(pendings.length && pendings[0].p.sheet) who = pendings[0].p.sheet.invoked_by;
  if(!who){ repos.some(function(r){ return arr(r.dispatches).some(function(d){
    if(has(d.invoked_by)){ who = d.invoked_by; return true; } return false; }); }); }
  return who || "—";
}

/* ============ eventos ============ */
/* O handler delegado mora no #app, que sobrevive a todo render.
   Por isso é ligado UMA única vez — religá-lo a cada render empilharia
   listeners e cada clique alternaria o mesmo estado N vezes. */
function bindOnce(){
  var app = document.getElementById("app");
  app.addEventListener("click", function(ev){
    var t = ev.target;
    if(!t || !t.closest) return;
    var more = t.closest("[data-more]");
    if(more){ var rn = more.getAttribute("data-more"); UI.shown[rn] = (UI.shown[rn]||PAGE) + 24; render(); return; }
    var dh = t.closest("[data-toggle-card]");
    if(dh){ var k = dh.getAttribute("data-toggle-card"); UI.openCards[k] = !UI.openCards[k]; render(); return; }
    var rh = t.closest("[data-toggle-repo]");
    if(rh){ var n = rh.getAttribute("data-toggle-repo"); UI.collapsedRepos[n] = !UI.collapsedRepos[n]; render(); return; }
  });
}

/* wire() religa só os controles, que são recriados a cada render */
function wire(){
  var fr = document.getElementById("f-repo");
  if(fr) fr.addEventListener("change", function(){ UI.repo = this.value; UI.shown = {}; render(); });
  var fs = document.getElementById("f-state");
  if(fs) fs.addEventListener("change", function(){ UI.state = this.value; UI.shown = {}; render(); });
  var fl = document.getElementById("f-live");
  if(fl) fl.addEventListener("change", function(){ UI.liveOnly = this.checked; UI.shown = {}; render(); });
  var fq = document.getElementById("f-q");
  if(fq) fq.addEventListener("input", function(){
    var self = this;
    clearTimeout(fq._t);
    fq._t = setTimeout(function(){
      UI.q = self.value.trim().toLowerCase(); UI.shown = {}; render();
      var el = document.getElementById("f-q");
      if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
    }, 220);
  });
}

/* ============ dados ============ */
function apply(data){ SNAP = data; render(); }

function loadOnce(){
  fetch("/api/snapshot", {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(apply)
    .catch(function(e){
      sseState = "off";
      if(!SNAP){
        document.getElementById("app").innerHTML =
          '<div class="loading" style="color:#ff6b6b">falha ao ler /api/snapshot &mdash; '+esc(e && e.message)+
          '<div id="live" data-testid="live-indicator" class="is-off" style="justify-content:center;margin-top:14px">'+
          '<span class="led off"></span><span class="t">SSE caído</span></div>'+
          '<div data-testid="total-count" style="margin-top:10px">0</div>'+
          '<div data-testid="pending-list"></div><div data-testid="dispatch-list"></div></div>';
      } else { render(); }
    });
}

function connect(){
  if(typeof EventSource === "undefined"){ sseState = "off"; setInterval(loadOnce, 5000); return; }
  var es;
  try { es = new EventSource("/api/stream"); }
  catch(e){ sseState = "off"; setInterval(loadOnce, 5000); return; }
  es.addEventListener("open", function(){ sseState = "on"; render(); });
  es.addEventListener("snapshot", function(ev){
    sseState = "on";
    try { apply(JSON.parse(ev.data)); } catch(e){ /* payload inválido: mantém o último bom */ }
  });
  es.addEventListener("error", function(){
    sseState = "off"; render();
    /* EventSource reconecta sozinho; se voltar, o handler de open reacende o LED */
  });
}

bindOnce();
loadOnce();
connect();

})();
</script>
