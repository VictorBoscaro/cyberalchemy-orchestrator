<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISPATCH CONTROL PLANE</title>
<style>
  /* ============================================================
     BRUTALIST / PRINT
     white #fff · ink #000 · one accent #ff2200
     thick borders · zero radius · hard offset shadow
     ============================================================ */

  :root{
    --ink:#000;
    --paper:#fff;
    --blood:#ff2200;
    --b:4px solid #000;
    --b3:3px solid #000;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Consolas", "Liberation Mono", monospace;
    --heavy: "Arial Black", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); }

  body{
    font-family:var(--mono);
    font-size:13px;
    line-height:1.45;
    -webkit-font-smoothing:none;
  }

  ::selection{ background:var(--blood); color:#fff; }

  h1,h2,h3,h4{
    font-family:var(--heavy);
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-0.035em;
    margin:0;
    line-height:0.92;
  }

  a{ color:var(--ink); }

  /* ---------- primitives ---------- */

  .tag{
    display:inline-block;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--heavy);
    font-weight:900;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 7px 2px;
    white-space:nowrap;
  }
  .tag.red{ background:var(--blood); color:#fff; }
  .tag.hollow{ background:var(--paper); color:var(--ink); border:2px solid var(--ink); padding:1px 5px; }
  .tag.hollow-red{ background:var(--paper); color:var(--blood); border:2px solid var(--blood); padding:1px 5px; }
  .tag.tilt{ transform:rotate(-1deg); }

  .rule{ border:0; border-top:var(--b); margin:0; }
  .rule.thin{ border-top:var(--b3); }
  .rule.red{ border-top:6px solid var(--blood); }

  .u{ text-decoration:underline; text-decoration-thickness:4px; text-underline-offset:4px; }

  .num{
    font-family:var(--heavy);
    font-weight:900;
    letter-spacing:-0.05em;
    line-height:0.8;
  }

  .lbl{
    font-family:var(--heavy);
    font-weight:900;
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
  }

  .mut{ opacity:0.55; }

  /* ---------- top ---------- */

  #app{ max-width:1500px; margin:0 auto; border-left:var(--b); border-right:var(--b); }

  .masthead{
    border-bottom:var(--b);
    padding:18px 20px 12px;
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
  }
  .masthead h1{ font-size:clamp(34px,6.4vw,86px); }
  .masthead .sub{ font-size:11px; letter-spacing:0.22em; text-transform:uppercase; margin-top:8px; }

  #live-indicator{
    display:inline-flex; align-items:center; gap:8px;
    border:var(--b); padding:7px 11px;
    font-family:var(--heavy); font-weight:900; font-size:12px;
    text-transform:uppercase; letter-spacing:0.06em;
    background:var(--paper);
    box-shadow:6px 6px 0 var(--ink);
  }
  #live-indicator .dot{ width:13px; height:13px; background:var(--ink); display:block; }
  #live-indicator.on{ background:var(--ink); color:var(--paper); }
  #live-indicator.on .dot{ background:var(--blood); }
  #live-indicator.off{ border-color:var(--blood); color:var(--blood); box-shadow:6px 6px 0 var(--blood); }
  #live-indicator.off .dot{ background:var(--blood); }

  /* ---------- scoreboard ---------- */

  .scoreboard{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); border-bottom:var(--b); }
  .score{ border-right:var(--b); padding:12px 14px 10px; }
  .score:last-child{ border-right:0; }
  .score .k{ font-size:clamp(38px,5.2vw,72px); }
  .score .n{ margin-top:6px; }
  .score.blood{ background:var(--blood); color:#fff; }
  .score.inverse{ background:var(--ink); color:var(--paper); }

  /* ---------- pending: dominates the top ---------- */

  .pending-zone{ border-bottom:var(--b); }
  .pending-head{
    background:var(--blood); color:#fff;
    padding:14px 20px 12px;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    border-bottom:var(--b);
  }
  .pending-head h2{ font-size:clamp(26px,4.6vw,58px); }
  .pending-head .stamp{
    background:var(--paper); color:var(--ink);
    border:var(--b3); padding:5px 10px;
    font-family:var(--heavy); font-weight:900; font-size:11px;
    letter-spacing:0.1em; text-transform:uppercase;
    transform:rotate(-1deg);
  }

  #pending-list{ display:block; }

  .pending-card{
    border-bottom:var(--b);
    padding:0;
    background:var(--paper);
  }
  .pending-card:last-child{ border-bottom:0; }

  .pc-top{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:14px 20px 10px;
  }
  .pc-title{ font-family:var(--heavy); font-weight:900; font-size:clamp(19px,2.5vw,32px); text-transform:uppercase; letter-spacing:-0.03em; line-height:1; }
  .pc-body{ padding:0 20px 16px; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:0; }
  @media(max-width:900px){ .pc-body{ grid-template-columns:1fr; } }
  .pc-col{ border:var(--b3); padding:12px 14px; margin-right:-3px; }
  .pc-col:last-child{ margin-right:0; }
  .pc-goal{ font-size:15px; font-weight:700; }

  .gate{
    border-top:var(--b);
    background:var(--ink); color:var(--paper);
    padding:12px 20px;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
  }
  .gate .why{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; }

  button[data-testid="dispatch-button"]{
    font-family:var(--heavy); font-weight:900;
    font-size:20px; letter-spacing:0.02em; text-transform:uppercase;
    background:var(--blood); color:#fff;
    border:var(--b); border-color:var(--paper);
    padding:11px 26px;
    cursor:not-allowed;
    box-shadow:7px 7px 0 var(--paper);
  }
  button[data-testid="dispatch-button"][disabled]{ opacity:1; }
  button[data-testid="dispatch-button"]::after{ content:" ▸"; }

  .empty-pending{
    padding:26px 20px;
    font-family:var(--heavy); font-weight:900;
    font-size:clamp(18px,3vw,34px); text-transform:uppercase; letter-spacing:-0.02em;
  }
  .empty-pending small{ display:block; font-family:var(--mono); font-weight:400; font-size:12px; letter-spacing:0.08em; margin-top:8px; text-transform:none; }

  /* ---------- filters ---------- */

  .filters{ border-bottom:var(--b); padding:12px 20px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .filters .lbl{ margin-right:4px; }
  .chip{
    font-family:var(--mono); font-size:11px; font-weight:700;
    background:var(--paper); color:var(--ink);
    border:var(--b3); padding:4px 9px;
    cursor:pointer; text-transform:uppercase; letter-spacing:0.04em;
  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
  .chip.blood[aria-pressed="true"]{ background:var(--blood); color:#fff; border-color:var(--blood); }
  .chip .c{ opacity:0.6; margin-left:5px; }
  input[type="search"]{
    font-family:var(--mono); font-size:12px;
    border:var(--b3); padding:5px 9px; min-width:230px;
    background:var(--paper); color:var(--ink); outline:none;
  }
  input[type="search"]:focus{ box-shadow:5px 5px 0 var(--blood); }

  /* ---------- repos / dispatches ---------- */

  .repo-section{ border-bottom:var(--b); }
  .repo-head{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:10px;
    padding:11px 20px 9px;
    background:var(--ink); color:var(--paper);
    cursor:pointer;
  }
  .repo-head h3{ font-size:clamp(16px,2.1vw,26px); }
  .repo-head .stats{ font-size:11px; letter-spacing:0.08em; margin-left:auto; text-transform:uppercase; }
  .repo-head .caret{ font-family:var(--heavy); font-weight:900; }

  .repo-issues{ border-bottom:var(--b3); padding:0 20px; }
  .repo-issues details{ padding:7px 0; }
  .repo-issues summary{ cursor:pointer; font-family:var(--heavy); font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; }
  .repo-issues .wlist{ margin:8px 0 4px; padding:9px 11px; border-left:6px solid var(--blood); background:var(--paper); max-height:190px; overflow:auto; font-size:11px; }
  .repo-issues .wlist div{ padding:1px 0; }
  .repo-err{ background:var(--blood); color:#fff; padding:8px 20px; font-weight:700; }

  .cards{ display:block; }

  .dispatch-card{ border-bottom:var(--b3); }
  .dispatch-card:last-child{ border-bottom:0; }
  .dispatch-card[data-state="open"]{ border-left:10px solid var(--blood); }
  .dispatch-card[data-state="closed"]{ border-left:10px solid var(--ink); }
  .dispatch-card.legacy{ background:repeating-linear-gradient(45deg,#fff,#fff 9px,#f0f0f0 9px,#f0f0f0 18px); }

  .dc-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:9px 14px; cursor:pointer; }
  .dc-head:hover{ background:var(--blood); color:#fff; }
  .dc-head:hover .tag{ background:#fff; color:var(--ink); }
  .dc-id{ font-family:var(--heavy); font-weight:900; font-size:14px; letter-spacing:-0.01em; }
  .dc-goal{ flex:1 1 340px; min-width:0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dc-meta{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; }

  .dc-detail{ display:none; padding:0 14px 16px; border-top:var(--b3); }
  .dispatch-card.expanded .dc-detail{ display:block; }
  .dispatch-card.expanded > .dc-head{ background:var(--ink); color:var(--paper); }
  .dispatch-card.expanded > .dc-head .tag{ background:var(--paper); color:var(--ink); }
  .dispatch-card.expanded > .dc-head .tag.red{ background:var(--blood); color:#fff; }

  .field{ border-bottom:var(--b3); padding:9px 0; }
  .field:last-child{ border-bottom:0; }
  .field .lbl{ display:block; margin-bottom:4px; }

  .kv{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:11px; padding:9px 0; border-bottom:var(--b3); }
  .kv b{ font-family:var(--heavy); font-weight:900; }

  /* group / agents */
  .group{ border:var(--b3); margin-top:14px; }
  .group-head{ background:var(--ink); color:var(--paper); padding:7px 11px; display:flex; flex-wrap:wrap; gap:9px; align-items:center; }
  .group-head .gid{ font-family:var(--heavy); font-weight:900; font-size:17px; text-transform:uppercase; }
  .antibias{ border-bottom:var(--b3); padding:9px 11px; border-left:10px solid var(--blood); }
  .antibias .lbl{ color:var(--blood); display:block; margin-bottom:3px; }

  .agents{ display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); }
  .agent{ border-right:var(--b3); border-bottom:var(--b3); padding:10px 11px; }
  .agent:last-child{ border-right:0; }
  .agent .who{ font-family:var(--heavy); font-weight:900; font-size:15px; text-transform:uppercase; letter-spacing:-0.02em; }
  .agent .specs{ font-size:10px; letter-spacing:0.07em; text-transform:uppercase; margin:5px 0 7px; }
  .angle{ border-left:6px solid var(--ink); padding:6px 9px; font-size:11.5px; background:var(--paper); }
  .angle .lbl{ display:block; }
  .prompt{ margin-top:8px; font-size:11px; border:2px dashed var(--ink); padding:7px 9px; max-height:130px; overflow:auto; white-space:pre-wrap; word-break:break-word; }

  /* connections */
  .conns{ margin-top:14px; border:var(--b3); }
  .conns .ch{ background:var(--ink); color:var(--paper); padding:5px 11px; }
  .conn{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:7px 11px; border-bottom:2px solid #000; font-size:12px; }
  .conn:last-child{ border-bottom:0; }
  .conn .node{ font-family:var(--heavy); font-weight:900; text-transform:uppercase; border:2px solid var(--ink); padding:2px 7px; }
  .conn .arrow{ font-family:var(--heavy); font-weight:900; font-size:15px; letter-spacing:-0.06em; }
  .conn.sequential .arrow{ color:var(--ink); }
  .conn.zigzag{ background:#f2f2f2; }
  .conn.zigzag .arrow{ color:var(--ink); }
  .conn.feedback{ background:var(--blood); color:#fff; }
  .conn.feedback .node{ border-color:#fff; }

  .close-box{ margin-top:14px; border:var(--b3); }
  .close-box .chd{ background:var(--ink); color:var(--paper); padding:5px 11px; }
  .close-box.alert{ border-color:var(--blood); }
  .close-box.alert .chd{ background:var(--blood); }
  .close-box .cb{ padding:9px 11px; }
  .fb{ border-left:6px solid var(--ink); padding:6px 9px; margin-top:7px; font-size:11.5px; }

  .more{
    width:100%; display:block; text-align:center;
    font-family:var(--heavy); font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;
    background:var(--paper); color:var(--ink); border:0; border-top:var(--b3);
    padding:10px; cursor:pointer;
  }
  .more:hover{ background:var(--ink); color:var(--paper); }

  .colophon{ padding:16px 20px 40px; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; }
</style>
</head>
<body>

<div id="app" data-testid="app">
  <div class="masthead">
    <div>
      <h1>Dispatch<br>Control&nbsp;Plane</h1>
      <div class="sub">Reader · phase 1 · read-only · human gate</div>
    </div>
    <div id="live-indicator" data-testid="live-indicator" class="off"><span class="dot"></span><span id="live-text">disconnected</span></div>
  </div>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="pending-zone">
    <div class="pending-head">
      <h2>Pending sheets</h2>
      <span class="stamp">awaiting human confirmation</span>
      <span class="tag tilt" style="background:#fff;color:#000" id="pending-count-tag">0</span>
    </div>
    <div id="pending-list" data-testid="pending-list"></div>
  </div>

  <div class="filters">
    <span class="lbl">Filter</span>
    <button class="chip blood" data-f="state" data-v="all" aria-pressed="true">All</button>
    <button class="chip blood" data-f="state" data-v="open" aria-pressed="false">Open</button>
    <button class="chip blood" data-f="state" data-v="closed" aria-pressed="false">Closed</button>
    <button class="chip blood" data-f="state" data-v="live" aria-pressed="false">Live</button>
    <button class="chip blood" data-f="state" data-v="reserved" aria-pressed="false">Reserved</button>
    <button class="chip blood" data-f="state" data-v="flagged" aria-pressed="false">Legacy/orphans</button>
    <input type="search" id="q" placeholder="search id / goal…" aria-label="search">
  </div>
  <div class="filters" id="repo-filters">
    <span class="lbl">Repos</span>
  </div>

  <div id="dispatch-list" data-testid="dispatch-list"></div>

  <div class="colophon">
    Source: <span id="src">/api/snapshot</span> · nothing is written by this page ·
    <span id="stamp-time">—</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  var LIVE_TYPES = { research:1, review:1, experiment:1 };
  var ALERT_REASONS = { error:1, dissent_irreconcilable:1, loop_ceiling_reached:1, user_abort:1 };
  var PAGE = 40;

  var snapshot = null;
  var byId = {};              // "repo␀id" -> dispatch
  var state = { st:"all", q:"", repos:null, shown:{}, collapsed:{} };

  function esc(s){
    if(s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function txt(v, fb){ return (v === null || v === undefined || v === "") ? (fb || "—") : String(v); }
  function arr(v){ return Array.isArray(v) ? v : []; }

  function shortDate(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso).slice(0,16);
    function p(n){ return (n<10?"0":"") + n; }
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function isLive(d){
    if(d && typeof d._live === "boolean") return d._live;
    return !!(d && LIVE_TYPES[d.dispatch_type]);
  }

  // ---------- scoreboard ----------

  function renderScoreboard(){
    var repos = arr(snapshot.repos);
    var total = 0, open = 0, pending = 0, live = 0, warn = 0, err = 0;
    repos.forEach(function(r){
      total += (r.total_dispatches || 0);
      open  += (r.open_dispatches || 0);
      pending += arr(r.pending).length;
      warn += arr(r.warnings).length;
      if(r.error) err++;
      arr(r.dispatches).forEach(function(d){ if(isLive(d)) live++; });
    });
    var cfg = snapshot.config || {};
    var cells = [
      { k: total, n: "dispatches in ledger", cls:"", tid:"total-count" },
      { k: open,  n: "open now", cls:"blood" },
      { k: pending, n: "pending sheets", cls: pending ? "blood" : "inverse" },
      { k: repos.length, n: "repos read (cfg " + txt(cfg.repo_count) + ")", cls:"" },
      { k: warn, n: "read warnings", cls:"" },
      { k: err, n: "fatal errors", cls: err ? "blood" : "" }
    ];
    document.getElementById("scoreboard").innerHTML = cells.map(function(c){
      return '<div class="score ' + c.cls + '"' + (c.tid ? ' data-testid="' + c.tid + '"' : "") + '>' +
             '<div class="num k">' + c.k + '</div>' +
             '<div class="n lbl">' + c.n + '</div></div>';
    }).join("");
  }

  // ---------- pending sheets ----------

  function agentBlock(a){
    var name = a.agent_name ? esc(a.agent_name) : "<span class='mut'>no name assigned</span>";
    var specs = [
      "role: " + esc(txt(a.role)),
      "model: " + esc(txt(a.model)),
      "tokens: " + esc(txt(a.token_budget))
    ].join(" · ");
    var angle = a.angle
      ? '<div class="angle"><span class="lbl">Angle</span>' + esc(a.angle) + '</div>'
      : '<div class="angle mut"><span class="lbl">Angle</span>not declared</div>';
    var prompt = a.initial_prompt
      ? '<div class="prompt">' + esc(a.initial_prompt) + (a._prompt_truncated ? "\n\n[…prompt truncated by reader]" : "") + '</div>'
      : "";
    return '<div class="agent">' +
             '<div class="who">' + name + '</div>' +
             '<div class="specs">' + specs + '</div>' +
             angle + prompt +
           '</div>';
  }

  function groupBlock(g, antiBiasMode){
    var agents = arr(g.agents);
    var flags = "";
    if(g.robot_talks) flags += '<span class="tag red">robot talks</span>';
    if(g.layers) flags += '<span class="tag">layers ' + esc(g.layers) + '</span>';
    return '<div class="group">' +
      '<div class="group-head">' +
        '<span class="gid">' + esc(txt(g.group_id, "group without id")) + '</span>' +
        '<span class="tag hollow" style="background:#000;color:#fff;border-color:#fff">n = ' + esc(txt(g.n, agents.length)) + '</span>' +
        flags +
      '</div>' +
      (g.anti_bias
        ? '<div class="antibias"><span class="lbl">Tension axis · group anti-bias</span>' + esc(g.anti_bias) + '</div>'
        : '<div class="antibias mut"><span class="lbl">Tension axis · group anti-bias</span>' + (antiBiasMode === "disabled" ? "anti-bias disabled" : "not recorded for this historical group") + '</div>') +
      (antiBiasMode === "enabled" ? '<div class="antibias mut" data-pairwise-status="' + (arr(g.anti_bias_pairs).length === (agents.length < 2 ? 0 : agents.length*(agents.length-1)/2) ? "complete" : "incomplete") + '">pairwise evidence ' + arr(g.anti_bias_pairs).length + '/' + (agents.length < 2 ? 0 : agents.length*(agents.length-1)/2) + ' pairs</div>' : '') +
      '<div class="agents">' + (agents.length ? agents.map(agentBlock).join("") : '<div class="agent mut">no agents</div>') + '</div>' +
    '</div>';
  }

  function connBlock(list){
    if(!arr(list).length) return "";
    var rows = arr(list).map(function(c){
      var t = String(c.type || "").toLowerCase();
      var cls, arrow, label;
      if(t === "feedback"){ cls = "feedback"; arrow = "◀╌╌╌╌"; label = "feedback"; }
      else if(t === "zig-zag" || t === "zigzag"){ cls = "zigzag"; arrow = "╱╲╱╲▶"; label = "zig-zag"; }
      else { cls = "sequential"; arrow = "━━━━▶"; label = t || "sequential"; }
      return '<div class="conn ' + cls + '">' +
        '<span class="node">' + esc(txt(c.from)) + '</span>' +
        '<span class="arrow">' + arrow + '</span>' +
        '<span class="node">' + esc(txt(c.to)) + '</span>' +
        '<span class="tag ' + (cls === "feedback" ? "" : "hollow") + '">' + esc(label) + '</span>' +
        (c.loop_cap ? '<span class="tag red">loop cap ' + esc(c.loop_cap) + '</span>' : "") +
      '</div>';
    }).join("");
    return '<div class="conns"><div class="ch lbl">Connections · typed edges</div>' + rows + '</div>';
  }

  function sheetBody(sheet, agentCount, live){
    var groups = arr(sheet.groups);
    var antiBiasMode = sheet.anti_bias_mode === "enabled" || sheet.anti_bias_mode === "disabled" ? sheet.anti_bias_mode : "historical";
    return '<div class="pc-body">' +
      '<div class="pc-col">' +
        '<span class="lbl">Goal</span>' +
        '<div class="pc-goal">' + esc(txt(sheet.goal)) + '</div>' +
        '<div class="field"><span class="lbl">Context</span>' + esc(txt(sheet.context)) + '</div>' +
        '<div class="field"><span class="lbl">Global anti-bias</span>' +
          (sheet.anti_bias_global ? esc(sheet.anti_bias_global) : '<span class="mut">not declared</span>') + '</div>' +
      '</div>' +
      '<div class="pc-col">' +
        '<div class="field"><span class="lbl">Type</span>' + esc(txt(sheet.dispatch_type)) + ' · ' + (live ? "LIVE" : "RESERVED") + '</div>' +
        '<div class="field"><span class="lbl">Anti-bias mode</span>' + esc(antiBiasMode) + '</div>' +
        '<div class="field"><span class="lbl">Agents</span><span class="num" style="font-size:38px">' + esc(txt(agentCount, groups.length)) + '</span></div>' +
        '<div class="field"><span class="lbl">Max loops</span>' + esc(txt(sheet.max_loops)) + '</div>' +
        '<div class="field"><span class="lbl">Final approver</span>' + esc(txt(sheet.final_approver)) + '</div>' +
        '<div class="field"><span class="lbl">Working folder</span>' + esc(txt(sheet.working_folder)) + '</div>' +
        '<div class="field"><span class="lbl">Invoked by</span>' + esc(txt(sheet.invoked_by)) + '</div>' +
      '</div>' +
    '</div>' +
    '<div style="padding:0 20px 18px">' +
      (groups.length ? groups.map(function(g){ return groupBlock(g, antiBiasMode); }).join("") : '<div class="group"><div class="antibias mut">sheet with no declared groups</div></div>') +
      connBlock(sheet.connections) +
    '</div>';
  }

  function renderPending(){
    var host = document.getElementById("pending-list");
    var items = [];
    arr(snapshot.repos).forEach(function(r){
      arr(r.pending).forEach(function(p){ items.push({ repo:r.name, p:p }); });
    });
    document.getElementById("pending-count-tag").textContent =
      items.length + (items.length === 1 ? " sheet" : " sheets");

    if(!items.length){
      host.innerHTML = '<div class="empty-pending">Zero pending sheets.' +
        '<small>No proposal is awaiting the human gate right now. When a sheet is written to <code>telemetry/agents/pending/</code>, it appears here at the top.</small></div>';
      return;
    }

    host.innerHTML = items.map(function(it, i){
      var p = it.p;
      var sheet = p.sheet || {};
      var antiBiasMode = sheet.anti_bias_mode === "enabled" || sheet.anti_bias_mode === "disabled" ? sheet.anti_bias_mode : "historical";
      var live = (typeof p._live === "boolean") ? p._live : !!LIVE_TYPES[sheet.dispatch_type];
      var err = p._error
        ? '<div class="repo-err">Error reading sheet: ' + esc(p._error) + '</div>'
        : "";
      return '<div class="pending-card" data-testid="pending-card" data-anti-bias-mode="' + esc(antiBiasMode) + '">' +
        err +
        '<div class="pc-top">' +
          '<span class="tag red tilt">pending</span>' +
          '<span class="pc-title">' + esc(txt(sheet.dispatch_id, p._file)) + '</span>' +
          '<span class="tag ' + (live ? "" : "hollow-red") + '">' + (live ? "live" : "reserved") + '</span>' +
          '<span class="tag hollow">' + esc(txt(sheet.dispatch_type)) + '</span>' +
          '<span class="tag hollow">repo: ' + esc(it.repo) + '</span>' +
          '<span class="tag hollow">' + esc(txt(p._agent_count, "?")) + ' agents</span>' +
          '<span class="tag hollow">schema ' + esc(txt(sheet.schema_version)) + '</span>' +
        '</div>' +
        sheetBody(sheet, p._agent_count, live) +
        '<div class="gate">' +
          '<button data-testid="dispatch-button" disabled title="confirm dispatch in Phase 2" ' +
            'aria-label="Dispatch — confirm dispatch in Phase 2">Dispatch</button>' +
          '<div class="why"><b>Phase 1 is a reader.</b><br>The button marks the place of the human gate — confirm dispatch in Phase 2.</div>' +
          '<div class="why" style="margin-left:auto">file: ' + esc(txt(p._file)) +
            (p._mtime ? '<br>mtime: ' + esc(shortDate(new Date(p._mtime * 1000).toISOString())) : "") + '</div>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  // ---------- filters ----------

  function matches(d){
    var s = state.st;
    if(s === "open" && d._state !== "open") return false;
    if(s === "closed" && d._state !== "closed") return false;
    if(s === "live" && !isLive(d)) return false;
    if(s === "reserved" && isLive(d)) return false;
    if(s === "flagged" && !(d._legacy || d._orphan_close)) return false;
    if(state.q){
      var hay = ((d.dispatch_id || "") + " " + (d.goal || "") + " " + (d.dispatch_type || "")).toLowerCase();
      if(hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function renderRepoFilters(){
    var host = document.getElementById("repo-filters");
    var repos = arr(snapshot.repos);
    if(state.repos === null){
      state.repos = {};
      repos.forEach(function(r){ state.repos[r.name] = true; });
    }
    var html = '<span class="lbl">Repos</span>' +
      '<button class="chip" data-repo="__all">all</button>' +
      '<button class="chip" data-repo="__none">none</button>';
    html += repos.map(function(r){
      var on = state.repos[r.name] !== false;
      return '<button class="chip" data-repo="' + esc(r.name) + '" aria-pressed="' + on + '">' +
        esc(r.name) + '<span class="c">' + (r.total_dispatches || 0) + '</span></button>';
    }).join("");
    host.innerHTML = html;
  }

  // ---------- dispatches ----------

  function dispatchCard(repoName, d){
    var key = repoName + "␀" + d.dispatch_id;
    var stt = d._state === "open" ? "open" : "closed";
    var live = isLive(d);
    var close = d._close || null;
    var reason = close ? (close.exit_reason || "") : "";
    var alert = ALERT_REASONS[reason] ? true : false;

    var tags = "";
    tags += '<span class="tag ' + (stt === "open" ? "red" : "") + '">' + (stt === "open" ? "open" : "closed") + '</span>';
    if(stt === "closed" && reason){
      tags += '<span class="tag ' + (alert ? "red" : "hollow") + '">' + esc(reason) + '</span>';
    }
    tags += '<span class="tag ' + (live ? "" : "hollow-red") + '">' + (live ? "live" : "reserved") + '</span>';
    if(d.dispatch_type) tags += '<span class="tag hollow">' + esc(d.dispatch_type) + '</span>';
    if(d._legacy) tags += '<span class="tag hollow-red">legacy · no groups</span>';
    if(d._orphan_close) tags += '<span class="tag red">orphan close</span>';

    return '<div class="dispatch-card' + (d._legacy ? " legacy" : "") + '" data-testid="dispatch-card" ' +
             'data-dispatch-id="' + esc(d.dispatch_id) + '" data-state="' + stt + '" data-key="' + esc(key) + '">' +
      '<div class="dc-head">' +
        '<span class="dc-id">' + esc(txt(d.dispatch_id)) + '</span>' +
        tags +
        '<span class="dc-goal">' + esc(txt(d.goal)) + '</span>' +
        '<span class="dc-meta">' + esc(txt(d._agent_count, 0)) + ' ag · ' + esc(shortDate(d.created || (close && close.closed))) + '</span>' +
        '<span class="caret" style="font-family:Arial Black,sans-serif;font-weight:900">+</span>' +
      '</div>' +
      '<div class="dc-detail"></div>' +
    '</div>';
  }

  function detailHTML(d){
    var close = d._close || null;
    var out = "";

    out += '<div class="kv">' +
      '<span><b>type</b> ' + esc(txt(d.dispatch_type)) + '</span>' +
      '<span><b>schema</b> ' + esc(txt(d.schema_version)) + '</span>' +
      '<span><b>anti-bias mode</b> ' + esc(d.anti_bias_mode || "historical") + '</span>' +
      '<span><b>created</b> ' + esc(shortDate(d.created)) + '</span>' +
      '<span><b>by</b> ' + esc(txt(d.invoked_by)) + '</span>' +
      '<span><b>max loops</b> ' + esc(txt(d.max_loops)) + '</span>' +
      '<span><b>approver</b> ' + esc(txt(d.final_approver)) + '</span>' +
      '<span><b>folder</b> ' + esc(txt(d.working_folder)) + '</span>' +
    '</div>';

    out += '<div class="field"><span class="lbl">Goal</span>' + esc(txt(d.goal)) + '</div>';
    if(d.context) out += '<div class="field"><span class="lbl">Context</span>' + esc(d.context) + '</div>';
    out += '<div class="field"><span class="lbl">Global anti-bias</span>' +
      (d.anti_bias_global ? esc(d.anti_bias_global) : '<span class="mut">' + (d.anti_bias_mode === "enabled" ? "required field missing" : (d.anti_bias_mode === "disabled" ? "disabled" : "historical row")) + '</span>') + '</div>';

    if(d._orphan_close){
      out += '<div class="field"><span class="lbl" style="color:#ff2200">Orphan close</span>' +
        'There is a close row without the corresponding dispatch row — the proposal was never written to the ledger, only the closure.</div>';
    }
    if(d._legacy){
      out += '<div class="field"><span class="lbl" style="color:#ff2200">Legacy row</span>' +
        'Row prior to v0.5.2: does not carry <code>groups</code>. Groups, agents and tension axes are unknown, not empty.</div>';
    }

    var groups = arr(d.groups);
    if(groups.length) out += groups.map(groupBlock).join("");
    else if(!d._legacy) out += '<div class="group"><div class="antibias mut">no declared groups</div></div>';

    out += connBlock(d.connections);

    if(close){
      var reason = close.exit_reason || "—";
      var alert = ALERT_REASONS[reason] ? true : false;
      var sp = close.agents_spawned || {};
      var tree = sp.tree && typeof sp.tree === "object"
        ? Object.keys(sp.tree).map(function(k){ return esc(k) + ": " + esc(sp.tree[k]); }).join(" · ")
        : "—";
      out += '<div class="close-box' + (alert ? " alert" : "") + '">' +
        '<div class="chd lbl">Closure · ' + esc(reason) + (alert ? " · ATTENTION" : "") + '</div>' +
        '<div class="cb">' +
          '<div class="kv" style="border-bottom:0;padding-top:0">' +
            '<span><b>closed at</b> ' + esc(shortDate(close.closed)) + '</span>' +
            '<span><b>agents spawned</b> ' + esc(txt(sp.total)) + '</span>' +
            '<span><b>loops used</b> ' + esc(txt(sp.loops_used)) + '</span>' +
          '</div>' +
          '<div class="field"><span class="lbl">Tree</span>' + tree + '</div>' +
          (arr(close.feedback_prompts).length
            ? '<div class="field"><span class="lbl">Feedback prompts</span>' +
              arr(close.feedback_prompts).map(function(f){ return '<div class="fb">' + esc(f) + '</div>'; }).join("") + '</div>'
            : "") +
        '</div></div>';
    } else if(d._state === "open"){
      out += '<div class="close-box alert"><div class="chd lbl">No close row · dispatch alive</div>' +
        '<div class="cb">No closure in the ledger. This dispatch remains open.</div></div>';
    }
    return out;
  }

  function renderDispatches(){
    var host = document.getElementById("dispatch-list");
    var html = "";
    byId = {};

    arr(snapshot.repos).forEach(function(r){
      if(state.repos && state.repos[r.name] === false) return;

      var list = arr(r.dispatches).filter(matches);
      list.forEach(function(d){ byId[r.name + "␀" + d.dispatch_id] = d; });

      var shown = state.shown[r.name] || PAGE;
      var slice = list.slice(0, shown);
      var collapsed = !!state.collapsed[r.name];

      html += '<section class="repo-section" data-testid="repo-section" data-repo="' + esc(r.name) + '">';
      html += '<div class="repo-head" data-toggle-repo="' + esc(r.name) + '">' +
        '<span class="caret">' + (collapsed ? "+" : "–") + '</span>' +
        '<h3>' + esc(r.name) + '</h3>' +
        (r.ledger_exists === false ? '<span class="tag red">no ledger</span>' : "") +
        '<span class="tag" style="background:#fff;color:#000">' + (r.total_dispatches || 0) + ' total</span>' +
        '<span class="tag red">' + (r.open_dispatches || 0) + ' open</span>' +
        (arr(r.pending).length ? '<span class="tag red tilt">' + arr(r.pending).length + ' pending</span>' : "") +
        '<span class="stats">showing ' + slice.length + ' of ' + list.length + ' (reader limits to ' + esc(txt((snapshot.config || {}).limit, 40)) + '/repo)</span>' +
      '</div>';

      if(r.error){
        html += '<div class="repo-err">FATAL READ ERROR: ' + esc(r.error) + '</div>';
      }
      if(arr(r.warnings).length){
        html += '<div class="repo-issues"><details><summary>' + arr(r.warnings).length +
          ' read warning(s) — tolerated rows</summary><div class="wlist">' +
          arr(r.warnings).map(function(w){ return '<div>' + esc(w) + '</div>'; }).join("") +
          '</div></details></div>';
      }

      if(!collapsed){
        html += '<div class="cards">';
        if(!slice.length){
          html += '<div style="padding:14px" class="mut">No dispatch matches the filter in this repo.</div>';
        } else {
          html += slice.map(function(d){ return dispatchCard(r.name, d); }).join("");
        }
        html += '</div>';
        if(list.length > slice.length){
          html += '<button class="more" data-more="' + esc(r.name) + '">Show more ' +
            Math.min(PAGE, list.length - slice.length) + ' ▾</button>';
        }
      }
      html += '</section>';
    });

    if(!html){
      html = '<div class="empty-pending">No repo selected.<small>Use the repo filters above.</small></div>';
    }
    host.innerHTML = html;
  }

  // ---------- events ----------

  document.addEventListener("click", function(ev){
    var t = ev.target;

    var head = t.closest ? t.closest(".dc-head") : null;
    if(head){
      var card = head.parentNode;
      card.classList.toggle("expanded");
      var det = card.querySelector(".dc-detail");
      if(card.classList.contains("expanded")){
        if(!det.getAttribute("data-filled")){
          var d = byId[card.getAttribute("data-key")];
          det.innerHTML = d ? detailHTML(d) : "<div class='mut'>detail unavailable</div>";
          det.setAttribute("data-filled", "1");
        }
        head.querySelector(".caret").textContent = "–";
      } else {
        head.querySelector(".caret").textContent = "+";
      }
      return;
    }

    var rh = t.closest ? t.closest("[data-toggle-repo]") : null;
    if(rh){
      var rn = rh.getAttribute("data-toggle-repo");
      state.collapsed[rn] = !state.collapsed[rn];
      renderDispatches();
      return;
    }

    if(t.hasAttribute && t.hasAttribute("data-more")){
      var mn = t.getAttribute("data-more");
      state.shown[mn] = (state.shown[mn] || PAGE) + PAGE;
      renderDispatches();
      return;
    }

    if(t.hasAttribute && t.hasAttribute("data-repo")){
      var rp = t.getAttribute("data-repo");
      if(rp === "__all"){ arr(snapshot.repos).forEach(function(r){ state.repos[r.name] = true; }); }
      else if(rp === "__none"){ arr(snapshot.repos).forEach(function(r){ state.repos[r.name] = false; }); }
      else { state.repos[rp] = state.repos[rp] === false; }
      renderRepoFilters();
      renderDispatches();
      return;
    }

    if(t.hasAttribute && t.getAttribute("data-f") === "state"){
      state.st = t.getAttribute("data-v");
      Array.prototype.forEach.call(document.querySelectorAll('[data-f="state"]'), function(b){
        b.setAttribute("aria-pressed", String(b === t));
      });
      state.shown = {};
      renderDispatches();
      return;
    }
  });

  var qEl = document.getElementById("q");
  var qTimer = null;
  qEl.addEventListener("input", function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){
      state.q = qEl.value.trim().toLowerCase();
      state.shown = {};
      renderDispatches();
    }, 160);
  });

  // ---------- live ----------

  function setLive(on, note){
    var el = document.getElementById("live-indicator");
    el.className = on ? "on" : "off";
    document.getElementById("live-text").textContent = on ? "live · connected" : ("no signal · " + (note || "disconnected"));
  }

  function renderAll(){
    renderScoreboard();
    renderPending();
    renderRepoFilters();
    renderDispatches();
    document.getElementById("stamp-time").textContent = "last read " + shortDate(new Date().toISOString());
  }

  function boot(){
    fetch("/api/snapshot")
      .then(function(r){ return r.json(); })
      .then(function(j){ snapshot = j; renderAll(); connect(); })
      .catch(function(e){
        snapshot = { repos: [], config: {} };
        renderAll();
        setLive(false, "failed to load snapshot");
      });
  }

  function connect(){
    if(typeof EventSource === "undefined"){ setLive(false, "no EventSource"); return; }
    var es;
    try { es = new EventSource("/api/stream"); }
    catch(e){ setLive(false, "stream unavailable"); return; }

    es.addEventListener("open", function(){ setLive(true); });
    es.addEventListener("snapshot", function(ev){
      try {
        snapshot = JSON.parse(ev.data);
        renderAll();
        setLive(true);
      } catch(e){ /* invalid payload: keep the last render */ }
    });
    es.addEventListener("error", function(){
      setLive(false, "reconnecting…");
    });
  }

  boot();
})();
</script>
</body>
</html>
