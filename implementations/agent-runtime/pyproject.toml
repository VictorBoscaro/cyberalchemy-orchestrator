[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberalchemy-agent-runtime"
version = "0.1.0"
description = "Experimental shadow runtime for sessions, reference scouts, and publication receipts."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_runtime*"]

