definitions:
  - definition_id: DEF-ACI-DETERMINISTIC-DISPATCH-001
    scope_id: CTX-ACI-ROOT
    term: deterministic dispatch
    statement: A confirmed immutable dispatch graph whose identities, dependencies, policies and allowed effects are interpreted by runtime code rather than supervised turn by turn by the chat agent.
    status: active-local
    evidence: ART-ACI-SPEC
  - definition_id: DEF-ACI-OFFICIAL-CONTRIBUTION-001
    scope_id: CTX-ACI-ROOT
    term: official bus contribution
    statement: A receipt-verified journal fact and immutable artifact accepted for an exact group, seat, operation, round and message type; raw provider output or a candidate alone is insufficient.
    status: active-local
    evidence: ART-ACI-SPEC
  - definition_id: DEF-ACI-PARKED-CONTINUATION-001
    scope_id: CTX-ACI-RESUMABLE-FEEDBACK
    term: parked continuation
    statement: Durable runtime state created after a physical attempt becomes terminal; it holds exact reconstruction and dependency evidence without keeping an agent invocation running or polling the bus.
    status: active-local
    evidence: ART-ACI-CONTINUATION-DECISION
  - definition_id: DEF-ACI-CONFIRMED-AUTHORITY-001
    scope_id: CTX-ACI-RESUMABLE-FEEDBACK
    term: confirmed dispatch authority
    statement: The immutable accepted DispatchSpec and expanded turn graph from which the runtime derives continuation, mapping and source-message identities; caller input and the legacy dispatch link are not substitutes.
    status: superseded
    evidence: ART-ACI-CONTINUATION-GATE
  - definition_id: DEF-ACI-CONFIRMATION-OBSERVATION-001
    scope_id: CTX-ACI-RESUMABLE-FEEDBACK
    term: confirmation observation
    statement: Immutable host-issued evidence that binds an authenticated human principal and interaction channel to the exact presented dispatch revision and digest; it becomes execution authority only after ConfirmRuntimeDispatch accepts it into a ConfirmedDispatch.
    status: active-local
    evidence: ART-ACI-ROBOT-TALKS-FINDINGS-001
  - definition_id: DEF-ACI-CANONICAL-EXECUTION-GRAPH-001
    scope_id: CTX-ACI-RESUMABLE-FEEDBACK
    term: canonical execution graph
    statement: The single canonical JSON compiled by the agent from user intent before confirmation. It contains topology and every execution-relevant value, including per-node names, objectives, exact prompts, context selection, provider/model/tools, budgets, sandbox/effects, data-flow and termination rules. Topology, basic and full chat presentations are deterministic views of the same complete graph; confirmation binds its full digest, and any material change requires a new digest and confirmation.
    status: active-local
    evidence: ART-ACI-LEDGER

